<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Dummy2Pro</title>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
<!--
    Einfache Entwicklungsseite zum parallelen Laden einzelner statischer
    Teilseiten und zum schnellen Prüfen von Assets außerhalb des normalen
    Thymeleaf-/Routing-Flows.
-->
<div class="mx-auto max-w-6xl px-6 py-10 space-y-8">
    <!-- Zielcontainer für separat geladene Teilseiten. -->
    <div id="register"></div>
    <div id="login"></div>
    <div id="dashboard"></div>
    <div id="room7"></div>
    <div id="headline"></div>
    <div id="endscreen"></div>
</div>

<!-- Bilddateien werden hier direkt eingebunden, um Asset-Pfade und Grafiken schnell manuell zu prüfen. -->
<img src="/images/lama.png" alt="lama" />
<img src="/images/catBlack.PNG" alt="cat" />
<img src="/images/catFar.png" alt="cat" />
<img src="/images/catWhite.PNG" alt="cat" />
<img src="/images/catWhiteShadow.PNG" alt="cat" />
<img src="/images/catRed.PNG" alt="Maike" />
<img src="/images/sunflower.PNG" alt="sunflower" />
<img src="/images/sunflowerCursed.PNG" alt="sunflower" />
<img src="/images/Herberg.PNG" alt="Herbert der Koala" />
<img src="/images/panda.PNG" alt="panda" />

<script>
    // Die Teilseiten werden bewusst unabhängig geladen, damit sich defekte Fragmente
    // beim Testen leichter isolieren lassen.
    fetch('/headline.html')
        .then(response => response.text())
        .then(headlineHTML => {
            document.getElementById('headline').innerHTML = headlineHTML;
        });

    fetch('/login.html')
        .then(response => response.text())
        .then(loginHTML => {
            document.getElementById('login').innerHTML = loginHTML;
        });

    fetch('/dashboard.html')
        .then(response => response.text())
        .then(dashboardHTML => {
            document.getElementById('dashboard').innerHTML = dashboardHTML;
        });

    fetch('/room7.html')
        .then(response => response.text())
        .then(room7HTML => {
            document.getElementById('room7').innerHTML = room7HTML;
        });

    fetch('/endscreen.html')
        .then(response => response.text())
        .then(endscreenHTML => {
            document.getElementById('endscreen').innerHTML = endscreenHTML;
        });
</script>
</body>
</html>
