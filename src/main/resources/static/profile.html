<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/sound-manager.js"></script>
    <script src="/js/ui-feedback.js"></script>
    <script src="/js/security.js"></script>
    <title>Dummy2Pro</title>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
<div class="mx-auto max-w-6xl px-6 py-10 space-y-8">

    <header class="flex items-start justify-between gap-4">
        <div class="flex items-start gap-4">
            <a
                    href="/dashboard"
                    class="mt-1 inline-flex items-center justify-center w-10 h-10 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 transition duration-200"
                    title="Zum Dashboard"
            >
                <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current text-white" aria-hidden="true">
                    <path d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
                </svg>
            </a>

            <div class="flex gap-6">
                <img id="currentProfileImage" src="/images/duck.jpg" alt="duck" class="w-20 h-20 rounded-full hover:cursor-pointer object-cover" />

                <div>
                    <h1 id="headlineTitle" class="text-3xl font-extrabold tracking-tight">Benutzerprofil</h1>
                    <p class="mt-2 text-slate-300">Hier kannst du deine Profil Einstellungen ändern</p>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3 flex-wrap justify-end">
            <button
                    type="button"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-1.5 px-3 rounded-lg transition duration-200"
                    onclick="logoutUser()"
            >
                Ausloggen
            </button>

            <button
                    type="button"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-1.5 px-3 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                    onclick="deleteUser()"
            >
                Account löschen
            </button>
        </div>
    </header>
    <div id="profilePageMessage" class="hidden"></div>

    <div class="bg-slate-800 border border-slate-700 shadow-xl rounded-2xl p-8" id="nameForm">
        <form class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300">
                    Ingame Name
                </label>
                <input
                        type="text"
                        id="currentNameInput"
                        class="mt-1 w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 focus:outline-none transition cursor-pointer"
                        placeholder="Dein Ingame Name"
                        readonly
                >
            </div>
            <button
                    type="button"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                    id="button"
            >
                Name ändern
            </button>
        </form>
    </div>

    <div class="bg-slate-800 border border-slate-700 shadow-xl rounded-2xl p-8 hidden" id="newNameForm">
        <form class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300">
                    Gebe deinen neuen Ingame Namen ein
                </label>
                <input
                        type="text"
                        id="newNameInput"
                        class="mt-1 w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 focus:outline-none transition"
                        placeholder="Dein neuer Ingame Name"
                >
            </div>
            <div class="flex gap-4">
                <button
                        type="button"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                        id="newNameButton"
                >
                    Neuen Namen bestätigen
                </button>

                <button
                        type="button"
                        class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 rounded-lg transition duration-200"
                        onclick="closeNameEdit()"
                >
                    Abbrechen
                </button>
            </div>
        </form>
    </div>

    <div class="flex justify-between gap-6">
        <button
                type="button"
                id="profilePicBtn"
                class="w-1/2 mt-6 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                onclick="openProfilePicEdit()"
        >
            Profilbild ändern
        </button>
        <button
                type="button"
                id="pwFormEnable"
                class="w-1/2 mt-6 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                onclick="showPwForm()"
        >
            Passwort ändern
        </button>
    </div>

    <div class="bg-slate-800 border border-slate-700 shadow-xl rounded-2xl p-8 space-y-6">
        <div>
            <h2 class="text-2xl font-bold">Avatar-Stil</h2>
            <p class="mt-2 text-slate-300">Wähle Form und Rahmen für deinen Avatar.</p>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Form</label>
                <select
                        id="avatarShapeSelect"
                        class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 focus:outline-none transition"
                >
                    <option value="circle">Kreis</option>
                    <option value="square">Viereck</option>
                    <option value="rounded-square">Abgerundetes Viereck</option>
                    <option value="triangle">Dreieck</option>
                    <option value="trapezoid">Trapez</option>
                    <option value="hexagon">6-Eck</option>
                    <option value="octagon">8-Eck</option>
                    <option value="diamond">Diamant</option>
                    <option value="star">Stern</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Rahmen</label>
                <select
                        id="avatarFrameSelect"
                        class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 focus:outline-none transition"
                >
                    <option value="default">Standard</option>
                    <option value="red">Rot</option>
                    <option value="orange">Orange</option>
                    <option value="amber">Amber</option>
                    <option value="yellow">Gelb</option>
                    <option value="lime">Lime</option>
                    <option value="green">Grün</option>
                    <option value="emerald">Emerald</option>
                    <option value="teal">Teal</option>
                    <option value="cyan">Cyan</option>
                    <option value="sky">Sky</option>
                    <option value="blue">Blau</option>
                    <option value="indigo">Indigo</option>
                    <option value="violet">Violett</option>
                    <option value="purple">Purple</option>
                    <option value="fuchsia">Fuchsia</option>
                    <option value="pink">Pink</option>
                    <option value="rose">Rose</option>
                    <option value="slate">Slate</option>
                    <option value="gray">Grau</option>
                    <option value="black">Schwarz</option>
                    <option value="bronze">Bronze</option>
                    <option value="silver">Silber</option>
                    <option value="gold">Gold</option>
                </select>
            </div>
        </div>

        <button
                type="button"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                onclick="saveAvatarStyle()"
        >
            Avatar-Stil speichern
        </button>
    </div>

    <div class="bg-slate-800 border border-slate-700 shadow-xl rounded-2xl p-8 space-y-5 hidden" id="passwordForm">
        <form class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300">
                    Aktuelles Passwort
                </label>
                <input
                        type="password"
                        class="mt-1 w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 focus:outline-none transition"
                        placeholder="Aktuelles Passwort"
                        id="pw"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300">
                    Neues Passwort
                </label>
                <input
                        type="password"
                        class="mt-1 w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 focus:outline-none transition"
                        placeholder="Neues Passwort"
                        id="newPw"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300">
                    Neues Passwort bestätigen
                </label>
                <input
                        type="password"
                        class="mt-1 w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 focus:outline-none transition"
                        placeholder="Neues Passwort bestätigen"
                        id="newPwConfirm"
                >
            </div>

            <div class="flex gap-4">
                <button
                        type="button"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                        onclick="saveNewPassword()"
                >
                    Passwort ändern
                </button>

                <button
                        type="button"
                        class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 rounded-lg transition duration-200"
                        onclick="closePwForm()"
                >
                    Abbrechen
                </button>
            </div>
        </form>
    </div>

    <div id="profilePicForm" class="hidden">
        <div id="profilePicGrid" class="w-full gap-6 pt-6 grid grid-cols-5">
            <img src="/images/Alf.png" onclick="setProfile('Alf.png', this)" alt="Alf" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/lama.png" onclick="setProfile('lama.png', this)" alt="lama" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/catBlack.PNG" onclick="setProfile('catBlack.PNG', this)" alt="cat" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/catWhiteShadow.PNG" onclick="setProfile('catWhiteShadow.PNG', this)" alt="cat" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/catRed.PNG" onclick="setProfile('catRed.PNG', this)" alt="Maike" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/sunflower.PNG" onclick="setProfile('sunflower.PNG', this)" alt="sunflower" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/sunflowerCursed.PNG" onclick="setProfile('sunflowerCursed.PNG', this)" alt="sunflower" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/Herberg.PNG" onclick="setProfile('Herberg.PNG', this)" alt="Herbert der Koala" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/panda.PNG" onclick="setProfile('panda.PNG', this)" alt="panda" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/bee.jpg" onclick="setProfile('bee.jpg', this)" alt="bee flying" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/beee.jpg" onclick="setProfile('beee.jpg', this)" alt="bee" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/beesleep.jpg" onclick="setProfile('beesleep.jpg', this)" alt="bee sleeping" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/block.jpg" onclick="setProfile('block.jpg', this)" alt="colourful blocks" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/duck.jpg" onclick="setProfile('duck.jpg', this)" alt="duck" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/flowers.jpg" onclick="setProfile('flowers.jpg', this)" alt="flowers" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/hase.jpg" onclick="setProfile('hase.jpg', this)" alt="hase" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/hase.PNG" onclick="setProfile('hase.PNG', this)" alt="hase2" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/maus.jpg" onclick="setProfile('maus.jpg', this)" alt="mouse" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/mond.jpg" onclick="setProfile('mond.jpg', this)" alt="mond" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/pingwin.jpg" onclick="setProfile('pingwin.jpg', this)" alt="penguin" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
            <img src="/images/subi.PNG" onclick="setProfile('subi.PNG', this)" alt="dog" class="w-full aspect-square object-cover hover:cursor-pointer hover:outline hover:outline-offset-2 hover:outline-4 hover:outline-indigo-600" />
        </div>

        <div class="flex gap-4 mt-6">
            <button
                    type="button"
                    id="saveNewProfilePic"
                    class="w-1/2 justify-center bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                    onclick="saveProfilePic()"
            >
                Neues Profilbild speichern
            </button>

            <button
                    type="button"
                    class="w-1/2 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 rounded-lg transition duration-200"
                    onclick="closeProfilePicEdit()"
            >
                Abbrechen
            </button>
        </div>
    </div>

    <div class="bg-slate-800 border border-slate-700 shadow-xl rounded-2xl p-8" id="runsSection">
        <div class="flex items-center justify-between gap-4 flex-wrap">
            <div>
                <h2 class="text-2xl font-bold">Spielstände</h2>
                <p class="mt-2 text-slate-300">Hier kannst du Spielstände auswählen, hinzufügen oder löschen.</p>
            </div>

            <button
                    type="button"
                    id="createRunBtn"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                    onclick="createNewRun()"
            >
                Spielstand hinzufügen
            </button>
        </div>

        <div id="runsContainer" class="mt-6 space-y-4">
            <div class="bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-3">
                Spielstände werden geladen...
            </div>
        </div>
    </div>

</div>

<script>
    const nameForm = document.getElementById('nameForm');
    const button = document.getElementById('button');
    const newNameForm = document.getElementById('newNameForm');
    const newNameButton = document.getElementById('newNameButton');
    const newNameInput = document.getElementById('newNameInput');
    const currentNameInput = document.getElementById('currentNameInput');
    const pwForm = document.getElementById('passwordForm');
    const pwFormEnable = document.getElementById('pwFormEnable');
    const profileForm = document.getElementById('profilePicForm');
    const profilePicBtn = document.getElementById('profilePicBtn');
    const createRunBtn = document.getElementById('createRunBtn');
    const runsContainer = document.getElementById('runsContainer');
    const currentProfileImage = document.getElementById('currentProfileImage');
    const avatarShapeSelect = document.getElementById('avatarShapeSelect');
    const avatarFrameSelect = document.getElementById('avatarFrameSelect');

    const userId = sessionStorage.getItem("userId");
    let selectedProfileImage = null;
    let currentAvatar = sessionStorage.getItem("avatar") || "duck.jpg";
    let currentRuns = [];

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
    }

    function showProfileMessage(message, type = "success") {
        window.Dummy2ProUI.setInlineMessage("profilePageMessage", message, type);
        const target = document.getElementById("profilePageMessage");
        target?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function clearProfileMessage() {
        window.Dummy2ProUI.clearInlineMessage("profilePageMessage");
    }

    async function showProfileSuccessModal(message, title = "Erfolgreich") {
        await window.Dummy2ProUI.notice(message, {
            title,
            okText: "OK",
            type: "success"
        });
    }

    function openNameEdit() {
        nameForm.classList.add("hidden");
        newNameForm.classList.remove("hidden");
        newNameInput.value = currentNameInput.value || "";
        newNameInput.focus();
    }

    function closeNameEdit() {
        newNameForm.classList.add("hidden");
        nameForm.classList.remove("hidden");
        newNameInput.value = "";
    }

    button.addEventListener("click", openNameEdit);
    currentNameInput.addEventListener("click", openNameEdit);
    newNameButton.addEventListener("click", saveNewName);
    avatarShapeSelect.addEventListener("change", applyAvatarPreviewStyle);
    avatarFrameSelect.addEventListener("change", applyAvatarPreviewStyle);

    function showPwForm() {
        pwForm.classList.remove("hidden");
        pwFormEnable.classList.add("hidden");
    }

    function closePwForm() {
        pwForm.classList.add("hidden");
        pwFormEnable.classList.remove("hidden");

        document.getElementById('pw').value = "";
        document.getElementById('newPw').value = "";
        document.getElementById('newPwConfirm').value = "";
    }

    function openProfilePicEdit() {
        profileForm.classList.remove("hidden");
        profilePicBtn.disabled = true;
        highlightSelectedAvatar(currentAvatar);
    }

    function closeProfilePicEdit() {
        profileForm.classList.add("hidden");
        profilePicBtn.disabled = false;
        selectedProfileImage = currentAvatar;
        highlightSelectedAvatar(currentAvatar);
    }

    function setProfile(imageName, clickedImage) {
        selectedProfileImage = imageName;

        document.querySelectorAll('#profilePicGrid img').forEach(img => {
            img.classList.remove('outline', 'outline-offset-2', 'outline-4', 'outline-indigo-600');
        });

        clickedImage.classList.add('outline', 'outline-offset-2', 'outline-4', 'outline-indigo-600');
    }

    function highlightSelectedAvatar(imageName) {
        document.querySelectorAll('#profilePicGrid img').forEach(img => {
            img.classList.remove('outline', 'outline-offset-2', 'outline-4', 'outline-indigo-600');

            const onclickValue = img.getAttribute('onclick') || '';
            if (onclickValue.includes(`'${imageName}'`)) {
                img.classList.add('outline', 'outline-offset-2', 'outline-4', 'outline-indigo-600');
                selectedProfileImage = imageName;
            }
        });
    }

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, options);

        let data = {};
        try {
            data = await response.json();
        } catch (e) {
            data = {};
        }

        if (!response.ok) {
            throw new Error(data.message || "Anfrage fehlgeschlagen.");
        }

        return data;
    }

    function updateProfileUi(profile) {
        const resolvedAvatar = profile.avatar || "duck.jpg";

        currentNameInput.value = profile.username || "";
        currentProfileImage.src = `/images/${resolvedAvatar}`;
        currentAvatar = resolvedAvatar;

        avatarShapeSelect.value = profile.avatarShape || "circle";
        avatarFrameSelect.value = profile.selectedAvatarFrame || "default";
        applyAvatarPreviewStyle();

        sessionStorage.setItem("username", profile.username || "");
        sessionStorage.setItem("avatar", resolvedAvatar);
        sessionStorage.setItem("avatarShape", profile.avatarShape || "circle");
        sessionStorage.setItem("selectedAvatarFrame", profile.selectedAvatarFrame || "default");

        highlightSelectedAvatar(resolvedAvatar);
    }

    function getAvatarShapeClasses(shape) {
        if (shape === "circle") {
            return ["rounded-full"];
        }

        if (shape === "square") {
            return ["rounded-none"];
        }

        if (shape === "rounded-square") {
            return ["rounded-2xl"];
        }

        if (shape === "triangle") {
            return ["[clip-path:polygon(50%_0%,100%_100%,0%_100%)]"];
        }

        if (shape === "trapezoid") {
            return ["[clip-path:polygon(20%_0%,80%_0%,100%_100%,0%_100%)]"];
        }

        if (shape === "hexagon") {
            return ["[clip-path:polygon(25%_6%,75%_6%,100%_50%,75%_94%,25%_94%,0%_50%)]"];
        }

        if (shape === "octagon") {
            return ["[clip-path:polygon(30%_0%,70%_0%,100%_30%,100%_70%,70%_100%,30%_100%,0%_70%,0%_30%)]"];
        }

        if (shape === "diamond") {
            return ["[clip-path:polygon(50%_0%,100%_50%,50%_100%,0%_50%)]"];
        }

        if (shape === "star") {
            return ["[clip-path:polygon(50%_0%,61%_35%,98%_35%,68%_57%,79%_91%,50%_70%,21%_91%,32%_57%,2%_35%,39%_35%)]"];
        }

        return ["rounded-full"];
    }

    function getAvatarFrameClass(frame) {
        const frameClassMap = {
            default: "bg-slate-500",
            red: "bg-red-500",
            orange: "bg-orange-500",
            amber: "bg-amber-500",
            yellow: "bg-yellow-400",
            lime: "bg-lime-500",
            green: "bg-green-500",
            emerald: "bg-emerald-500",
            teal: "bg-teal-500",
            cyan: "bg-cyan-500",
            sky: "bg-sky-500",
            blue: "bg-blue-500",
            indigo: "bg-indigo-500",
            violet: "bg-violet-500",
            purple: "bg-purple-500",
            fuchsia: "bg-fuchsia-500",
            pink: "bg-pink-500",
            rose: "bg-rose-500",
            slate: "bg-slate-400",
            gray: "bg-gray-400",
            black: "bg-black",
            bronze: "bg-[#cd7f32]",
            silver: "bg-[#c0c0c0]",
            gold: "bg-[#ffd700]"
        };

        return frameClassMap[frame] || "bg-slate-500";
    }

    function applyAvatarPreviewStyle() {
        const shape = avatarShapeSelect.value || "circle";
        const frame = avatarFrameSelect.value || "default";

        const shapeClasses = getAvatarShapeClasses(shape);
        const frameClass = getAvatarFrameClass(frame);

        let wrapper = currentProfileImage.parentElement;

        if (!wrapper || !wrapper.classList.contains("avatar-frame-shell")) {
            wrapper = document.createElement("div");
            wrapper.className = "avatar-frame-shell inline-flex items-center justify-center p-[4px] overflow-hidden transition-all duration-200";
            currentProfileImage.parentNode.insertBefore(wrapper, currentProfileImage);
            wrapper.appendChild(currentProfileImage);
        }

        wrapper.className = `avatar-frame-shell inline-flex items-center justify-center p-[4px] overflow-hidden transition-all duration-200 w-20 h-20 ${frameClass}`;
        wrapper.classList.add(...shapeClasses);

        currentProfileImage.className = "block w-full h-full object-cover transition-all duration-200";
        currentProfileImage.classList.add(...shapeClasses);
    }

    async function saveAvatarStyle() {
        try {
            const data = await apiRequest(`/api/user/me/avatar-style`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    avatarShape: avatarShapeSelect.value,
                    selectedAvatarFrame: avatarFrameSelect.value
                })
            });

            updateProfileUi(data);
            await showProfileSuccessModal("Avatar-Stil gespeichert.", "Avatar-Stil geändert");
        } catch (error) {
            showProfileMessage(error.message, "error");
        }
    }

    async function loadUserProfile() {
        const profile = await apiRequest(`/api/user/me`);
        updateProfileUi(profile);
    }

    async function saveNewName() {
        const newName = newNameInput.value.trim();

        clearProfileMessage();

        if (!newName) {
            showProfileMessage("Bitte gib einen neuen Namen ein.", "warning");
            return;
        }

        try {
            const data = await apiRequest(`/api/user/me/username`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: newName })
            });

            updateProfileUi(data);
            closeNameEdit();
            await showProfileSuccessModal("Name erfolgreich geändert.", "Name geändert");
        } catch (error) {
            showProfileMessage(error.message, "error");
        }
    }

    async function saveNewPassword() {
        const pw = document.getElementById('pw').value;
        const newPw = document.getElementById('newPw').value;
        const newPwConfirm = document.getElementById('newPwConfirm').value;

        if (!pw || !newPw || !newPwConfirm) {
            showProfileMessage("Bitte fülle alle Passwortfelder aus.", "warning");
            return;
        }

        try {
            const data = await apiRequest(`/api/user/me/password`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    currentPassword: pw,
                    newPassword: newPw,
                    newPasswordConfirm: newPwConfirm
                })
            });

            document.getElementById('pw').value = "";
            document.getElementById('newPw').value = "";
            document.getElementById('newPwConfirm').value = "";

            const loginFlashMessage =
                (data.message || "Passwort erfolgreich geändert.") + " Bitte melde dich jetzt mit dem neuen Passwort erneut an.";

            sessionStorage.clear();
            sessionStorage.setItem("loginFlash", loginFlashMessage);
            window.location.replace("/");
        } catch (error) {
            showProfileMessage(error.message, "error");
        }
    }

    async function deleteUser() {
        clearProfileMessage();

        const confirmed = await window.Dummy2ProUI.confirm("Willst du deinen Account wirklich endgültig löschen?", {
            title: "Account löschen",
            confirmText: "Endgültig löschen",
            cancelText: "Abbrechen",
            variant: "danger"
        });

        if (!confirmed) {
            return;
        }

        try {
            const data = await apiRequest(`/api/user/me?confirmation=CONFIRM`, {
                method: "DELETE"
            });

            localStorage.setItem("dummy2proRegisterFlash", data.message || "Benutzer erfolgreich gelöscht.");
            sessionStorage.clear();
            window.location.replace("/register.html");
        } catch (error) {
            showProfileMessage(error.message, "error");
        }
    }

    async function logoutUser() {
        clearProfileMessage();

        const confirmed = await window.Dummy2ProUI.confirm("Willst du dich wirklich ausloggen?", {
            title: "Ausloggen",
            confirmText: "Ausloggen",
            cancelText: "Abbrechen"
        });

        if (!confirmed) {
            return;
        }

        try {
            await apiRequest(`/api/user/logout`, {
                method: "POST"
            });
        } catch (error) {
            console.warn("Logout-API fehlgeschlagen:", error);
        }

        sessionStorage.clear();
        sessionStorage.setItem("loginFlash", "Du wurdest erfolgreich ausgeloggt.");
        window.location.replace("/");
    }

    async function saveProfilePic() {
        if (!selectedProfileImage) {
            showProfileMessage("Bitte zuerst ein Profilbild auswählen.", "warning");
            return;
        }

        try {
            const data = await apiRequest(`/api/user/me/avatar`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ avatar: selectedProfileImage })
            });

            updateProfileUi(data);
            profileForm.classList.add("hidden");
            await showProfileSuccessModal("Profilbild gespeichert.", "Profilbild geändert");
        } catch (error) {
            showProfileMessage(error.message, "error");
        }
    }

    function formatDateTime(value) {
        if (!value) {
            return "—";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleString("de-DE");
    }

    function getRunDisplayName(run, index) {
        const customName = (run?.displayName ?? "").trim();

        if (customName) {
            return customName;
        }

        return `Spielstand ${index + 1}`;
    }

    function toSortableTimestamp(value) {
        const timestamp = new Date(value).getTime();
        return Number.isNaN(timestamp) ? Number.MAX_SAFE_INTEGER : timestamp;
    }

    async function loadRuns() {
        try {
            const runs = await apiRequest(`/api/session/runs`);
            const activeRunId = sessionStorage.getItem("runId");

            if (!Array.isArray(runs) || runs.length === 0) {
                currentRuns = [];
                runsContainer.innerHTML = `
                    <div class="bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-3">
                        Noch keine Spielstände vorhanden.
                    </div>
                `;
                return;
            }

            const sortedRuns = [...runs].sort((a, b) => {
                const timeDiff = toSortableTimestamp(a.startedAt) - toSortableTimestamp(b.startedAt);

                if (timeDiff !== 0) {
                    return timeDiff;
                }

                return Number(a.runId ?? 0) - Number(b.runId ?? 0);
            });

            currentRuns = sortedRuns;

            runsContainer.innerHTML = currentRuns.map((run, index) => {
                const displayName = getRunDisplayName(run, index);
                const isActive = activeRunId && String(run.runId) === String(activeRunId);
                const statusText = run.finished ? "Abgeschlossen" : "In Bearbeitung";
                const statusClass = run.finished ? "bg-slate-600" : "bg-emerald-600";
                const deleteDisabled = currentRuns.length === 1;

                return `
                    <div class="bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-4 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                        <div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-bold">${escapeHtml(displayName)}</span>
                                <span class="${statusClass} text-white text-xs font-semibold px-2 py-1 rounded-full">${statusText}</span>
                                ${isActive ? '<span class="bg-indigo-600 text-white text-xs font-semibold px-2 py-1 rounded-full">Ausgewählt</span>' : ''}
                            </div>

                            <p class="mt-2 text-slate-300">Erstellt: ${formatDateTime(run.startedAt)}</p>
                            <p class="mt-1 text-slate-400">Beendet: ${formatDateTime(run.finishedAt)}</p>
                        </div>

                        <div class="flex gap-3 flex-wrap">
                            <button
                                type="button"
                                class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                                onclick="loadRun(${run.runId})"
                            >
                                Auswählen
                            </button>

                            <button
                                type="button"
                                class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200"
                                onclick="renameRun(${run.runId})"
                            >
                                Umbenennen
                            </button>

                            <button
                                type="button"
                                class="bg-red-600 hover:bg-red-500 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 shadow-lg shadow-red-600/20 disabled:bg-gray-700 disabled:shadow-none"
                                onclick="deleteRun(${run.runId})"
                                ${deleteDisabled ? "disabled" : ""}
                            >
                                Löschen
                            </button>
                        </div>
                    </div>
                `;
            }).join("");
        } catch (error) {
            runsContainer.innerHTML = `
                <div class="bg-slate-900 border border-red-500 text-red-300 rounded-lg px-4 py-3">
                    ${escapeHtml(error.message)}
                </div>
            `;
        }
    }

    async function renameRun(runId) {
        const run = currentRuns.find(entry => String(entry.runId) === String(runId));

        if (!run) {
            showProfileMessage("Spielstand nicht gefunden.", "error");
            return;
        }

        clearProfileMessage();

        const newName = await window.Dummy2ProUI.prompt(
            "Gib einen Namen für den Spielstand ein. Leer lassen = Standardname.",
            run.displayName ?? "",
            {
                title: "Spielstand umbenennen",
                confirmText: "Speichern",
                cancelText: "Abbrechen",
                placeholder: "Spielstandname"
            }
        );

        if (newName === null) {
            return;
        }

        try {
            await apiRequest(`/api/session/${runId}/name?userId=${userId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ displayName: newName })
            });

            await loadRuns();
            await showProfileSuccessModal("Spielstand wurde aktualisiert.", "Spielstand umbenannt");
        } catch (error) {
            showProfileMessage(error.message, "error");
        }
    }

    async function loadRun(runId) {
        try {
            const data = await apiRequest(`/api/session/load?userId=${userId}&runId=${runId}`, {
                method: "POST"
            });

            sessionStorage.setItem("sessionId", data.sessionId);
            sessionStorage.setItem("runId", String(data.runId));

            await loadRuns();
            showProfileMessage("Spielstand wurde geladen.", "success");
        } catch (error) {
            showProfileMessage(error.message, "error");
        }
    }

    async function createNewRun() {
        const originalText = createRunBtn.textContent;

        createRunBtn.disabled = true;
        createRunBtn.textContent = "Spielstand wird erstellt...";

        try {
            const data = await apiRequest(`/api/session/new?userId=${userId}`, {
                method: "POST"
            });

            sessionStorage.setItem("sessionId", data.sessionId);
            sessionStorage.setItem("runId", String(data.runId));

            await loadRuns();
            showProfileMessage("Neuer Spielstand wurde angelegt.", "success");
        } catch (error) {
            showProfileMessage(error.message, "error");
        } finally {
            createRunBtn.disabled = false;
            createRunBtn.textContent = originalText;
        }
    }

    async function deleteRun(runId) {
        const activeRunId = sessionStorage.getItem("runId");
        clearProfileMessage();

        const confirmed = await window.Dummy2ProUI.confirm("Soll dieser Spielstand wirklich gelöscht werden?", {
            title: "Spielstand löschen",
            confirmText: "Löschen",
            cancelText: "Abbrechen",
            variant: "danger"
        });

        if (!confirmed) {
            return;
        }

        try {
            const data = await apiRequest(`/api/game/${runId}?userId=${userId}`, {
                method: "DELETE"
            });

            if (activeRunId && String(activeRunId) === String(runId)) {
                sessionStorage.removeItem("runId");
                sessionStorage.removeItem("sessionId");
            }

            await loadRuns();
            showProfileMessage(data.message || "Spielstand erfolgreich gelöscht.", "success");
        } catch (error) {
            showProfileMessage(error.message, "error");
        }
    }

    async function initProfilePage() {
        let resolvedUserId = userId;

        if (!resolvedUserId) {
            const currentUser = await window.Dummy2ProSecurity.syncCurrentUser();
            resolvedUserId = currentUser?.userId ? String(currentUser.userId) : null;
        }

        if (!resolvedUserId) {
            showProfileMessage("Kein Benutzer gefunden. Bitte neu einloggen.", "error");
            window.location.href = "/";
            return;
        }

        await window.Dummy2ProSecurity.ensureCsrfToken();
        await loadUserProfile();
        await loadRuns();
    }

    initProfilePage();
</script>
</body>
</html>
