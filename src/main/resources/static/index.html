<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Dummy2Pro</title>
</head>

    <body class="min-h-screen bg-slate-950 text-slate-100">
        <div class="mx-auto max-w-6xl px-6 py-10">
            <div id="login"></div>
        </div>

        <script>
            fetch('/login.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('login.html konnte nicht geladen werden');
                    }
                    return response.text();
                })
                .then(loginHTML => {
                    document.getElementById('login').innerHTML = loginHTML;
                    initLoginForm();
                })
                .catch(error => {
                    document.getElementById('login').innerHTML =
                        '<p class="text-red-400">Fehler beim Laden der Login-Seite.</p>';
                    console.error(error);
                });
            function initLoginForm() {
                const form = document.getElementById("loginForm");

                if (!form) {
                    console.error("loginForm nicht gefunden.");
                    return;
                }

                form.addEventListener("submit", loginUser);
            }

            async function loginUser(event) {
                event.preventDefault();

                sessionStorage.removeItem("sessionId");
                sessionStorage.removeItem("runId");
                sessionStorage.removeItem("userId");
                sessionStorage.removeItem("username");

                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                try {
                    const response = await fetch("/api/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        alert(data.message || "Login fehlgeschlagen.");
                        return;
                    }

                    sessionStorage.setItem("userId", String(data.userId));
                    sessionStorage.setItem("username", data.username);

                    // Alte Session-/Run-Daten verwerfen.
                    // Das Dashboard lädt oder erstellt danach den AKTIVEN Spielstand.
                    sessionStorage.removeItem("sessionId");
                    sessionStorage.removeItem("runId");

                    window.location.href = "/dashboard";
                } catch (error) {
                    console.error("Login-Fehler:", error);
                    alert("Beim Login ist ein Fehler aufgetreten.");
                }
            }

        </script>
    </body>
</html>
