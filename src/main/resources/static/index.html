<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Dummy2Pro</title>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
<div class="mx-auto max-w-6xl px-6 py-10 space-y-8">

    <div id="register"></div>
    <div id="login"></div>
    <div id="headline"></div>
    <div id="dashboard"></div>
    <div id="room7"></div>
</div>

<script>
    fetch('/src/main/resources/static/headline.html')
        .then(response => {
            return response.text();
        })
        .then(headlineHTML => {
            document.getElementById('headline').innerHTML = headlineHTML;
        })

    fetch('/src/main/resources/static/register.html')
        .then(response => {
            return response.text();
        })
        .then(registerHTML => {
            document.getElementById('register').innerHTML = registerHTML;
        })

    fetch('/src/main/resources/static/login.html')
        .then(response => {
            return response.text();
        })
        .then(loginHTML => {
            document.getElementById('login').innerHTML = loginHTML;
        })

    fetch('/src/main/resources/templates/dashboard.html')
        .then(response => {
            return response.text();
        })
        .then(dashboardHTML => {
            document.getElementById('dashboard').innerHTML = dashboardHTML;
        })

    fetch('/src/main/resources/templates/room7.html')
        .then(response => {
            return response.text();
        })
        .then(room7HTML => {
            document.getElementById('room7').innerHTML = room7HTML;
        })

</script>
</body>
</html>
