<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Dummy2Pro</title>
</head>

    <body class="min-h-screen bg-slate-950 text-slate-100">
        <div class="mx-auto max-w-6xl px-6 py-10">
            <div id="login"></div>
        </div>

        <script>
            fetch('/headline.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('headline.html konnte nicht geladen werden');
                    }
                    return response.text();
                })
                .then(headlineHTML => {
                    document.getElementById('headline').innerHTML = headlineHTML;
                })
                .catch(error => {
                    console.error(error);
                });

            fetch('/login.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('login.html konnte nicht geladen werden');
                    }
                    return response.text();
                })
                .then(loginHTML => {
                    document.getElementById('login').innerHTML = loginHTML;
                })
                .catch(error => {
                    document.getElementById('login').innerHTML =
                        '<p class="text-red-400">Fehler beim Laden der Login-Seite.</p>';
                    console.error(error);
                });
        </script>
    </body>
</html>
