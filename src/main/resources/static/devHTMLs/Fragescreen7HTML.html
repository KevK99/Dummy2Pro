<style>
    .quiz-answer-btn .answer-label {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
        overflow: hidden;
        width: 100%;
    }

    .quiz-answer-btn.has-answer-tooltip:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: calc(100% - 24px);
        max-width: 520px;
        padding: 16px 18px;
        background: #09122a;
        color: #ffd60a;
        border: 4px solid #facc15;
        box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
        z-index: 50;
        white-space: normal;
        line-height: 1.4;
        font-size: 18px;
        text-align: left;
        pointer-events: none;
    }

    .quiz-answer-btn.has-answer-tooltip:hover::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(5, 10, 20, 0.25);
        z-index: 40;
        pointer-events: none;
    }
</style>

        <!-- QUESTION PANEL statisch -->
        <div class="absolute left-[30px] bottom-[30px] w-[830px] h-[520px] z-10">
            <div class="relative w-full h-full">

                <div class="absolute inset-0 bg-[#f5f8ff]"
                     style="clip-path: polygon(22px 0, calc(100% - 22px) 0, 100% 22px, 100% calc(100% - 22px), calc(100% - 22px) 100%, 22px 100%, 0 calc(100% - 22px), 0 22px);">
                </div>

                <div class="absolute inset-[5px] bg-[#0a1022]"
                     style="clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);">

                <div class="absolute inset-[16px] border border-[#1a2a52]"

                </div>

                <div class="relative h-full px-8 py-8 flex flex-col min-h-0">
                    <h2 class="text-lg font-black tracking-widest shrink-0">FRAGE</h2>

                    <div class="border-t border-white/20 mt-2 mb-5 shrink-0"></div>

                    <!-- statische Frage -->
                    <div id="questionText"
                         class="text-center leading-8 px-8 shrink-0 min-h-[72px] text-[clamp(18px,2vw,32px)]">
                        Welches Protokoll arbeitet auf Schicht 3 und wird für Routing verwendet?
                    </div>

                    <div class="text-sm text-gray-400 mt-6 mb-3 shrink-0">
                        ANTWORTEN
                    </div>

                    <!-- statische Antworten -->
                    <div id="answerContainer"
                         class="grid grid-cols-2 gap-4 flex-1 min-h-0 content-stretch">

                        <button class="quiz-answer-btn relative w-full h-full border-4 border-yellow-400 px-6 py-4 font-black text-yellow-400 text-left bg-[#09122a] flex items-center min-h-[120px]">
                            <div class="answer-label w-full leading-[1.35] text-[22px]">
                                A) IP
                            </div>
                        </button>

                        <button class="quiz-answer-btn relative w-full h-full border-4 border-yellow-400 px-6 py-4 font-black text-yellow-400 text-left bg-[#09122a] flex items-center min-h-[120px]">
                            <div class="answer-label w-full leading-[1.35] text-[22px]">
                                B) TCP
                            </div>
                        </button>

                        <button class="quiz-answer-btn relative w-full h-full border-4 border-yellow-400 px-6 py-4 font-black text-yellow-400 text-left bg-[#09122a] flex items-center min-h-[120px]">
                            <div class="answer-label w-full leading-[1.35] text-[22px]">
                                C) Ethernet
                            </div>
                        </button>

                        <button class="quiz-answer-btn relative w-full h-full border-4 border-yellow-400 px-6 py-4 font-black text-yellow-400 text-left bg-[#09122a] flex items-center min-h-[120px]">
                            <div class="answer-label w-full leading-[1.35] text-[22px]">
                                D) DNS
                            </div>
                        </button>
                    </div>

                    <!-- statisches Feedback -->
                    <div id="feedbackBox"
                         class="mt-4 text-center text-lg font-black min-h-[32px] shrink-0 text-emerald-400">
                        Richtig! +1 Punkt(e)

                    <div class="mt-4 flex justify-center gap-4 relative z-20 shrink-0">
                        <button id="submitAnswerBtn"
                                class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-black hover:bg-indigo-500">

                                class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-black hover:bg-emerald-500">
                            Nächste Frage
                        </button>
                    </div>
                </div>
