<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/sound-manager.js"></script>
    <title>Dummy2Pro - Registrierung</title>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
<div class="mx-auto max-w-6xl px-6 py-10">

    <!-- Eigenständige Registrierungsseite außerhalb des dynamisch geladenen Login-Flows. -->
    <header class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-4xl font-extrabold tracking-tight">Willkommen auf Dummy2Pro!</h1>
            <p class="mt-2 text-slate-300">Dein Weg zur AP2 🚀</p>
        </div>
    </header>

    <form id="registerForm"> <!-- relevant für die Spring Boot Connection -->
        <div class="pt-12">
            <label class="block font-medium text-white mb-3">
                Nutzername
            </label>
            <label>
                <!-- id ist relevant für die Spring Boot Connection -->
                <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Bitte gib einen Namen ein"
                        class="w-full text-purple-500 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        required
                >
            </label>
        </div>

        <div>
            <label class="block font-medium text-white pt-6 mb-3">
                Passwort
            </label>
            <label>
                <!-- id ist relevant für die Spring Boot Connection -->
                <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="••••••••"
                        class="w-full text-purple-500 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        required
                >
            </label>
        </div>

        <!-- Button braucht keinen onclick. relevant für die Spring Boot -->
        <button
                type="submit"
                class="w-full bg-indigo-600 text-white py-2 mt-6 rounded-lg hover:bg-indigo-500 transition duration-200 font-medium"
        >
            Registrieren
        </button>

        <!-- Validierungs- und Serverfehler bleiben direkt unter dem Formular sichtbar. -->
        <div id="registerErrorMessage" class="hidden mt-4"></div>
    </form>

    <div class="text-center text-sm text-gray-500 mt-6">
        Bereits ein Konto?
        <a href="/"
           class="text-indigo-500 hover:underline cursor-pointer"
        >
            Jetzt anmelden
        </a>
    </div>
</div>

<script>
    document.getElementById("registerForm").addEventListener("submit", registerUser);

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
    }

    function setRegisterMessage(message) {
        const element = document.getElementById("registerErrorMessage");
        if (!element) {
            return;
        }

        const safeMessage = escapeHtml(message);

        element.className = "mt-4 rounded-lg border border-rose-400/40 bg-rose-500/10 px-4 py-3 text-rose-100";
        element.innerHTML = `
            <div class="flex items-start gap-3">
                <span class="shrink-0 rounded-full px-3 py-1 text-[11px] font-extrabold uppercase tracking-[0.24em] bg-rose-400/15 text-rose-100 border border-rose-300/30">
                    Fehler
                </span>
                <p class="min-w-0 flex-1 text-sm font-medium leading-6">${safeMessage}</p>
            </div>
        `;
    }

    function clearRegisterMessage() {
        const element = document.getElementById("registerErrorMessage");
        if (!element) {
            return;
        }

        element.className = "hidden";
        element.innerHTML = "";
    }

    // damit das mit dem Backend interagiert.
    async function registerUser(event) {
        event.preventDefault();
        window.Dummy2ProSound?.play("register");

        clearRegisterMessage();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("/api/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            let data = {};
            try {
                data = await response.json();
            } catch (e) {
                data = {};
            }

            if (!response.ok) {
                setRegisterMessage(data.message || "Registrierung fehlgeschlagen.");
                return;
            }

            // Die Erfolgsmeldung wird für die nächste Login-Seite im sessionStorage
            // abgelegt, weil nach erfolgreicher Registrierung direkt weitergeleitet wird.
            sessionStorage.setItem(
                "loginFlash",
                data.message || `Registrierung erfolgreich für ${data.username || username}.`
            );
            window.location.href = "/";
        } catch (error) {
            setRegisterMessage("Verbindung zum Server fehlgeschlagen.");
            console.error(error);
        }
    }
</script>
</body>
</html>
