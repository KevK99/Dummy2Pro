<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::body}, 'min-h-screen bg-gradient-to-br from-pink-400 via-yellow-300 to-cyan-400 text-white font-mono tracking-wider dark:bg-none dark:from-transparent dark:via-transparent dark:to-transparent dark:bg-[#000010] overflow-x-hidden')}">

<body class="min-h-screen bg-gradient-to-br from-pink-400 via-yellow-300 to-cyan-400 text-white font-mono tracking-wider dark:bg-none dark:from-transparent dark:via-transparent dark:to-transparent dark:bg-[#000010] overflow-x-hidden">

<div th:replace="~{fragments/headline :: headline(${ 'Raum ' + roomId}, ${'Thema: ' + themeName}, ${avatarUrl}, null, null)}"></div>

<style>
    :root {
        --room-home-btn-bg: #ff00aa;
        --room-home-btn-hover-bg: #ff6a00;
        --room-home-btn-text: #ffffff;
        --room-home-btn-border: #fff200;
        --panda-tip-fill: #15A7F3;
    }

    html.dark {
        --room-home-btn-bg: #1e293b;
        --room-home-btn-hover-bg: #334155;
        --room-home-btn-text: #f8fafc;
        --room-home-btn-border: #475569;
        --panda-tip-fill: #15A7F3;
    }

    .panda-leaf-fill {
        fill: #EC4899;
    }

    html:not(.dark) .panda-leaf-fill {
        animation: room15TipChaos 1.2s linear infinite;
    }

    @keyframes room15TipChaos {
        0%   { fill: #22d3ee; }
        20%  { fill: #f472b6; }
        40%  { fill: #fde047; }
        60%  { fill: #4ade80; }
        80%  { fill: #a78bfa; }
        100% { fill: #22d3ee; }
    }

    @keyframes room15HeaderGlow {
        0% {
            background-position: 0% 50%;
        }
        50% {
            background-position: 100% 50%;
        }
        100% {
            background-position: 0% 50%;
        }
    }

    html:not(.dark) header {
        background: linear-gradient(90deg, #ff00aa 0%, #ff5f1f 18%, #fff200 35%, #39ff14 52%, #00f7ff 72%, #7c3aed 100%) !important;
        background-size: 260% 100%;
        animation: room15HeaderGlow 8s linear infinite;
        border-bottom: 3px solid rgba(255,255,255,0.22);
    }

    html:not(.dark) header h1 {
        color: #ffffff !important;
        text-shadow:
                0 0 10px rgba(255,255,255,0.35),
                0 0 18px rgba(255,0,170,0.24),
                0 0 26px rgba(0,247,255,0.18);
    }

    html:not(.dark) header p {
        color: #ecfeff !important;
        text-shadow: 0 0 10px rgba(0,247,255,0.22);
    }

    html:not(.dark) header a[href="/dashboard"],
    html:not(.dark) header a[href="/"],
    html:not(.dark) header .home-button,
    html:not(.dark) header [aria-label="Home"],
    html:not(.dark) header [title="Home"] {
        background: #ff00aa !important;
        border: 2px solid #fff200 !important;
        color: #ffffff !important;
        box-shadow:
                0 0 0 2px rgba(255,255,255,0.10),
                0 0 20px rgba(255, 0, 170, 0.50),
                0 0 34px rgba(255, 242, 0, 0.24) !important;
        transform: scale(1.08);
    }

    html:not(.dark) header a[href="/dashboard"]:hover,
    html:not(.dark) header a[href="/"]:hover,
    html:not(.dark) header .home-button:hover,
    html:not(.dark) header [aria-label="Home"]:hover,
    html:not(.dark) header [title="Home"]:hover {
        background: #ff6a00 !important;
        border-color: #00f7ff !important;
        transform: scale(1.14) rotate(-3deg);
        box-shadow:
                0 0 0 2px rgba(255,255,255,0.14),
                0 0 24px rgba(255, 106, 0, 0.45),
                0 0 40px rgba(0, 247, 255, 0.24) !important;
    }

    html:not(.dark) #dialogText {
        color: #67E8F9;
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.18);
    }

    html:not(.dark) #questionText {
        color: #FFF7ED;
    }

    html:not(.dark) #statusPanel {
        filter: none !important;
        box-shadow: none !important;
        outline: none !important;
        border-color: #f8fafc !important;
        background: repeating-linear-gradient(
                to bottom,
                #fef3c7 0px 14px,
                #fee2e2 14px 28px,
                #ffedd5 28px 42px,
                #fef9c3 42px 56px,
                #ecfccb 56px 70px,
                #dcfce7 70px 84px,
                #ccfbf1 84px 98px,
                #cffafe 98px 112px,
                #e0f2fe 112px 126px,
                #dbeafe 126px 140px,
                #e0e7ff 140px 154px,
                #ede9fe 154px 168px,
                #f3e8ff 168px 182px,
                #fae8ff 182px 196px,
                #fce7f3 196px 210px,
                #ffe4e6 210px 224px,
                #fecdd3 224px 238px,
                #fde68a 238px 252px,
                #bfdbfe 252px 266px,
                #a7f3d0 266px 280px,
                #bae6fd 280px 294px,
                #ddd6fe 294px 308px,
                #f9a8d4 308px 322px,
                #fdba74 322px 336px,
                #93c5fd 336px 350px
        ) !important;
    }

    html:not(.dark) #statusPanel > div,
    html:not(.dark) #statusPanel div {
        background-color: transparent !important;
        box-shadow: none !important;
    }

    html:not(.dark) #statusPanel h2 {
        color: #7f1dff !important;
        text-shadow:
                0 0 8px rgba(255,255,255,0.25),
                0 0 12px rgba(127,29,255,0.18);
    }

    html:not(.dark) #statusPanel p:nth-of-type(1) {
        color: #ff00aa !important;
    }

    html:not(.dark) #statusPanel p:nth-of-type(2) {
        color: #2563eb !important;
    }

    html:not(.dark) #statusPanel p:nth-of-type(3) {
        color: #0f766e !important;
    }

    html:not(.dark) #statusPanel p:nth-of-type(4) {
        color: #9333ea !important;
    }

    html:not(.dark) #statusPanel p:nth-of-type(5) {
        color: #ea580c !important;
    }

    html:not(.dark) #statusPanel p {
        text-shadow: 0 1px 0 rgba(255,255,255,0.20) !important;
    }

    html:not(.dark) #statusPanel span:nth-of-type(odd) {
        color: #0f172a !important;
    }

    html:not(.dark) #statusPanel span:nth-of-type(even) {
        color: #7c2d12 !important;
    }

    html:not(.dark) #statusPanel hr {
        border-color: rgba(15, 23, 42, 0.22) !important;
    }

    html:not(.dark) #statusPanel .w-full.border,
    html:not(.dark) #statusPanel .w-full.border-2,
    html:not(.dark) #statusPanel .w-full[class*="border"] {
        background: rgba(255,255,255,0.50) !important;
        border-color: #334155 !important;
        box-shadow: none !important;
    }

    html:not(.dark) #statusPanel [style*="width:"] {
        background: linear-gradient(90deg, #ec4899 0%, #f97316 20%, #eab308 40%, #22c55e 60%, #06b6d4 80%, #8b5cf6 100%) !important;
        box-shadow: none !important;
    }

    html:not(.dark) #statusPanel .rounded-xl:last-child,
    html:not(.dark) #statusPanel button:last-child {
        background: linear-gradient(90deg, #fef08a 0%, #fdba74 35%, #f9a8d4 70%, #a5f3fc 100%) !important;
        color: #4a044e !important;
        border: 2px solid #334155 !important;
        box-shadow: none !important;
    }

    html:not(.dark) #answerContainer .quiz-answer-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n+1),
    html:not(.dark) #answerContainer .gap-option-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n+1) {
        background: #F472B6;
        border-color: #FDE047;
        color: #4A044E;
    }

    html:not(.dark) #answerContainer .quiz-answer-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n+2),
    html:not(.dark) #answerContainer .gap-option-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n+2) {
        background: #22D3EE;
        border-color: #F97316;
        color: #082F49;
    }

    html:not(.dark) #answerContainer .quiz-answer-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n+3),
    html:not(.dark) #answerContainer .gap-option-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n+3) {
        background: #FDE047;
        border-color: #7C3AED;
        color: #422006;
    }

    html:not(.dark) #answerContainer .quiz-answer-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n+4),
    html:not(.dark) #answerContainer .gap-option-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n+4) {
        background: #4ADE80;
        border-color: #EC4899;
        color: #052E16;
    }

    html:not(.dark) #answerContainer .quiz-answer-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n+5),
    html:not(.dark) #answerContainer .gap-option-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n+5) {
        background: #A78BFA;
        border-color: #22D3EE;
        color: #1E1B4B;
    }

    html:not(.dark) #answerContainer .quiz-answer-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n),
    html:not(.dark) #answerContainer .gap-option-btn:not(.bg-yellow-400):not(.border-emerald-500):not(.border-red-500):nth-child(6n) {
        background: #FB923C;
        border-color: #38BDF8;
        color: #431407;
    }
</style>

<!-- WELCOME CONTAINER -->
<main id="welcomeContainer" class="flex justify-center mt-10">
    <div class="w-full max-w-6xl px-6 relative">
        <section
                class="relative border-[10px] border-[#050a14] shadow-2xl overflow-visible dark:bg-[#222a66]"
                style="
            background:
                linear-gradient(135deg, #ff7ac6 0%, #ffd84d 28%, #7cf3ff 58%, #a78bfa 100%);
            background-image:
                radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1px),
                radial-gradient(rgba(255,240,180,0.24) 1px, transparent 1px),
                radial-gradient(rgba(255,110,200,0.18) 1px, transparent 1px),
                radial-gradient(rgba(100,220,255,0.18) 1px, transparent 1px);
            background-size: 18px 18px, 18px 18px, 24px 24px, 24px 24px;
            background-position: 0 0, 9px 9px, 4px 4px, 12px 12px;
        ">

            <!-- FLOOR -->
            <div
                    class="absolute inset-12 border-4 border-white/30"
                    style="
                background:
                    linear-gradient(135deg, #3b0764 0%, #1e1b4b 35%, #0f172a 100%);
                background-image:
                    radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                    radial-gradient(rgba(244,114,182,0.14) 1px, transparent 1px),
                    radial-gradient(rgba(250,204,21,0.12) 1px, transparent 1px),
                    radial-gradient(rgba(34,211,238,0.10) 1px, transparent 1px);
                background-size: 20px 20px, 20px 20px, 24px 24px, 24px 24px;
                background-position: 0 0, 10px 10px, 5px 5px, 15px 15px;
            ">
            </div>

            <!-- ROOM CONTENT -->
            <div class="relative h-[560px] flex items-center justify-center">

                <!-- SPEECH PANEL -->
                <div id="speechPanel" class="absolute top-8 left-1/2 -translate-x-[42%] w-[62%] z-20 transition-all duration-300">
                    <div class="relative min-h-[150px]">
                        <!-- outer bubble -->
                        <div
                                class="absolute inset-0 bg-[#FCE7F3] dark:bg-[#f5f8ff]"
                                style="
                                clip-path: polygon(
                                    20px 0,
                                    calc(100% - 20px) 0,
                                    100% 20px,
                                    100% calc(100% - 20px),
                                    calc(100% - 20px) 100%,
                                    20px 100%,
                                    0 calc(100% - 20px),
                                    0 20px
                                );
                            ">
                        </div>

                        <!-- bubble fill -->
                        <div
                                class="absolute inset-[5px] bg-[#312E81] dark:bg-[#0a1022]"
                                style="
                                clip-path: polygon(
                                    18px 0,
                                    calc(100% - 18px) 0,
                                    100% 18px,
                                    100% calc(100% - 18px),
                                    calc(100% - 18px) 100%,
                                    18px 100%,
                                    0 calc(100% - 18px),
                                    0 18px
                                );
                            ">
                        </div>

                        <!-- inner stroke -->
                        <div
                                class="absolute inset-[14px] border border-[#22D3EE] dark:border-[#1a2a52]"
                                style="
                                clip-path: polygon(
                                    14px 0,
                                    calc(100% - 14px) 0,
                                    100% 14px,
                                    100% calc(100% - 14px),
                                    calc(100% - 14px) 100%,
                                    14px 100%,
                                    0 calc(100% - 14px),
                                    0 14px
                                );
                            ">
                        </div>

                        <!-- text -->
                        <div class="relative px-10 py-8 min-h-[150px]">
                            <div id="dialogText" class="text-lg leading-8 whitespace-pre-line pr-2 text-white">
                                Hey.
                            </div>
                        </div>
                    </div>

                    <!-- speech tail -->
                    <div id="speechTail" class="absolute left-[72%] -translate-x-1/2 top-full -translate-y-[1px] transition-all duration-300">
                        <!-- tail outer -->
                        <div
                                class="relative w-[40px] h-[34px] bg-[#FCE7F3] dark:bg-[#f5f8ff]"
                                style="
                                clip-path: polygon(
                                    0 0,
                                    100% 0,
                                    100% 55%,
                                    68% 100%,
                                    32% 100%,
                                    0 55%
                                );
                            ">
                            <!-- tail fill -->
                            <div
                                    class="absolute inset-[4px] bg-[#312E81] dark:bg-[#0a1022]"
                                    style="
                                    clip-path: polygon(
                                        0 0,
                                        100% 0,
                                        100% 55%,
                                        68% 100%,
                                        32% 100%,
                                        0 55%
                                    );
                                ">
                            </div>

                            <!-- tail inner stroke -->
                            <div
                                    class="absolute inset-[10px] border border-[#F472B6] dark:border-[#1a2a52]"
                                    style="
                                    clip-path: polygon(
                                        0 0,
                                        100% 0,
                                        100% 55%,
                                        68% 100%,
                                        32% 100%,
                                        0 55%
                                    );
                                ">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Troll-CHARACTER PANDA -->
                <div id="welcomePanda" class="absolute left-[120px] top-[180px] z-10 pointer-events-none">
                    <div id="welcomePandaInner" class="transition-all duration-700 ease-in-out flex flex-col items-center">
                        <div class="w-[170px] h-[30px] bg-white/40 rounded-full blur-sm"></div>

                        <svg class="w-[230px] mt-[-10px]" viewBox="0 0 24 24" shape-rendering="crispEdges">
                            <rect x="19" y="4" width="2" height="16" fill="#8b5a2b"/>
                            <rect x="18" y="3" width="4" height="2" fill="#8b5a2b"/>
                            <rect x="18" y="2" width="4" height="1" fill="#6f4421"/>
                            <rect x="19" y="1" width="2" height="2" class="panda-leaf-fill"/>

                            <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                            <rect x="8" y="4" width="8" height="6" fill="#e9f0ff"/>

                            <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                            <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                            <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                            <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                            <rect x="7" y="13" width="10" height="7" fill="#2b4aa8"/>

                            <rect x="5" y="14" width="2" height="3" fill="#e9f0ff"/>
                            <rect x="17" y="14" width="2" height="3" fill="#e9f0ff"/>

                            <rect x="8" y="20" width="3" height="2" fill="#e9f0ff"/>
                            <rect x="13" y="20" width="3" height="2" fill="#e9f0ff"/>
                        </svg>
                    </div>
                </div>

                <!-- Raum-CHARACTER -->
                <div class="absolute right-[140px] bottom-[95px] z-10">
                    <img
                            src="/room-characters/CatRaumchar.png"
                            alt="Raumcharakter Katze"
                            class="w-[150px]"
                            style="image-rendering: pixelated;"
                    >
                </div>

                <!-- SPIELERFIGUR -->
                <div
                        id="playerCharacter"
                        class="absolute left-1/2 -translate-x-1/2 bottom-[-170px] z-10 transition-all duration-[1800ms] ease-linear"
                >
                    <img
                            id="playerAvatar"
                            src="/images/Informatiker.png"
                            alt="Spielerfigur"
                            class="w-[150px]"
                            style="image-rendering: pixelated;"
                    >
                </div>

                <!-- CONTROLS -->
                <div class="absolute bottom-6 left-[calc(50%_-_120px)] z-20 flex gap-4">
                    <button id="dialogNextBtn"
                            class="bg-gradient-to-r from-pink-500 via-orange-400 to-cyan-400 text-white px-6 py-3 rounded-lg font-black hover:brightness-110">
                        Weiter
                    </button>

                    <button id="startQuizBtn"
                            class="hidden bg-gradient-to-r from-cyan-300 via-fuchsia-400 to-yellow-300 text-[#3B0764] px-6 py-3 rounded-lg font-black hover:brightness-110">
                        Prüfung beginnen
                    </button>
                </div>
            </div>

        </section>

        <!-- CORRIDOR -->
        <div class="absolute left-[calc(50%_-_120px)] top-[calc(100%_-_3rem)] w-28 h-[220px] z-0 pointer-events-none">
            <!-- linke Außenwand -->
            <div class="absolute left-0 top-0 w-[10px] h-full bg-[#FF00AA] dark:bg-[#222a66]"></div>

            <!-- linke Innenkante -->
            <div class="absolute left-[10px] top-0 w-[4px] h-full bg-[#00E5FF] dark:bg-[#8f9fa3]"></div>

            <!-- Mitte / Flurboden -->
            <div class="absolute left-[14px] top-0 w-[84px] h-full bg-[#0F172A] dark:bg-[#0a2a3a]"></div>

            <!-- rechte Innenkante -->
            <div class="absolute left-[98px] top-0 w-[4px] h-full bg-[#FFEE00] dark:bg-[#8f9fa3]"></div>

            <!-- rechte Außenwand -->
            <div class="absolute left-[102px] top-0 w-[10px] h-full bg-[#7C3AED] dark:bg-[#222a66]"></div>
        </div>
    </div>
</main>

<!-- GAME -->
<div id="gameContainer" class="bg-gradient-to-br from-pink-400 via-yellow-300 to-cyan-400 dark:bg-none dark:from-transparent dark:via-transparent dark:to-transparent dark:bg-[#000010] text-white font-mono tracking-wider hidden min-h-screen">
    <div id="gameScene"
            class="w-[1200px] h-[680px] mx-auto relative dark:bg-[#000010] overflow-visible"
            style="
            background: linear-gradient(135deg, #ff7ac6 0%, #ffd84d 28%, #7cf3ff 58%, #a78bfa 100%);
        ">

        <!-- ROOM CHARACTER -->
        <div id="gameRoomCharacter" class="absolute left-[105px] top-[-5px] z-20 pointer-events-none">
            <img
                    src="/room-characters/CatRaumchar.png"
                    alt="Raumcharakter Katze"
                    class="w-[110px]"
                    style="image-rendering: pixelated; transform: scaleX(-1);"
            >
        </div>

        <!-- PANDA -->
        <div id="gamePanda" class="absolute left-[80px] top-[-24px] z-50 pointer-events-none">
            <div id="gamePandaInner" class="transition-all duration-700 ease-in-out flex flex-col items-center">
                <div class="w-[130px] h-[22px] bg-white/60 rounded-full blur-sm"></div>

                <svg class="w-[160px] mt-[-8px]" viewBox="0 0 24 24" shape-rendering="crispEdges">
                    <rect x="19" y="4" width="2" height="16" fill="#8b5a2b"/>
                    <rect x="18" y="3" width="4" height="2" fill="#8b5a2b"/>
                    <rect x="18" y="2" width="4" height="1" fill="#6f4421"/>
                    <rect x="19" y="1" width="2" height="2" class="panda-leaf-fill"/>

                    <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                    <rect x="8" y="4" width="8" height="6" fill="#e9f0ff"/>

                    <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                    <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                    <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                    <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                    <rect x="7" y="13" width="10" height="7" fill="#2b4aa8"/>

                    <rect x="5" y="14" width="2" height="3" fill="#e9f0ff"/>
                    <rect x="17" y="14" width="2" height="3" fill="#e9f0ff"/>

                    <rect x="8" y="20" width="3" height="2" fill="#e9f0ff"/>
                    <rect x="13" y="20" width="3" height="2" fill="#e9f0ff"/>
                </svg>
            </div>
        </div>

        <!-- QUESTION PANEL -->
        <div th:replace="~{fragments/question-panel :: questionPanel(
            'bg-[#FCE7F3] dark:bg-[#f5f8ff]',
            'bg-[#312E81] dark:bg-[#0a1022]',
            'border-[#22D3EE] dark:border-[#1a2a52]',
            'bg-gradient-to-r from-pink-500 via-orange-400 to-cyan-400 text-white px-6 py-3 rounded-lg font-black hover:brightness-110 dark:bg-none dark:from-transparent dark:via-transparent dark:to-transparent dark:bg-[#22C55E] dark:text-white dark:hover:bg-[#16A34A]',
            'bg-gradient-to-r from-cyan-300 via-fuchsia-400 to-yellow-300 text-[#3B0764] px-6 py-3 rounded-lg font-black hover:brightness-110 dark:bg-none dark:from-transparent dark:via-transparent dark:to-transparent dark:bg-[#4ADE80] dark:text-white dark:hover:bg-[#22C55E]'
        )}"></div>

        <!-- STATUS PANEL -->
        <div th:replace="~{fragments/status-panel :: statusPanel(
            'bg-[#F0FDF4] dark:bg-[#f5f8ff]',
            'bg-[#166534] dark:bg-[#0b1327]',
            'border-[#22C55E] dark:border-[#1a2a52]',
            'bg-[#DCFCE7] text-[#14532D] dark:bg-yellow-400 dark:text-black font-black text-xs text-center py-3 rounded-xl'
        )}"></div>
    </div>
</div>

<script th:src="@{/js/darkmode.js}"></script>

<script th:inline="javascript">
    const roomId = /*[[${roomId}]]*/ 15;

    const userId = sessionStorage.getItem("userId");
    const runId = sessionStorage.getItem("runId");
    const sessionId = sessionStorage.getItem("sessionId");

    const playerCharacter = document.getElementById("playerCharacter");

    function animateWildPanda(element, keyframes, duration) {
        if (!element) {
            return;
        }

        element.style.transformOrigin = "center center";
        element.animate(keyframes, {
            duration,
            iterations: Infinity,
            direction: "alternate",
            easing: "ease-in-out"
        });
    }

    function renderQuestion(question) {

        submitAnswerBtn.classList.add("hidden");

        if (!question) {

                bg-[#312E81]
                dark:border-yellow-400
                dark:text-yellow-400
                dark:bg-[#09122a]
                flex items-center
            `;

            if (rows >= 4) {
    button.style.minHeight = "72px";
} else if (rows === 3) {
    button.style.minHeight = "92px";
} else if (rows === 2) {
    button.style.minHeight = "120px";
} else {
    button.style.minHeight = "150px";
}

            const label = document.createElement("div");
            label.className = "answer-label w-full leading-[1.35]";

    function renderGapQuestionText(question) {
        questionText.innerHTML = "";

        const gapFields = [...(question.gapFields || [])].sort((a, b) => a.gapIndex - b.gapIndex);

        const textFlow = document.createElement("div");
        textFlow.className = "flex flex-wrap items-center justify-center gap-x-2 gap-y-2 leading-[1.1] text-inherit";

        if (question.startText) {
            const startSpan = document.createElement("span");
            startSpan.textContent = question.startText;
            textFlow.appendChild(startSpan);
        }

        gapFields.forEach((gapField, gapIndex) => {
            const before = gapField.textBefore || "";
            const after = gapField.textAfter || "";

            if (before) {
                const beforeSpan = document.createElement("span");
                beforeSpan.textContent = before;
                textFlow.appendChild(beforeSpan);
            }

            const preview = document.createElement("button");
            preview.type = "button";
            preview.id = `gapPreview-${gapField.gapId}`;
            preview.dataset.gapId = gapField.gapId;
            preview.dataset.gapStep = gapIndex;
            preview.className = `
                relative inline-flex items-center justify-center
                min-w-[88px] max-w-full
                px-2.5 py-1
                border-2 border-dashed border-[#22D3EE]
                text-center font-black text-[#E0F2FE]
                bg-[#312E81]
                dark:border-white/40
                dark:text-yellow-300
                dark:bg-[#0a1022]
                transition
            `;
            preview.textContent = `[ Lücke ${gapIndex + 1} ]`;

            preview.addEventListener("click", () => {
                setActiveGapStep(gapIndex);
            });

            textFlow.appendChild(preview);

            if (after) {
                const afterSpan = document.createElement("span");
                afterSpan.textContent = after;
                textFlow.appendChild(afterSpan);
            }
        });

        if (question.endText) {
            const endSpan = document.createElement("span");
            endSpan.textContent = question.endText;
            textFlow.appendChild(endSpan);
        }

        questionText.appendChild(textFlow);
    }

    function renderGapQuestion(question) {
        answerContainer.className = "flex flex-col gap-2 min-h-0";

        if (!question.gapFields || question.gapFields.length === 0) {
            answerContainer.innerHTML = `
                <div class="text-center text-red-300">
                    GAP-Frage enthält keine Lückenfelder.
                </div>
            `;
            return;
        }

        const gapFields = [...question.gapFields].sort((a, b) => a.gapIndex - b.gapIndex);

        const currentGapLabel = document.createElement("div");
        currentGapLabel.id = "gapCurrentLabel";
        currentGapLabel.className = "text-xs text-gray-200 font-black tracking-wide shrink-0";
        answerContainer.appendChild(currentGapLabel);

        gapFields.forEach((gapField, gapIndex) => {
            const block = document.createElement("div");
            block.className = "hidden";
            block.dataset.gapOptionsStep = gapIndex;

            const options = [...(gapField.gapOptions || [])].sort((a, b) => a.optionOrder - b.optionOrder);
            const optionCount = options.length;

            let columnCount = 2;
            if (optionCount >= 7) {
                columnCount = 3;
            }

            const rowCount = Math.max(1, Math.ceil(optionCount / columnCount));

            let minHeight = 68;
            if (rowCount >= 4) {
                minHeight = 38;
            } else if (rowCount === 3) {
                minHeight = 46;
            } else if (rowCount === 2) {
                minHeight = 56;
            }

            const optionsWrap = document.createElement("div");
            optionsWrap.className = `grid ${columnCount === 3 ? "grid-cols-3" : "grid-cols-2"} gap-2`;
            optionsWrap.style.gridTemplateRows = `repeat(${rowCount}, minmax(0, 1fr))`;

            options.forEach((option, optionIndex) => {
                const button = document.createElement("button");
                button.type = "button";
                button.dataset.gapId = gapField.gapId;
                button.dataset.gapOptionId = option.gapOptionId;
                button.dataset.optionText = option.optionText;
                button.className = `
                    gap-option-btn
                    relative w-full
                    border-4 border-[#FDE047]
                    px-3 py-2
                    font-black text-[#FFF7ED] text-left
                    bg-[#312E81]
                    dark:border-yellow-400
                    dark:text-yellow-400
                    dark:bg-[#0a1022]
                    flex items-center
                `;
                button.style.minHeight = `${minHeight}px`;

                const label = document.createElement("div");
                label.className = "gap-option-label w-full leading-[1.15]";
                label.innerText = `${String.fromCharCode(65 + optionIndex)}) ${option.optionText}`;

                button.appendChild(label);

                button.addEventListener("click", () => {
                    selectGapOption(gapField.gapId, option.gapOptionId, button);
                });

                optionsWrap.appendChild(button);
            });

            block.appendChild(optionsWrap);
            answerContainer.appendChild(block);
        });

        const navWrap = document.createElement("div");
        navWrap.className = "mt-2 flex justify-between gap-3 shrink-0";

        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "gapPrevBtn";
        prevBtn.className = "bg-[#7C3AED] text-white px-5 py-2.5 rounded-lg font-black hover:bg-[#6D28D9]";
        prevBtn.innerText = "Zurück";

        prevBtn.addEventListener("click", () => {
            setActiveGapStep(currentGapStep - 1);
        });

        const stepBtn = document.createElement("button");
        stepBtn.type = "button";
        stepBtn.id = "gapStepBtn";
        stepBtn.className = "bg-[#EC4899] text-white px-5 py-2.5 rounded-lg font-black hover:bg-[#DB2777]";
        stepBtn.innerText = "Weiter";

        stepBtn.addEventListener("click", () => {
            if (!currentQuestion || !currentQuestion.gapFields) {
                return;
            }

            const sortedGapFields = [...currentQuestion.gapFields].sort((a, b) => a.gapIndex - b.gapIndex);

            if (currentGapStep >= sortedGapFields.length - 1) {
                submitAnswer();
            } else {
                setActiveGapStep(currentGapStep + 1);
            }
        });

        navWrap.appendChild(prevBtn);
        navWrap.appendChild(stepBtn);
        answerContainer.appendChild(navWrap);

        requestAnimationFrame(() => {
            setActiveGapStep(0);
            fitGapOptionTexts();
        });
    }

    function selectGapOption(gapId, gapOptionId, buttonElement) {
        selectedGapAnswersMap[gapId] = gapOptionId;

        selectedGapAnswers = Object.entries(selectedGapAnswersMap).map(([gapIdKey, gapOptionIdValue]) => ({
            gapId: Number(gapIdKey),
            selectedGapOptionId: Number(gapOptionIdValue)
        }));

        document.querySelectorAll(`[data-gap-id="${gapId}"][data-gap-option-id]`).forEach(btn => {
            btn.classList.remove("bg-yellow-400", "text-black", "ring-4", "ring-white/30");
        });

        buttonElement.classList.add("bg-yellow-400", "text-black", "ring-4", "ring-white/30");

        const preview = document.getElementById(`gapPreview-${gapId}`);
        if (preview) {
            const cleanedText = buttonElement.dataset.optionText || buttonElement.innerText.replace(/^[A-Z]\)\s*/, "");
            preview.innerText = cleanedText;
        }

        updateGapStepUI();
    }

    function setActiveGapStep(stepIndex) {
        if (!currentQuestion || !currentQuestion.gapFields || currentQuestion.gapFields.length === 0) {
            return;
        }

        const maxStep = currentQuestion.gapFields.length - 1;
        currentGapStep = Math.max(0, Math.min(stepIndex, maxStep));

        updateGapStepUI();
    }

    function updateGapStepUI() {
        if (!currentQuestion || !currentQuestion.gapFields || currentQuestion.gapFields.length === 0) {
            return;
        }

        const gapFields = [...currentQuestion.gapFields].sort((a, b) => a.gapIndex - b.gapIndex);
        const currentGap = gapFields[currentGapStep];

        document.querySelectorAll("[data-gap-options-step]").forEach(block => {
            const blockStep = Number(block.dataset.gapOptionsStep);
            block.classList.toggle("hidden", blockStep !== currentGapStep);
        });

        document.querySelectorAll("[data-gap-step]").forEach(preview => {
            const previewStep = Number(preview.dataset.gapStep);
            const gapId = Number(preview.dataset.gapId);
            const hasAnswer = selectedGapAnswersMap[gapId] !== undefined;

            preview.classList.remove(
                "border-dashed",
                "border-white/40",
                "dark:border-white/40",
                "border-[#22D3EE]",
                "border-[#FCE7F3]",
                "dark:border-yellow-400",
                "text-yellow-300",
                "dark:text-yellow-300",
                "text-[#E0F2FE]",
                "dark:text-white",
                "text-white",
                "bg-[#312E81]",
                "bg-[#EC4899]/20",
                "bg-[#22D3EE]/20",
                "dark:bg-[#0a1022]",
                "dark:bg-yellow-400/10",
                "dark:bg-indigo-500/20",
                "ring-2",
                "ring-white/40"
            );

            if (hasAnswer) {
                preview.classList.add(
                    "border-[#FCE7F3]",
                    "text-white",
                    "bg-[#EC4899]/20",
                    "dark:border-yellow-400",
                    "dark:text-white",
                    "dark:bg-yellow-400/10"
                );
            } else {
                preview.classList.add(
                    "border-dashed",
                    "border-[#22D3EE]",
                    "text-[#E0F2FE]",
                    "bg-[#312E81]",
                    "dark:border-white/40",
                    "dark:text-yellow-300",
                    "dark:bg-[#0a1022]"
                );
            }

            if (previewStep === currentGapStep) {
                preview.classList.add(
                    "bg-[#22D3EE]/20",
                    "ring-2",
                    "ring-white/40",
                    "dark:bg-indigo-500/20"
                );
            }
        });

        const currentGapLabel = document.getElementById("gapCurrentLabel");
        if (currentGapLabel) {
            const selectedCount = selectedGapAnswers.length;
            const totalCount = gapFields.length;
            currentGapLabel.innerText = `LÜCKE ${currentGapStep + 1} VON ${totalCount}  •  AUSGEWÄHLT: ${selectedCount}/${totalCount}`;
        }

        const prevBtn = document.getElementById("gapPrevBtn");
        if (prevBtn) {
            prevBtn.disabled = currentGapStep === 0;
            prevBtn.classList.toggle("opacity-50", currentGapStep === 0);
            prevBtn.classList.toggle("cursor-not-allowed", currentGapStep === 0);
        }

        const stepBtn = document.getElementById("gapStepBtn");
        if (stepBtn) {
            const hasSelectionForCurrentGap = selectedGapAnswersMap[currentGap.gapId] !== undefined;
            const isLastGap = currentGapStep === gapFields.length - 1;

            stepBtn.disabled = !hasSelectionForCurrentGap;
            stepBtn.classList.toggle("opacity-50", !hasSelectionForCurrentGap);
            stepBtn.classList.toggle("cursor-not-allowed", !hasSelectionForCurrentGap);

            if (isLastGap) {
                stepBtn.innerText = "Antwort prüfen";
                stepBtn.classList.remove("bg-[#EC4899]", "hover:bg-[#DB2777]");
                stepBtn.classList.add("bg-[#22D3EE]", "hover:bg-[#06B6D4]");
            } else {
                stepBtn.innerText = "Weiter";
                stepBtn.classList.remove("bg-[#22D3EE]", "hover:bg-[#06B6D4]");
                stepBtn.classList.add("bg-[#EC4899]", "hover:bg-[#DB2777]");
            }
        }

        requestAnimationFrame(() => {
            fitGapOptionTexts();
        });
    }

    function toggleAnswer(answerId, buttonElement, allowsMultiple) {
        const selectedClasses = ["bg-yellow-400", "text-black", "ring-4", "ring-white/30"];

        if (!allowsMultiple) {
            selectedAnswerIds = [answerId];

            document.querySelectorAll("#answerContainer button").forEach(btn => {
                btn.classList.remove(...selectedClasses);
            });

            buttonElement.classList.add(...selectedClasses);
        } else {
            if (selectedAnswerIds.includes(answerId)) {
                selectedAnswerIds = selectedAnswerIds.filter(id => id !== answerId);
                buttonElement.classList.remove(...selectedClasses);
            } else {
                selectedAnswerIds.push(answerId);
                buttonElement.classList.add(...selectedClasses);
            }
        }

        if (selectedAnswerIds.length > 0) {
            submitAnswerBtn.classList.remove("hidden");
        } else {
            submitAnswerBtn.classList.add("hidden");
        }
    }

    async function submitAnswer() {
        const gapQuestion = isGapQuestion(currentQuestion);

        if (!currentQuestion) {
            return;
        }

        if (!gapQuestion && selectedAnswerIds.length === 0) {
            return;
        }

        if (gapQuestion) {
            const requiredGapCount = currentQuestion?.gapFields?.length || 0;
            const selectedGapCount = selectedGapAnswers.length;

            if (selectedGapCount !== requiredGapCount) {
                return;
            }
        }

        try {
            const requestBody = {
                questionId: currentQuestion.questionId,
                selectedAnswerIds: gapQuestion ? [] : selectedAnswerIds,
                gapAnswers: gapQuestion ? selectedGapAnswers : []
            };

            const response = await fetch(`/api/session/${sessionId}/room/${roomId}/answer`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.message || "Antwort konnte nicht geprüft werden.");
                return;
            }

            if (!gapQuestion) {
                document.querySelectorAll("#answerContainer button").forEach(btn => {
                    btn.disabled = true;
                    const answerId = Number(btn.dataset.answerId);

                    if (data.correctAnswerIds && data.correctAnswerIds.includes(answerId)) {
                        btn.classList.remove("border-yellow-400", "text-yellow-400");
                        btn.classList.add("border-emerald-500", "text-emerald-400");
                    } else if (selectedAnswerIds.includes(answerId)) {
                        btn.classList.remove("border-yellow-400", "text-yellow-400", "bg-yellow-400", "text-black");
                        btn.classList.add("border-red-500", "text-red-400");
                    }
                });
            } else {
                document.querySelectorAll("#answerContainer button").forEach(btn => {
                    btn.disabled = true;
                    btn.classList.add("opacity-70", "cursor-not-allowed");
                });

                if (data.gapResults && Array.isArray(data.gapResults)) {
                    data.gapResults.forEach(entry => {
                        const preview = document.getElementById(`gapPreview-${entry.gapId}`);
                        const gapButtons = document.querySelectorAll(`[data-gap-id="${entry.gapId}"][data-gap-option-id]`);

                        if (entry.correct) {
                            if (preview) {
                                preview.classList.remove("border-yellow-400", "text-white", "bg-yellow-400/10");
                                preview.classList.add("border-emerald-500", "text-emerald-300", "bg-emerald-500/10");
                            }
                        } else {
                            if (preview) {
                                preview.classList.remove("border-yellow-400", "text-white", "bg-yellow-400/10");
                                preview.classList.add("border-red-500", "text-red-300", "bg-red-500/10");
                                preview.innerText = `${preview.innerText} → richtig: ${entry.correctOptionText}`;
                            }
                        }

                        gapButtons.forEach(btn => {
                            const btnOptionId = Number(btn.dataset.gapOptionId);

                            if (btnOptionId === entry.correctGapOptionId) {
                                btn.classList.remove("border-yellow-400", "text-yellow-400");
                                btn.classList.add("border-emerald-500", "text-emerald-400");
                            } else if (btn.classList.contains("bg-yellow-400")) {
                                btn.classList.remove("border-yellow-400", "text-yellow-400", "bg-yellow-400", "text-black");
                                btn.classList.add("border-red-500", "text-red-400");
                            }
                        });
                    });
                }
            }

            feedbackBox.innerText = data.correct
                ? `Richtig! +${data.pointsEarned} Punkt(e)`
                : `Falsch! +${data.pointsEarned} Punkt(e)`;

            feedbackBox.className = data.correct
                ? "mt-6 text-center text-lg font-black text-emerald-400"
                : "mt-6 text-center text-lg font-black text-red-400";

            submitAnswerBtn.classList.add("hidden");
            nextQuestionBtn.classList.remove("hidden");

            await refreshRoomStatus();
        } catch (error) {
            console.error("Fehler beim Prüfen der Antwort:", error);
            alert("Antwort konnte nicht geprüft werden.");
        }
    }

    async function loadNextQuestion() {
        if (!currentQuestion) {
            const nextRoomId = roomId + 1;

            if (nextRoomId <= 16) {
                window.location.href = `/room/${nextRoomId}`;
            } else {
                window.location.href = "/dashboard";
            }
            return;
        }

        try {
            const response = await fetch(`/api/session/${sessionId}/room/${roomId}/advance`, {
                method: "POST"
            });

            if (!response.ok) {
                let errorMessage = "Nächste Frage konnte nicht geladen werden.";
                try {
                    const errorData = await response.json();
                    errorMessage = errorData.message || errorMessage;
                } catch (_) {
                }

                alert(errorMessage);
                return;
            }

            const responseText = await response.text();
            const nextQuestion = responseText ? JSON.parse(responseText) : null;

            if (!nextQuestion) {
                await refreshRoomStatus();
                showRoomCompletedState();
                return;
            }

            currentQuestion = nextQuestion;
            nextQuestionBtn.innerText = "Nächste Frage";
            renderQuestion(currentQuestion);
            await refreshRoomStatus();
        } catch (error) {
            console.error("Fehler beim Laden der nächsten Frage:", error);
            alert("Nächste Frage konnte nicht geladen werden.");
        }
    }

    function showRoomCompletedState() {
        currentQuestion = null;
        applyQuestionLayout(null);
        questionText.innerText = "Raum abgeschlossen.";
        answerContainer.innerHTML = "";

        feedbackBox.innerText = "Du hast alle Fragen dieses Raums beantwortet.";
        feedbackBox.className = "mt-6 text-center text-lg font-black text-emerald-400";

        submitAnswerBtn.classList.add("hidden");

        const nextRoomId = roomId + 1;

        if (nextRoomId <= 15) {
            nextQuestionBtn.innerText = `Zu Raum ${nextRoomId}`;
            nextQuestionBtn.classList.remove("hidden");
        } else if (nextRoomId === 16) {
            nextQuestionBtn.innerText = "Zum Abschlussraum";
            nextQuestionBtn.classList.remove("hidden");
        } else {
            nextQuestionBtn.innerText = "Zurück zum Dashboard";
            nextQuestionBtn.classList.remove("hidden");
        }
    }

    window.addEventListener("resize", () => {
        applyQuestionLayout(currentQuestion);
        fitAnswerTexts();
        fitGapOptionTexts();
        fitGapQuestionText();
    });

    dialogNextBtn.addEventListener("click", nextDialogLine);
    startQuizBtn.addEventListener("click", startQuiz);
    submitAnswerBtn.addEventListener("click", submitAnswer);
    nextQuestionBtn.addEventListener("click", loadNextQuestion);

    updateHeadlineOverview();
    initRandomPandas();
    initWelcomeRoom();
</script>
</body>
</html>
