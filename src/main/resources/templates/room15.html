<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::body}, 'min-h-screen bg-gradient-to-br from-pink-400 via-yellow-300 to-cyan-400 text-white font-mono tracking-wider dark:bg-[#000010] overflow-x-hidden')}">

<body class="min-h-screen bg-gradient-to-br from-pink-400 via-yellow-300 to-cyan-400 text-white font-mono tracking-wider dark:bg-[#000010] overflow-x-hidden">

<div th:replace="~{fragments/headline :: headline(${ 'Raum ' + roomId}, ${'Thema: ' + themeName}, ${avatarUrl}, null, null)}"></div>

<style>
    :root {
        --room-home-btn-bg: linear-gradient(90deg, #ff00aa 0%, #ff7a00 18%, #ffee00 38%, #00e5ff 62%, #7c3aed 82%, #ff00aa 100%);
        --room-home-btn-hover-bg: linear-gradient(90deg, #ff4dc4 0%, #ff9b3d 18%, #fff36b 38%, #5cecff 62%, #9f67ff 82%, #ff4dc4 100%);
        --room-home-btn-text: #14001f;
        --room-home-btn-border: #ffffff;
        --panda-tip-fill: #15A7F3;
    }

    html.dark {
        --room-home-btn-bg: linear-gradient(90deg, #ff00aa 0%, #ff7a00 18%, #ffee00 38%, #00e5ff 62%, #7c3aed 82%, #ff00aa 100%);
        --room-home-btn-hover-bg: linear-gradient(90deg, #ff4dc4 0%, #ff9b3d 18%, #fff36b 38%, #5cecff 62%, #9f67ff 82%, #ff4dc4 100%);
        --room-home-btn-text: #14001f;
        --room-home-btn-border: #ffffff;
        --panda-tip-fill: #15A7F3;
    }

    .panda-leaf-fill {
        animation: room15TipChaos 1.2s linear infinite;
    }

    @keyframes room15TipChaos {
        0%   { fill: #22d3ee; }
        20%  { fill: #f472b6; }
        40%  { fill: #fde047; }
        60%  { fill: #4ade80; }
        80%  { fill: #a78bfa; }
        100% { fill: #22d3ee; }
    }

    body > header,
    body > div:first-child {
        background: linear-gradient(90deg, #ff00aa 0%, #ff7a00 18%, #ffee00 38%, #00e5ff 62%, #7c3aed 82%, #ff00aa 100%);
        border-bottom: 4px solid rgba(255,255,255,0.7);
        box-shadow:
                0 0 18px rgba(255, 0, 170, 0.25),
                0 0 24px rgba(0, 229, 255, 0.25);
    }

    body > header h1,
    body > header h2,
    body > div:first-child h1,
    body > div:first-child h2 {
        color: #ffffff;
        text-shadow:
                0 0 8px rgba(0,0,0,0.35),
                0 0 12px rgba(124,58,237,0.28);
    }

    body > header p,
    body > div:first-child p {
        color: #22002f;
        font-weight: 900;
    }

    #speechPanel > div > div:nth-child(1) {
        background: #fde047 !important;
        box-shadow: 0 0 18px rgba(253,224,71,0.35);
    }

    #speechPanel > div > div:nth-child(2) {
        background: #312e81 !important;
    }

    #speechPanel > div > div:nth-child(3) {
        border-color: #22d3ee !important;
    }

    #dialogText {
        color: #67e8f9 !important;
        text-shadow: 0 0 10px rgba(34,211,238,0.18);
    }

    #speechTail > div {
        background: #4ade80 !important;
    }

    #speechTail > div > div:nth-child(1) {
        background: #7c3aed !important;
    }

    #speechTail > div > div:nth-child(2) {
        border-color: #fb7185 !important;
    }

    #questionText {
        color: #fff7ed !important;
    }

    #feedbackBox {
        text-shadow: 0 0 12px rgba(255,255,255,0.12);
    }

    .room15-palette-1 {
        background: #f472b6;
        border-color: #fde047;
        color: #4a044e;
    }

    .room15-palette-2 {
        background: #22d3ee;
        border-color: #f97316;
        color: #082f49;
    }

    .room15-palette-3 {
        background: #fde047;
        border-color: #7c3aed;
        color: #422006;
    }

    .room15-palette-4 {
        background: #4ade80;
        border-color: #ec4899;
        color: #052e16;
    }

    .room15-palette-5 {
        background: #a78bfa;
        border-color: #22d3ee;
        color: #1e1b4b;
    }

    .room15-palette-6 {
        background: #fb923c;
        border-color: #38bdf8;
        color: #431407;
    }

    .room15-selected {
        background: #111827 !important;
        border-color: #ffffff !important;
        color: #fde047 !important;
        box-shadow:
                0 0 0 2px rgba(255,255,255,0.3),
                0 0 18px rgba(253,224,71,0.28);
    }

    .room15-correct {
        background: #064e3b !important;
        border-color: #34d399 !important;
        color: #d1fae5 !important;
        box-shadow: 0 0 18px rgba(52,211,153,0.25);
    }

    .room15-wrong {
        background: #7f1d1d !important;
        border-color: #fb7185 !important;
        color: #ffe4e6 !important;
        box-shadow: 0 0 18px rgba(251,113,133,0.22);
    }

    .room15-preview-base {
        background: #312e81;
        border-color: #22d3ee;
        color: #e0f2fe;
    }

    .room15-preview-active {
        background: #1d4ed8;
        border-color: #fde047;
        color: #fff7ed;
        box-shadow: 0 0 16px rgba(34,211,238,0.22);
    }

    .room15-preview-done {
        background: #065f46;
        border-color: #4ade80;
        color: #ecfdf5;
    }

    .room15-preview-correct {
        background: #064e3b;
        border-color: #34d399;
        color: #d1fae5;
    }

    .room15-preview-wrong {
        background: #7f1d1d;
        border-color: #fb7185;
        color: #ffe4e6;
    }
</style>

<!-- WELCOME CONTAINER -->
<main id="welcomeContainer" class="flex justify-center mt-10">
    <div class="w-full max-w-6xl px-6 relative">
        <section
                class="relative border-[10px] border-[#050a14] shadow-2xl overflow-visible dark:bg-[#222a66]"
                style="
            background:
                linear-gradient(135deg, #ff7ac6 0%, #ffd84d 28%, #7cf3ff 58%, #a78bfa 100%);
            background-image:
                radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1px),
                radial-gradient(rgba(255,240,180,0.24) 1px, transparent 1px),
                radial-gradient(rgba(255,110,200,0.18) 1px, transparent 1px),
                radial-gradient(rgba(100,220,255,0.18) 1px, transparent 1px);
            background-size: 18px 18px, 18px 18px, 24px 24px, 24px 24px;
            background-position: 0 0, 9px 9px, 4px 4px, 12px 12px;
        ">

            <!-- FLOOR -->
            <div
                    class="absolute inset-12 border-4 border-white/30"
                    style="
                background:
                    linear-gradient(135deg, #3b0764 0%, #1e1b4b 35%, #0f172a 100%);
                background-image:
                    radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                    radial-gradient(rgba(244,114,182,0.14) 1px, transparent 1px),
                    radial-gradient(rgba(250,204,21,0.12) 1px, transparent 1px),
                    radial-gradient(rgba(34,211,238,0.10) 1px, transparent 1px);
                background-size: 20px 20px, 20px 20px, 24px 24px, 24px 24px;
                background-position: 0 0, 10px 10px, 5px 5px, 15px 15px;
            ">
            </div>

            <!-- ROOM CONTENT -->
            <div class="relative h-[560px] flex items-center justify-center">

                <!-- SPEECH PANEL -->
                <div id="speechPanel" class="absolute top-8 left-1/2 -translate-x-[42%] w-[62%] z-20 transition-all duration-300">
                    <div class="relative min-h-[150px]">
                        <!-- outer bubble -->
                        <div
                                class="absolute inset-0 dark:bg-[#f5f8ff]"
                                style="
                                background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 30%, #fce7f3 68%, #e0f2fe 100%);
                                clip-path: polygon(
                                    20px 0,
                                    calc(100% - 20px) 0,
                                    100% 20px,
                                    100% calc(100% - 20px),
                                    calc(100% - 20px) 100%,
                                    20px 100%,
                                    0 calc(100% - 20px),
                                    0 20px
                                );
                            ">
                        </div>

                        <!-- bubble fill -->
                        <div
                                class="absolute inset-[5px] bg-[#1b133b] dark:bg-[#0a1022]"
                                style="
                                clip-path: polygon(
                                    18px 0,
                                    calc(100% - 18px) 0,
                                    100% 18px,
                                    100% calc(100% - 18px),
                                    calc(100% - 18px) 100%,
                                    18px 100%,
                                    0 calc(100% - 18px),
                                    0 18px
                                );
                            ">
                        </div>

                        <!-- inner stroke -->
                        <div
                                class="absolute inset-[14px] border dark:border-[#1a2a52]"
                                style="
                                border-color: #f472b6;
                                clip-path: polygon(
                                    14px 0,
                                    calc(100% - 14px) 0,
                                    100% 14px,
                                    100% calc(100% - 14px),
                                    calc(100% - 14px) 100%,
                                    14px 100%,
                                    0 calc(100% - 14px),
                                    0 14px
                                );
                            ">
                        </div>

                        <!-- text -->
                        <div class="relative px-10 py-8 min-h-[150px]">
                            <div id="dialogText" class="text-lg leading-8 whitespace-pre-line pr-2 text-white">
                                Hey.
                            </div>
                        </div>
                    </div>

                    <!-- speech tail -->
                    <div id="speechTail" class="absolute left-[72%] -translate-x-1/2 top-full -translate-y-[1px] transition-all duration-300">
                        <!-- tail outer -->
                        <div
                                class="relative w-[40px] h-[34px] dark:bg-[#f5f8ff]"
                                style="
                                background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 30%, #fce7f3 68%, #e0f2fe 100%);
                                clip-path: polygon(
                                    0 0,
                                    100% 0,
                                    100% 55%,
                                    68% 100%,
                                    32% 100%,
                                    0 55%
                                );
                            ">
                            <!-- tail fill -->
                            <div
                                    class="absolute inset-[4px] bg-[#1b133b] dark:bg-[#0a1022]"
                                    style="
                                    clip-path: polygon(
                                        0 0,
                                        100% 0,
                                        100% 55%,
                                        68% 100%,
                                        32% 100%,
                                        0 55%
                                    );
                                ">
                            </div>

                            <!-- tail inner stroke -->
                            <div
                                    class="absolute inset-[10px] border dark:border-[#1a2a52]"
                                    style="
                                    border-color: #f472b6;
                                    clip-path: polygon(
                                        0 0,
                                        100% 0,
                                        100% 55%,
                                        68% 100%,
                                        32% 100%,
                                        0 55%
                                    );
                                ">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Troll-CHARACTER PANDA -->
                <div id="welcomePanda" class="absolute left-[120px] top-[180px] z-10 pointer-events-none">
                    <div id="welcomePandaInner" class="transition-all duration-700 ease-in-out flex flex-col items-center">
                        <div class="w-[170px] h-[30px] bg-white/40 rounded-full blur-sm"></div>

                        <svg class="w-[230px] mt-[-10px]" viewBox="0 0 24 24" shape-rendering="crispEdges">
                            <rect x="19" y="4" width="2" height="16" fill="#8b5a2b"/>
                            <rect x="18" y="3" width="4" height="2" fill="#8b5a2b"/>
                            <rect x="18" y="2" width="4" height="1" fill="#6f4421"/>
                            <rect x="19" y="1" width="2" height="2" class="panda-leaf-fill"/>

                            <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                            <rect x="8" y="4" width="8" height="6" fill="#e9f0ff"/>

                            <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                            <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                            <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                            <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                            <rect x="7" y="13" width="10" height="7" fill="#2b4aa8"/>

                            <rect x="5" y="14" width="2" height="3" fill="#e9f0ff"/>
                            <rect x="17" y="14" width="2" height="3" fill="#e9f0ff"/>

                            <rect x="8" y="20" width="3" height="2" fill="#e9f0ff"/>
                            <rect x="13" y="20" width="3" height="2" fill="#e9f0ff"/>
                        </svg>
                    </div>
                </div>

                <!-- Raum-CHARACTER -->
                <div class="absolute right-[140px] bottom-[95px] z-10">
                    <img
                            src="/room-characters/Schmied.png"
                            alt="Raumcharakter Schmied"
                            class="w-[150px]"
                            style="image-rendering: pixelated;"
                    >
                </div>

                <!-- SPIELERFIGUR -->
                <div
                        id="playerCharacter"
                        class="absolute left-1/2 -translate-x-1/2 bottom-[-170px] z-10 transition-all duration-[1800ms] ease-linear"
                >
                    <img
                            id="playerAvatar"
                            src="/images/Informatiker.png"
                            alt="Spielerfigur"
                            class="w-[150px]"
                            style="image-rendering: pixelated;"
                    >
                </div>

                <!-- CONTROLS -->
                <div class="absolute bottom-6 left-[calc(50%_-_120px)] z-20 flex gap-4">
                    <button id="dialogNextBtn"
                            class="bg-gradient-to-r from-pink-500 via-orange-400 to-cyan-400 text-white px-6 py-3 rounded-lg font-black hover:brightness-110 shadow-lg">
                        Weiter
                    </button>

                    <button id="startQuizBtn"
                            class="hidden bg-gradient-to-r from-fuchsia-500 via-yellow-400 to-sky-400 text-white px-6 py-3 rounded-lg font-black hover:brightness-110 shadow-lg">
                        Prüfung beginnen
                    </button>
                </div>
            </div>

        </section>

        <!-- CORRIDOR -->
        <div class="absolute left-[calc(50%_-_120px)] top-[calc(100%_-_3rem)] w-28 h-[220px] z-0 pointer-events-none">
            <!-- linke Außenwand -->
            <div class="absolute left-0 top-0 w-[10px] h-full bg-[#ff00aa] dark:bg-[#ff00aa]"></div>

            <!-- linke Innenkante -->
            <div class="absolute left-[10px] top-0 w-[4px] h-full bg-[#00e5ff] dark:bg-[#00e5ff]"></div>

            <!-- Mitte / Flurboden -->
            <div class="absolute left-[14px] top-0 w-[84px] h-full bg-[#0f172a] dark:bg-[#0f172a]"></div>

            <!-- rechte Innenkante -->
            <div class="absolute left-[98px] top-0 w-[4px] h-full bg-[#ffee00] dark:bg-[#ffee00]"></div>

            <!-- rechte Außenwand -->
            <div class="absolute left-[102px] top-0 w-[10px] h-full bg-[#7c3aed] dark:bg-[#7c3aed]"></div>
        </div>
    </div>
</main>

<!-- GAME -->
<div id="gameContainer" class="bg-gradient-to-br from-pink-400 via-yellow-300 to-cyan-400 dark:bg-[#000010] text-white font-mono tracking-wider hidden min-h-screen">
    <div id="gameScene"
         class="w-[1200px] h-[680px] mx-auto relative dark:bg-[#000010] overflow-visible"
         style="
            background:
                linear-gradient(135deg, #ff7ac6 0%, #ffd84d 28%, #7cf3ff 58%, #a78bfa 100%);
            background-image:
                radial-gradient(rgba(255,255,255,0.16) 1px, transparent 1px),
                radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1px),
                radial-gradient(rgba(255,110,200,0.14) 1px, transparent 1px),
                radial-gradient(rgba(100,220,255,0.12) 1px, transparent 1px);
            background-size: 18px 18px, 18px 18px, 24px 24px, 24px 24px;
            background-position: 0 0, 9px 9px, 4px 4px, 12px 12px;
         ">

        <!-- ROOM CHARACTER -->
        <div id="gameRoomCharacter" class="absolute left-[105px] top-[-5px] z-20 pointer-events-none">
            <img
                    src="/room-characters/Schmied.png"
                    alt="Raumcharakter Schmied"
                    class="w-[110px]"
                    style="image-rendering: pixelated; transform: scaleX(-1);"
            >
        </div>

        <!-- PANDA -->
        <div id="gamePanda" class="absolute left-[80px] top-[-24px] z-50 pointer-events-none">
            <div id="gamePandaInner" class="transition-all duration-700 ease-in-out flex flex-col items-center">
                <div class="w-[130px] h-[22px] bg-white/60 rounded-full blur-sm"></div>

                <svg class="w-[160px] mt-[-8px]" viewBox="0 0 24 24" shape-rendering="crispEdges">
                    <rect x="19" y="4" width="2" height="16" fill="#8b5a2b"/>
                    <rect x="18" y="3" width="4" height="2" fill="#8b5a2b"/>
                    <rect x="18" y="2" width="4" height="1" fill="#6f4421"/>
                    <rect x="19" y="1" width="2" height="2" class="panda-leaf-fill"/>

                    <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                    <rect x="8" y="4" width="8" height="6" fill="#e9f0ff"/>

                    <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                    <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                    <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                    <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                    <rect x="7" y="13" width="10" height="7" fill="#2b4aa8"/>

                    <rect x="5" y="14" width="2" height="3" fill="#e9f0ff"/>
                    <rect x="17" y="14" width="2" height="3" fill="#e9f0ff"/>

                    <rect x="8" y="20" width="3" height="2" fill="#e9f0ff"/>
                    <rect x="13" y="20" width="3" height="2" fill="#e9f0ff"/>
                </svg>
            </div>
        </div>

        <!-- QUESTION PANEL -->
        <div th:replace="~{fragments/question-panel :: questionPanel(
            'bg-[#67e8f9] dark:bg-[#67e8f9]',
            'bg-[#3b0764] dark:bg-[#3b0764]',
            'border-[#fde047] dark:border-[#fde047]',
            'bg-gradient-to-r from-pink-500 via-yellow-400 to-cyan-400 text-[#22002f] px-6 py-3 rounded-lg font-black hover:brightness-110 shadow-lg',
            'bg-gradient-to-r from-cyan-300 via-fuchsia-400 to-orange-400 text-[#22002f] px-6 py-3 rounded-lg font-black hover:brightness-110 shadow-lg'
        )}"></div>

        <!-- STATUS PANEL -->
        <div th:replace="~{fragments/status-panel :: statusPanel(
            'bg-[#fce7f3] dark:bg-[#fce7f3]',
            'bg-[#1e1b4b] dark:bg-[#1e1b4b]',
            'border-[#4ade80] dark:border-[#4ade80]',
            'bg-[#fde047] text-[#431407] dark:bg-[#fde047] dark:text-[#431407] font-black text-xs text-center py-3 rounded-xl'
        )}"></div>
    </div>
</div>

<script th:src="@{/js/darkmode.js}"></script>

<script th:inline="javascript">
    const roomId = /*[[${roomId}]]*/ 15;

    const userId = sessionStorage.getItem("userId");
    const runId = sessionStorage.getItem("runId");
    const sessionId = sessionStorage.getItem("sessionId");

    const playerCharacter = document.getElementById("playerCharacter");
    const playerAvatar = document.getElementById("playerAvatar");

    const storedAvatar = sessionStorage.getItem("avatar");

    if (playerAvatar) {
        playerAvatar.src = storedAvatar
            ? `/images/${storedAvatar}`
            : "/images/Informatiker.png";
    }

    if (!userId) {
        alert("Kein eingeloggter User gefunden.");
        window.location.href = "/";
        throw new Error("Kein eingeloggter User gefunden.");
    }

    if (!sessionId || !runId) {
        alert("Kein aktiver Spielstand geladen.");
        window.location.href = "/dashboard";
        throw new Error("Kein aktiver Spielstand geladen.");
    }

    let currentQuestion = null;
    let selectedAnswerIds = [];
    let selectedGapAnswers = [];
    let selectedGapAnswersMap = {};
    let currentGapStep = 0;
    let roomLoaded = false;

    const welcomePanda = document.getElementById("welcomePanda");
    const welcomePandaInner = document.getElementById("welcomePandaInner");
    const gamePandaInner = document.getElementById("gamePandaInner");

    function animateWildPanda(element, keyframes, duration) {
        if (!element) {
            return;
        }

        element.style.transformOrigin = "center center";
        element.animate(keyframes, {
            duration,
            iterations: Infinity,
            direction: "alternate",
            easing: "ease-in-out"
        });
    }

    function initRandomPandas() {
        animateWildPanda(welcomePandaInner, [
            { transform: "translate(40px, 20px) rotate(0deg) scale(1)" },
            { transform: "translate(300px, 110px) rotate(18deg) scale(1.12)" },
            { transform: "translate(120px, 145px) rotate(-22deg) scale(0.92)" },
            { transform: "translate(360px, 35px) rotate(30deg) scale(1.08)" },
            { transform: "translate(70px, 95px) rotate(-15deg) scale(1.16)" },
            { transform: "translate(250px, 10px) rotate(12deg) scale(0.96)" }
        ], 3000);

        animateWildPanda(gamePandaInner, [
            { transform: "translate(90px, 20px) rotate(0deg) scale(1)" },
            { transform: "translate(760px, 70px) rotate(24deg) scale(1.15)" },
            { transform: "translate(280px, 220px) rotate(-20deg) scale(0.90)" },
            { transform: "translate(640px, 180px) rotate(34deg) scale(1.05)" },
            { transform: "translate(140px, 140px) rotate(-28deg) scale(1.18)" },
            { transform: "translate(500px, 40px) rotate(16deg) scale(0.94)" }
        ], 2400);
    }

    const welcomeContainer = document.getElementById("welcomeContainer");
    const gameContainer = document.getElementById("gameContainer");

    const gameScene = document.getElementById("gameScene");
    const gameRoomCharacter = document.getElementById("gameRoomCharacter");
    const gamePanda = document.getElementById("gamePanda");
    const questionPanel = document.getElementById("questionPanel");
    const statusPanel = document.getElementById("statusPanel");

    const dialogText = document.getElementById("dialogText");
    const dialogNextBtn = document.getElementById("dialogNextBtn");
    const startQuizBtn = document.getElementById("startQuizBtn");
    const speechTail = document.getElementById("speechTail");
    const speechPanel = document.getElementById("speechPanel");

    const questionText = document.getElementById("questionText");
    const answerContainer = document.getElementById("answerContainer");
    const feedbackBox = document.getElementById("feedbackBox");
    const submitAnswerBtn = document.getElementById("submitAnswerBtn");
    const nextQuestionBtn = document.getElementById("nextQuestionBtn");

    let introDialog = [];

    let dialogIndex = 0;

    function showCurrentDialogLine() {
        if (!introDialog || introDialog.length === 0) {
            dialogText.innerText = "...";
            dialogNextBtn.classList.add("hidden");
            startQuizBtn.classList.remove("hidden");
            updateSpeechTailPosition("room");
            return;
        }

        const line = introDialog[dialogIndex];
        const speakerLabel = line.speaker === "player" ? "Du" : "Schmied";

        updateSpeechTailPosition(line.speaker);
        dialogText.innerText = `${speakerLabel}: ${line.text}`;

        if (dialogIndex >= introDialog.length - 1) {
            dialogNextBtn.classList.add("hidden");
            startQuizBtn.classList.remove("hidden");
        } else {
            dialogNextBtn.classList.remove("hidden");
            startQuizBtn.classList.add("hidden");
        }
    }

    const room15PaletteClasses = [
        "room15-palette-1",
        "room15-palette-2",
        "room15-palette-3",
        "room15-palette-4",
        "room15-palette-5",
        "room15-palette-6"
    ];

    function getRoom15PaletteClass(index) {
        return room15PaletteClasses[index % room15PaletteClasses.length];
    }

    function clearRoom15StateClasses(element) {
        element.classList.remove("room15-selected", "room15-correct", "room15-wrong");
    }

    function renderQuestion(question) {
        selectedAnswerIds = [];
        selectedGapAnswers = [];
        selectedGapAnswersMap = {};
        currentGapStep = 0;
        feedbackBox.innerText = "";
        submitAnswerBtn.classList.add("hidden");
        nextQuestionBtn.classList.add("hidden");

        if (!question) {
            questionText.innerText = "Keine weitere Frage vorhanden.";
            answerContainer.innerHTML = "";
            return;
        }

        answerContainer.innerHTML = "";
        applyQuestionLayout(question);

        if (isGapQuestion(question)) {
            questionText.className = "text-center px-2 min-h-0 overflow-hidden text-[clamp(9px,0.9vw,14px)] leading-[1.1]";
            renderGapQuestionText(question);
            renderGapQuestion(question);

            requestAnimationFrame(() => {
                fitGapQuestionText();
                fitGapOptionTexts();
            });

            return;
        }

        questionText.className = "text-center px-6 shrink-0 min-h-[72px] max-h-[250px] overflow-hidden leading-[1.08] text-[clamp(10px,1.15vw,18px)]";
        questionText.innerText = question.startText || "Keine Frage vorhanden.";
        questionText.style.wordBreak = "break-word";

        if (!question.answerOptions || question.answerOptions.length === 0) {
            answerContainer.innerHTML = `
            <div class="col-span-2 text-center text-red-300">
                Dieser Fragetyp wird hier noch nicht unterstützt.
            </div>
        `;
            return;
        }

        answerContainer.className = "grid grid-cols-2 gap-4 flex-1 min-h-0 content-stretch";

        const optionCount = question.answerOptions.length;
        const rows = Math.ceil(optionCount / 2);

        answerContainer.style.gridAutoRows = "1fr";

        question.answerOptions.forEach((option, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.dataset.answerId = option.answerId;
            button.dataset.fullText = option.optionText;
            button.className = `
            quiz-answer-btn
            ${getRoom15PaletteClass(index)}
            relative w-full h-full
            border-4
            px-6 py-4
            font-black text-left
            flex items-center
            transition
        `;

            button.style.minHeight = rows >= 2 ? "120px" : "150px";

            const label = document.createElement("div");
            label.className = "answer-label w-full leading-[1.35]";
            label.innerText = `${String.fromCharCode(65 + index)}) ${option.optionText}`;

            button.appendChild(label);

            button.addEventListener("click", () => {
                toggleAnswer(option.answerId, button, question.allowsMultiple);
            });

            answerContainer.appendChild(button);
        });

        requestAnimationFrame(() => {
            fitQuestionText();
            fitAnswerTexts();
        });
    }

    function renderGapQuestionText(question) {
        questionText.innerHTML = "";

        const gapFields = [...(question.gapFields || [])].sort((a, b) => a.gapIndex - b.gapIndex);

        const textFlow = document.createElement("div");
        textFlow.className = "flex flex-wrap items-center justify-center gap-x-2 gap-y-2 leading-[1.1] text-inherit";

        if (question.startText) {
            const startSpan = document.createElement("span");
            startSpan.textContent = question.startText;
            textFlow.appendChild(startSpan);
        }

        gapFields.forEach((gapField, gapIndex) => {
            const before = gapField.textBefore || "";
            const after = gapField.textAfter || "";

            if (before) {
                const beforeSpan = document.createElement("span");
                beforeSpan.textContent = before;
                textFlow.appendChild(beforeSpan);
            }

            const preview = document.createElement("button");
            preview.type = "button";
            preview.id = `gapPreview-${gapField.gapId}`;
            preview.dataset.gapId = gapField.gapId;
            preview.dataset.gapStep = gapIndex;
            preview.className = `
            room15-preview-base
            relative inline-flex items-center justify-center
            min-w-[88px] max-w-full
            px-2.5 py-1
            border-2
            text-center font-black
            transition
        `;
            preview.textContent = `[ Lücke ${gapIndex + 1} ]`;

            preview.addEventListener("click", () => {
                setActiveGapStep(gapIndex);
            });

            textFlow.appendChild(preview);

            if (after) {
                const afterSpan = document.createElement("span");
                afterSpan.textContent = after;
                textFlow.appendChild(afterSpan);
            }
        });

        if (question.endText) {
            const endSpan = document.createElement("span");
            endSpan.textContent = question.endText;
            textFlow.appendChild(endSpan);
        }

        questionText.appendChild(textFlow);
    }

    function renderGapQuestion(question) {
        answerContainer.className = "flex flex-col gap-2 min-h-0";

        if (!question.gapFields || question.gapFields.length === 0) {
            answerContainer.innerHTML = `
            <div class="text-center text-red-300">
                GAP-Frage enthält keine Lückenfelder.
            </div>
        `;
            return;
        }

        const gapFields = [...question.gapFields].sort((a, b) => a.gapIndex - b.gapIndex);

        const currentGapLabel = document.createElement("div");
        currentGapLabel.id = "gapCurrentLabel";
        currentGapLabel.className = "text-xs text-cyan-100 font-black tracking-wide shrink-0";
        answerContainer.appendChild(currentGapLabel);

        gapFields.forEach((gapField, gapIndex) => {
            const block = document.createElement("div");
            block.className = "hidden";
            block.dataset.gapOptionsStep = gapIndex;

            const options = [...(gapField.gapOptions || [])].sort((a, b) => a.optionOrder - b.optionOrder);
            const optionCount = options.length;

            let columnCount = 2;
            if (optionCount >= 7) {
                columnCount = 3;
            }

            const rowCount = Math.max(1, Math.ceil(optionCount / columnCount));

            let minHeight = 68;
            if (rowCount >= 4) {
                minHeight = 38;
            } else if (rowCount === 3) {
                minHeight = 46;
            } else if (rowCount === 2) {
                minHeight = 56;
            }

            const optionsWrap = document.createElement("div");
            optionsWrap.className = `grid ${columnCount === 3 ? "grid-cols-3" : "grid-cols-2"} gap-2`;
            optionsWrap.style.gridTemplateRows = `repeat(${rowCount}, minmax(0, 1fr))`;

            options.forEach((option, optionIndex) => {
                const button = document.createElement("button");
                button.type = "button";
                button.dataset.gapId = gapField.gapId;
                button.dataset.gapOptionId = option.gapOptionId;
                button.dataset.optionText = option.optionText;
                button.className = `
                gap-option-btn
                ${getRoom15PaletteClass(optionIndex)}
                relative w-full
                border-4
                px-3 py-2
                font-black text-left
                flex items-center
                transition
            `;
                button.style.minHeight = `${minHeight}px`;

                const label = document.createElement("div");
                label.className = "gap-option-label w-full leading-[1.15]";
                label.innerText = `${String.fromCharCode(65 + optionIndex)}) ${option.optionText}`;

                button.appendChild(label);

                button.addEventListener("click", () => {
                    selectGapOption(gapField.gapId, option.gapOptionId, button);
                });

                optionsWrap.appendChild(button);
            });

            block.appendChild(optionsWrap);
            answerContainer.appendChild(block);
        });

        const navWrap = document.createElement("div");
        navWrap.className = "mt-2 flex justify-between gap-3 shrink-0";

        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "gapPrevBtn";
        prevBtn.className = "bg-gradient-to-r from-indigo-600 to-fuchsia-500 text-white px-5 py-2.5 rounded-lg font-black hover:brightness-110 shadow-lg";
        prevBtn.innerText = "Zurück";

        prevBtn.addEventListener("click", () => {
            setActiveGapStep(currentGapStep - 1);
        });

        const stepBtn = document.createElement("button");
        stepBtn.type = "button";
        stepBtn.id = "gapStepBtn";
        stepBtn.className = "bg-gradient-to-r from-pink-500 via-orange-400 to-cyan-400 text-[#22002f] px-5 py-2.5 rounded-lg font-black hover:brightness-110 shadow-lg";
        stepBtn.innerText = "Weiter";

        stepBtn.addEventListener("click", () => {
            if (!currentQuestion || !currentQuestion.gapFields) {
                return;
            }

            const sortedGapFields = [...currentQuestion.gapFields].sort((a, b) => a.gapIndex - b.gapIndex);

            if (currentGapStep >= sortedGapFields.length - 1) {
                submitAnswer();
            } else {
                setActiveGapStep(currentGapStep + 1);
            }
        });

        navWrap.appendChild(prevBtn);
        navWrap.appendChild(stepBtn);
        answerContainer.appendChild(navWrap);

        requestAnimationFrame(() => {
            setActiveGapStep(0);
            fitGapOptionTexts();
        });
    }

    function selectGapOption(gapId, gapOptionId, buttonElement) {
        selectedGapAnswersMap[gapId] = gapOptionId;

        selectedGapAnswers = Object.entries(selectedGapAnswersMap).map(([gapIdKey, gapOptionIdValue]) => ({
            gapId: Number(gapIdKey),
            selectedGapOptionId: Number(gapOptionIdValue)
        }));

        document.querySelectorAll(`[data-gap-id="${gapId}"][data-gap-option-id]`).forEach(btn => {
            btn.classList.remove("room15-selected");
        });

        buttonElement.classList.add("room15-selected");

        const preview = document.getElementById(`gapPreview-${gapId}`);
        if (preview) {
            const cleanedText = buttonElement.dataset.optionText || buttonElement.innerText.replace(/^[A-Z]\)\s*/, "");
            preview.innerText = cleanedText;
        }

        updateGapStepUI();
    }

    function updateGapStepUI() {
        if (!currentQuestion || !currentQuestion.gapFields || currentQuestion.gapFields.length === 0) {
            return;
        }

        const gapFields = [...currentQuestion.gapFields].sort((a, b) => a.gapIndex - b.gapIndex);
        const currentGap = gapFields[currentGapStep];

        document.querySelectorAll("[data-gap-options-step]").forEach(block => {
            const blockStep = Number(block.dataset.gapOptionsStep);
            block.classList.toggle("hidden", blockStep !== currentGapStep);
        });

        document.querySelectorAll("[data-gap-step]").forEach(preview => {
            const previewStep = Number(preview.dataset.gapStep);
            const gapId = Number(preview.dataset.gapId);
            const hasAnswer = selectedGapAnswersMap[gapId] !== undefined;

            preview.classList.remove(
                "room15-preview-base",
                "room15-preview-active",
                "room15-preview-done",
                "room15-preview-correct",
                "room15-preview-wrong"
            );

            if (previewStep === currentGapStep) {
                preview.classList.add("room15-preview-active");
            } else if (hasAnswer) {
                preview.classList.add("room15-preview-done");
            } else {
                preview.classList.add("room15-preview-base");
            }
        });

        const currentGapLabel = document.getElementById("gapCurrentLabel");
        if (currentGapLabel) {
            const selectedCount = selectedGapAnswers.length;
            const totalCount = gapFields.length;
            currentGapLabel.innerText = `LÜCKE ${currentGapStep + 1} VON ${totalCount}  •  AUSGEWÄHLT: ${selectedCount}/${totalCount}`;
        }

        const prevBtn = document.getElementById("gapPrevBtn");
        if (prevBtn) {
            prevBtn.disabled = currentGapStep === 0;
            prevBtn.classList.toggle("opacity-50", currentGapStep === 0);
            prevBtn.classList.toggle("cursor-not-allowed", currentGapStep === 0);
        }

        const stepBtn = document.getElementById("gapStepBtn");
        if (stepBtn) {
            const hasSelectionForCurrentGap = selectedGapAnswersMap[currentGap.gapId] !== undefined;
            const isLastGap = currentGapStep === gapFields.length - 1;

            stepBtn.disabled = !hasSelectionForCurrentGap;
            stepBtn.classList.toggle("opacity-50", !hasSelectionForCurrentGap);
            stepBtn.classList.toggle("cursor-not-allowed", !hasSelectionForCurrentGap);

            if (isLastGap) {
                stepBtn.innerText = "Antwort prüfen";
                stepBtn.classList.remove("from-pink-500", "via-orange-400", "to-cyan-400");
                stepBtn.classList.add("from-fuchsia-500", "via-yellow-400", "to-sky-400");
            } else {
                stepBtn.innerText = "Weiter";
                stepBtn.classList.remove("from-fuchsia-500", "via-yellow-400", "to-sky-400");
                stepBtn.classList.add("from-pink-500", "via-orange-400", "to-cyan-400");
            }
        }

        requestAnimationFrame(() => {
            fitGapOptionTexts();
        });
    }

    function toggleAnswer(answerId, buttonElement, allowsMultiple) {
        if (!allowsMultiple) {
            selectedAnswerIds = [answerId];

            document.querySelectorAll("#answerContainer .quiz-answer-btn").forEach(btn => {
                btn.classList.remove("room15-selected");
            });

            buttonElement.classList.add("room15-selected");
        } else {
            if (selectedAnswerIds.includes(answerId)) {
                selectedAnswerIds = selectedAnswerIds.filter(id => id !== answerId);
                buttonElement.classList.remove("room15-selected");
            } else {
                selectedAnswerIds.push(answerId);
                buttonElement.classList.add("room15-selected");
            }
        }

        if (selectedAnswerIds.length > 0) {
            submitAnswerBtn.classList.remove("hidden");
        } else {
            submitAnswerBtn.classList.add("hidden");
        }
    }

    async function submitAnswer() {
        const gapQuestion = isGapQuestion(currentQuestion);

        if (!currentQuestion) {
            return;
        }

        if (!gapQuestion && selectedAnswerIds.length === 0) {
            return;
        }

        if (gapQuestion) {
            const requiredGapCount = currentQuestion?.gapFields?.length || 0;
            const selectedGapCount = selectedGapAnswers.length;

            if (selectedGapCount !== requiredGapCount) {
                return;
            }
        }

        try {
            const requestBody = {
                questionId: currentQuestion.questionId,
                selectedAnswerIds: gapQuestion ? [] : selectedAnswerIds,
                gapAnswers: gapQuestion ? selectedGapAnswers : []
            };

            const response = await fetch(`/api/session/${sessionId}/room/${roomId}/answer`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.message || "Antwort konnte nicht geprüft werden.");
                return;
            }

            if (!gapQuestion) {
                document.querySelectorAll("#answerContainer .quiz-answer-btn").forEach(btn => {
                    btn.disabled = true;
                    clearRoom15StateClasses(btn);

                    const answerId = Number(btn.dataset.answerId);

                    if (data.correctAnswerIds && data.correctAnswerIds.includes(answerId)) {
                        btn.classList.add("room15-correct");
                    } else if (selectedAnswerIds.includes(answerId)) {
                        btn.classList.add("room15-wrong");
                    }
                });
            } else {
                document.querySelectorAll("#answerContainer button").forEach(btn => {
                    btn.disabled = true;
                    btn.classList.add("opacity-70", "cursor-not-allowed");
                    clearRoom15StateClasses(btn);
                });

                if (data.gapResults && Array.isArray(data.gapResults)) {
                    data.gapResults.forEach(entry => {
                        const preview = document.getElementById(`gapPreview-${entry.gapId}`);
                        const gapButtons = document.querySelectorAll(`[data-gap-id="${entry.gapId}"][data-gap-option-id]`);

                        if (preview) {
                            preview.classList.remove(
                                "room15-preview-base",
                                "room15-preview-active",
                                "room15-preview-done",
                                "room15-preview-correct",
                                "room15-preview-wrong"
                            );

                            if (entry.correct) {
                                preview.classList.add("room15-preview-correct");
                            } else {
                                preview.classList.add("room15-preview-wrong");
                                preview.innerText = `${preview.innerText} → richtig: ${entry.correctOptionText}`;
                            }
                        }

                        gapButtons.forEach(btn => {
                            const btnOptionId = Number(btn.dataset.gapOptionId);

                            if (btnOptionId === entry.correctGapOptionId) {
                                btn.classList.add("room15-correct");
                            } else if (selectedGapAnswersMap[entry.gapId] === btnOptionId) {
                                btn.classList.add("room15-wrong");
                            }
                        });
                    });
                }
            }

            feedbackBox.innerText = data.correct
                ? `Richtig! +${data.pointsEarned} Punkt(e)`
                : `Falsch! +${data.pointsEarned} Punkt(e)`;

            feedbackBox.className = data.correct
                ? "mt-6 text-center text-lg font-black text-emerald-400"
                : "mt-6 text-center text-lg font-black text-red-400";

            submitAnswerBtn.classList.add("hidden");
            nextQuestionBtn.classList.remove("hidden");

            await refreshRoomStatus();
        } catch (error) {
            console.error("Fehler beim Prüfen der Antwort:", error);
            alert("Antwort konnte nicht geprüft werden.");
        }
    }

    async function loadNextQuestion() {
        if (!currentQuestion) {
            const nextRoomId = roomId + 1;

            if (nextRoomId <= 15) {
                window.location.href = `/room/${nextRoomId}`;
            } else {
                window.location.href = "/dashboard";
            }
            return;
        }

        try {
            const response = await fetch(`/api/session/${sessionId}/room/${roomId}/advance`, {
                method: "POST"
            });

            if (!response.ok) {
                let errorMessage = "Nächste Frage konnte nicht geladen werden.";
                try {
                    const errorData = await response.json();
                    errorMessage = errorData.message || errorMessage;
                } catch (_) {
                }

                alert(errorMessage);
                return;
            }

            const responseText = await response.text();
            const nextQuestion = responseText ? JSON.parse(responseText) : null;

            if (!nextQuestion) {
                await refreshRoomStatus();
                showRoomCompletedState();
                return;
            }

            currentQuestion = nextQuestion;
            nextQuestionBtn.innerText = "Nächste Frage";
            renderQuestion(currentQuestion);
            await refreshRoomStatus();
        } catch (error) {
            console.error("Fehler beim Laden der nächsten Frage:", error);
            alert("Nächste Frage konnte nicht geladen werden.");
        }
    }

    function showRoomCompletedState() {
        currentQuestion = null;
        applyQuestionLayout(null);
        questionText.innerText = "Raum abgeschlossen.";
        answerContainer.innerHTML = "";

        feedbackBox.innerText = "Du hast alle Fragen dieses Raums beantwortet.";
        feedbackBox.className = "mt-6 text-center text-lg font-black text-emerald-400";

        submitAnswerBtn.classList.add("hidden");

        const nextRoomId = roomId + 1;

        if (nextRoomId <= 15) {
            nextQuestionBtn.innerText = `Zu Raum ${nextRoomId}`;
            nextQuestionBtn.classList.remove("hidden");
        } else {
            nextQuestionBtn.innerText = "Zurück zum Dashboard";
            nextQuestionBtn.classList.remove("hidden");
        }
    }

    window.addEventListener("resize", () => {
        applyQuestionLayout(currentQuestion);
        fitAnswerTexts();
        fitGapOptionTexts();
        fitGapQuestionText();
    });

    dialogNextBtn.addEventListener("click", nextDialogLine);
    startQuizBtn.addEventListener("click", startQuiz);
    submitAnswerBtn.addEventListener("click", submitAnswer);
    nextQuestionBtn.addEventListener("click", loadNextQuestion);

    updateHeadlineOverview();
    initRandomPandas();
    initWelcomeRoom();
</script>
</body>
</html>
