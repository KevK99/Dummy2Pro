<header th:fragment="headline(title, subtitle, avatarUrl, answeredQuestions, totalQuestions)" class="w-full px-64 pt-6 pb-2">
    <div class="flex justify-between gap-6">
        <div class="flex items-start gap-4">
            <!-- Der Home-Button wird nur in Ansichten ohne Fortschrittsanzeige eingeblendet. -->
            <div th:if="${answeredQuestions == null and totalQuestions == null}" th:replace="~{fragments/home-button :: homeButton}"></div>

            <div>
                <h1 id="headlineTitle" class="text-3xl font-extrabold tracking-tight text-white dark:text-slate-800" th:text="${title}">
                    Titel
                </h1>

                <p th:if="${subtitle != null}" id="headlineSubtitle" class="mt-2 text-blue-200 dark:text-slate-700" th:text="${subtitle}">
                    Untertitel
                </p>

                <p th:if="${subtitle == null}" class="mt-2 text-slate-300 dark:text-slate-700">
                    Spielstand:
                    <span id="headlineAnsweredQuestions" th:text="${answeredQuestions}">0</span>
                    /
                    <span id="headlineTotalQuestions" th:text="${totalQuestions}">0</span>
                    Fragen abgeschlossen 🚀
                </p>
            </div>
        </div>

        <div class="flex items-start gap-4">
            <div th:replace="~{fragments/darkmode-button :: darkmodeButton}"></div>

            <div>
                <!-- Das Avatarbild dient gleichzeitig als Einstieg in die Profilseite. -->
                <a th:href="@{/profile.html}" class="block text-center">
                    <img id="headlineAvatar"
                         th:src="${avatarUrl}"
                         alt="duck"
                         class="w-20 h-20 rounded-full hover:cursor-pointer mb-3 object-cover" />
                </a>
            </div>
        </div>
    </div>
</header>
