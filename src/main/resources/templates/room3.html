<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dummy2Pro - Raum 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-indigo-700 text-white font-mono min-h-screen">

    <!-- HEADER FULL WIDTH -->
    <header class="w-full px-12 pt-10 pb-6 border-b border-white/20">

        <h1 class="text-3xl font-black tracking-widest">
            Raum 3
        </h1>

        <!-- TODO: use actual Theme -->
        <p class="text-sm text-blue-200 mt-1">
            Thema: Netzwerke
        </p>

    </header>

    <!-- TODO: show welcome container first, then show quiz game -->

    <!-- WELCOME CONTAINER -->
    <main class="flex justify-center mt-10 hidden">

        <div class="w-full max-w-6xl px-6">

            <!-- ROOM -->
            <section class="relative bg-[#222a66] border-[10px] border-[#050a14] shadow-2xl">

                <!-- FLOOR -->
                <div class="absolute inset-12 bg-[#0a2a3a] border-4 border-white/30"></div>

                <!-- ROOM CONTENT -->
                <div class="relative h-[480px] flex items-center justify-center">

                    <!-- SPEECH PANEL -->
                    <div class="absolute top-8 left-1/2 -translate-x-1/2 w-1/2">
                        <div class="bg-[#0a1022] border-4 border-[#e9f0ff] px-8 py-6 relative">
                            <div class="border border-[#1a2a52] absolute inset-2 pointer-events-none"></div>
                            <p class="text-lg">Hey.</p>
                            <p class="text-lg">Willkommen im Raum 3…</p>
                        </div>

                        <!-- speech tail -->
                        <div class="absolute left-1/2 -translate-x-1/2 top-full">
                            <div class="w-10 h-10 bg-[#0a1022] border-4 border-[#e9f0ff] rotate-45 -translate-y-3"></div>
                        </div>

                    </div>

                    <!-- CHARACTER HERE-->

                </div>

                <!-- CORRIDOR -->
                <div class="absolute left-1/2 -translate-x-1/2 -bottom-16 w-28 h-36 bg-gray-500 border-x-[20px] border-black"></div>
            </section>
        </div>
    </main>

    <!-- GAME-->
    <div class="bg-indigo-700 text-white font-mono">
        <div class="w-[1200px] h-[680px] mx-auto relative bg-yellow-500/90 overflow-hidden">

            <!-- PANDA ÒwÓ bleibt !!!!!! -->
            <div class="absolute left-[360px] top-[120px] flex flex-col items-center">

                <div class="w-[170px] h-[30px] bg-white/80 rounded-full blur-sm"></div>

                <svg class="w-[220px] mt-[-10px]" viewBox="0 0 24 24" shape-rendering="crispEdges">

                    <rect x="19" y="4" width="2" height="16" fill="#8b5a2b"/>
                    <rect x="18" y="3" width="4" height="2" fill="#8b5a2b"/>
                    <rect x="18" y="2" width="4" height="1" fill="#6f4421"/>
                    <rect x="19" y="1" width="2" height="2" fill="#22c55e"/>

                    <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                    <rect x="8" y="4" width="8" height="6" fill="#e9f0ff"/>

                    <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                    <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                    <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                    <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                    <rect x="7" y="13" width="10" height="7" fill="#2b4aa8"/>

                    <rect x="5" y="14" width="2" height="3" fill="#e9f0ff"/>
                    <rect x="17" y="14" width="2" height="3" fill="#e9f0ff"/>

                    <rect x="8" y="20" width="3" height="2" fill="#e9f0ff"/>
                    <rect x="13" y="20" width="3" height="2" fill="#e9f0ff"/>

                </svg>

            </div>

            <!-- QUESTION PANEL -->
            <div class="absolute left-[30px] bottom-[30px] w-[830px] bg-emerald-500 border-4 border-[#e9f0ff] shadow-2xl">

                <div class="p-6">

                    <h2 class="text-lg font-black tracking-widest">FRAGE</h2>

                    <div class="border-t border-white/20 mt-2 mb-6"></div>

                    <!-- TODO: show correct question -->
                    <div class="text-center text-lg leading-7">
                        Welches Protokoll arbeitet auf Schicht 3 <br>
                        und wird für Routing verwendet?
                    </div>

                    <div class="text-sm text-yellow-400 mt-8 mb-2">
                        ANTWORTEN
                    </div>

                    <!-- TODO: show correct answers-->
                    <!-- ANSWERS -->
                    <div class="grid grid-cols-2 gap-4">

                        <button class="flex items-center gap-4 border-4 border-yellow-400 px-6 py-4 font-black text-yellow-400 text-lg">
                            ⚔️ A) IP
                        </button>

                        <button class="flex items-center gap-4 border-4 border-yellow-400 px-6 py-4 font-black text-yellow-400 text-lg">
                            ✋ B) TCP
                        </button>

                        <button class="flex items-center gap-4 border-4 border-yellow-400 px-6 py-4 font-black text-yellow-400 text-lg">
                            🎒 C) Ethernet
                        </button>

                        <button class="flex items-center gap-4 border-4 border-yellow-400 px-6 py-4 font-black text-yellow-400 text-lg">
                            ❤️ D) DNS
                        </button>

                    </div>

                </div>
            </div>

            <!-- TODO: show correct status -> watch TODO's-->
            <!-- STATUS PANEL -->
            <div class="absolute right-[30px] top-[30px] w-[260px] h-[600px] bg-emerald-500 border-4 border-[#e9f0ff] shadow-2xl p-6">

                <h2 class="text-xl font-black mb-6">STATUS</h2>

                <div class="space-y-2 text-sm">
                    <!-- TODO: -->
                    <div>Punkte (Thema): <b>12/20</b></div>
                    <!-- TODO: -->
                    <div>Gesamtfragen: <b>12/40</b></div>

                </div>

                <!-- PROGRESS -->
                <div class="mt-8">

                    <div class="text-xs text-gray-400 mb-1">Thema-Fortschritt</div>

                    <div class="h-4 bg-white/10 border border-white relative">
                        <!-- TODO: enter correct % -->
                        <div class="absolute left-0 top-0 h-full bg-emerald-500 w-[60%]"></div>
                    </div>
                    <!-- TODO: enter correct % -->
                    <div class="text-right text-xs text-gray-400 mt-1">60%</div>

                </div>

                <div class="mt-6">

                    <div class="text-xs text-gray-400 mb-1">Fragen-Fortschritt</div>

                    <div class="h-4 bg-white/10 border border-white relative">
                        <!-- TODO: enter correct % -->
                        <div class="absolute left-0 top-0 h-full bg-yellow-400 w-[30%]"></div>
                    </div>
                    <!-- TODO: enter correct % -->
                    <div class="text-right text-xs text-gray-400 mt-1">30%</div>

                </div>

                <hr class="my-8 border-white/20">

                <!-- TODO: Show current step or else just let it invisible-->
                <div class="space-y-2 text-sm invisible">
                    <div>Status: <b>Bronze</b></div>
                    <div>Fragen: <b>2</b></div>
                    <div>Punkte: <b>0/2</b></div>
                </div>

                <!-- TODO: show actual progess-->
                <div class="mt-8">
                    <div class="bg-yellow-400 text-black font-black text-xs text-center py-2 rounded-lg">
                        IN PROGRESS (12%)
                    </div>
                </div>
            </div>
        </div>
    </div>

    </body>
</html>
