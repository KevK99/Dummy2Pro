<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::body})}">

<!-- head wird überschrieben
<head>
    <meta charset="UTF-8">
    <title>Dummy2Pro - Raum 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
-->

<body class="bg-[#000010] text-white font-mono tracking-wider min-h-screen">

<!-- HEADER FULL WIDTH -->
<header class="w-full px-12 pt-10 pb-6 border-b border-white/20">
    <h1 class="text-3xl font-black tracking-widest">
        Raum 1
    </h1>

    <p class="text-sm text-blue-200 mt-1">
        Thema: Netzwerke
    </p>
</header>

<!-- WELCOME CONTAINER -->
<main id="welcomeContainer" class="flex justify-center mt-10">
    <div class="w-full max-w-6xl px-6 relative">
        <section
            class="relative border-[10px] border-[#050a14] shadow-2xl overflow-visible"
            style="
                background-color: #222a66;
                background-image:
                    radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1px),
                    radial-gradient(rgba(140,170,255,0.10) 1px, transparent 1px),
                    radial-gradient(rgba(20,30,90,0.18) 1px, transparent 1px);
                background-size: 18px 18px, 18px 18px, 18px 18px;
                background-position: 0 0, 9px 9px, 4px 4px;
            ">

            <!-- FLOOR -->
            <div
                class="absolute inset-12 border-4 border-white/30"
                style="
                    background-color: #0a2a3a;
                    background-image:
                        radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                        radial-gradient(rgba(120,170,190,0.10) 1px, transparent 1px),
                        radial-gradient(rgba(5,20,30,0.22) 1px, transparent 1px);
                    background-size: 20px 20px, 20px 20px, 20px 20px;
                    background-position: 0 0, 10px 10px, 5px 5px;
                ">
            </div>

            <!-- ROOM CONTENT -->
            <div class="relative h-[560px] flex items-center justify-center">

                <!-- SPEECH PANEL -->
                <div class="absolute top-8 left-1/2 -translate-x-[42%] w-[62%] z-20">
                    <div class="relative min-h-[150px]">
                        <!-- outer bubble -->
                        <div
                                class="absolute inset-0 bg-[#f5f8ff]"
                                style="
                clip-path: polygon(
                    20px 0,
                    calc(100% - 20px) 0,
                    100% 20px,
                    100% calc(100% - 20px),
                    calc(100% - 20px) 100%,
                    20px 100%,
                    0 calc(100% - 20px),
                    0 20px
                );
            ">
                        </div>

                        <!-- bubble fill -->
                        <div
                                class="absolute inset-[5px] bg-[#0a1022]"
                                style="
                                    clip-path: polygon(
                                        18px 0,
                                        calc(100% - 18px) 0,
                                        100% 18px,
                                        100% calc(100% - 18px),
                                        calc(100% - 18px) 100%,
                                        18px 100%,
                                        0 calc(100% - 18px),
                                        0 18px
                                    );
                                ">
                        </div>

                        <!-- inner stroke -->
                        <div
                                class="absolute inset-[14px] border border-[#1a2a52]"
                                style="
                                    clip-path: polygon(
                                        14px 0,
                                        calc(100% - 14px) 0,
                                        100% 14px,
                                        100% calc(100% - 14px),
                                        calc(100% - 14px) 100%,
                                        14px 100%,
                                        0 calc(100% - 14px),
                                        0 14px
                                    );
                                ">
                        </div>

                        <!-- text -->
                        <div class="relative px-10 py-8 min-h-[150px]">
                            <div id="dialogText" class="text-lg leading-8 whitespace-pre-line pr-2 text-white">
                                Hey.
                            </div>
                        </div>
                    </div>

                    <!-- speech tail -->
                    <div class="absolute left-[72%] -translate-x-1/2 top-full -translate-y-[1px]">
                        <!-- tail outer -->
                        <div
                                class="relative w-[40px] h-[34px] bg-[#f5f8ff]"
                                style="
                                    clip-path: polygon(
                                        0 0,
                                        100% 0,
                                        100% 55%,
                                        68% 100%,
                                        32% 100%,
                                        0 55%
                                    );
                                ">
                            <!-- tail fill -->
                            <div
                                    class="absolute inset-[4px] bg-[#0a1022]"
                                    style="
                                        clip-path: polygon(
                                            0 0,
                                            100% 0,
                                            100% 55%,
                                            68% 100%,
                                            32% 100%,
                                            0 55%
                                        );
                                    ">
                            </div>

                            <!-- tail inner stroke -->
                            <div
                                    class="absolute inset-[10px] border border-[#1a2a52]"
                                    style="
                                        clip-path: polygon(
                                            0 0,
                                            100% 0,
                                            100% 55%,
                                            68% 100%,
                                            32% 100%,
                                            0 55%
                                        );
                                    ">
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Troll-CHARACTER -->
                <div class="absolute left-1/2 -translate-x-1/2 bottom-[70px] flex flex-col items-center z-10">
                    <div class="w-[170px] h-[30px] bg-white/50 rounded-full blur-sm"></div>

                    <svg class="w-[230px] mt-[-10px]" viewBox="0 0 24 24" shape-rendering="crispEdges">
                        <rect x="19" y="4" width="2" height="16" fill="#8b5a2b"/>
                        <rect x="18" y="3" width="4" height="2" fill="#8b5a2b"/>
                        <rect x="18" y="2" width="4" height="1" fill="#6f4421"/>
                        <rect x="19" y="1" width="2" height="2" fill="#22c55e"/>

                        <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                        <rect x="8" y="4" width="8" height="6" fill="#e9f0ff"/>

                        <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                        <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                        <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                        <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                        <rect x="7" y="13" width="10" height="7" fill="#2b4aa8"/>

                        <rect x="5" y="14" width="2" height="3" fill="#e9f0ff"/>
                        <rect x="17" y="14" width="2" height="3" fill="#e9f0ff"/>

                        <rect x="8" y="20" width="3" height="2" fill="#e9f0ff"/>
                        <rect x="13" y="20" width="3" height="2" fill="#e9f0ff"/>
                    </svg>
                </div>

                <!-- Raum-CHARACTER -->
                <div class="absolute right-[140px] bottom-[95px] z-10">
                    <img
                            src="/room-characters/Krieger.png"
                            alt="Raumcharakter Krieger"
                            class="w-[150px]"
                            style="image-rendering: pixelated;"
                    >
                </div>

                <!-- CONTROLS -->
                <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex gap-4">
                    <button id="dialogNextBtn"
                            class="bg-violet-700 text-white px-6 py-3 rounded-lg font-black hover:bg-violet-600">
                        Weiter
                    </button>

                    <button id="startQuizBtn"
                            class="hidden bg-emerald-600 text-white px-6 py-3 rounded-lg font-black hover:bg-emerald-500">
                        Gespräch beenden
                    </button>
                </div>
            </div>

        </section>
        <!-- CORRIDOR -->
        <div class="absolute left-1/2 -translate-x-1/2 top-[calc(100%-3rem)] w-28 h-[220px] z-0 pointer-events-none">
            <!-- linke Außenwand -->
            <div class="absolute left-0 top-0 w-[10px] h-full bg-[#222a66]"></div>

            <!-- linke graue Innenkante -->
            <div class="absolute left-[10px] top-0 w-[4px] h-full bg-[#8f9fa3]"></div>

            <!-- Mitte / Flurboden -->
            <div class="absolute left-[14px] top-0 w-[84px] h-full bg-[#0a2a3a]"></div>

            <!-- rechte graue Innenkante -->
            <div class="absolute left-[98px] top-0 w-[4px] h-full bg-[#8f9fa3]"></div>

            <!-- rechte Außenwand -->
            <div class="absolute left-[102px] top-0 w-[10px] h-full bg-[#222a66]"></div>
        </div>
    </div>

</main>

<!-- GAME -->
<div id="gameContainer" class="bg-[#000010] text-white font-mono tracking-wider hidden">
    <div class="w-[1200px] h-[680px] mx-auto relative bg-[#081020]/70 overflow-hidden">

        <!-- PANDA -->
        <div class="absolute left-[360px] top-[120px] flex flex-col items-center">
            <div class="w-[170px] h-[30px] bg-white/80 rounded-full blur-sm"></div>

            <svg class="w-[220px] mt-[-10px]" viewBox="0 0 24 24" shape-rendering="crispEdges">
                <rect x="19" y="4" width="2" height="16" fill="#8b5a2b"/>
                <rect x="18" y="3" width="4" height="2" fill="#8b5a2b"/>
                <rect x="18" y="2" width="4" height="1" fill="#6f4421"/>
                <rect x="19" y="1" width="2" height="2" fill="#22c55e"/>

                <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                <rect x="8" y="4" width="8" height="6" fill="#e9f0ff"/>

                <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                <rect x="7" y="13" width="10" height="7" fill="#2b4aa8"/>

                <rect x="5" y="14" width="2" height="3" fill="#e9f0ff"/>
                <rect x="17" y="14" width="2" height="3" fill="#e9f0ff"/>

                <rect x="8" y="20" width="3" height="2" fill="#e9f0ff"/>
                <rect x="13" y="20" width="3" height="2" fill="#e9f0ff"/>
            </svg>
        </div>

        <!-- QUESTION PANEL -->
        <div class="absolute left-[30px] bottom-[30px] w-[830px] bg-[#0a1022] border-4 border-[#e9f0ff] shadow-2xl">
            <div class="p-6">
                <h2 class="text-lg font-black tracking-widest">FRAGE</h2>

                <div class="border-t border-white/20 mt-2 mb-6"></div>

                <div id="questionText" class="text-center text-lg leading-7 min-h-[84px]">
                    Frage wird geladen...
                </div>

                <div class="text-sm text-gray-400 mt-8 mb-2">
                    ANTWORTEN
                </div>

                <div id="answerContainer" class="grid grid-cols-2 gap-4 min-h-[180px]"></div>

                <div id="feedbackBox" class="mt-6 text-center text-lg font-black"></div>

                <div class="mt-6 flex justify-center">
                    <button id="submitAnswerBtn"
                            class="hidden bg-indigo-600 text-white px-6 py-3 rounded-lg font-black hover:bg-indigo-500">
                        Antwort prüfen
                    </button>

                    <button id="nextQuestionBtn"
                            class="hidden bg-emerald-600 text-white px-6 py-3 rounded-lg font-black hover:bg-emerald-500">
                        Nächste Frage
                    </button>
                </div>
            </div>
        </div>

        <!-- STATUS PANEL -->
        <div class="absolute right-[30px] top-[30px] w-[260px] h-[600px] bg-[#0b1327] border-4 border-[#e9f0ff] shadow-2xl p-6">
            <h2 class="text-xl font-black mb-6">STATUS</h2>

            <div class="space-y-2 text-sm">
                <div>Punkte (Thema): <b id="earnedPoints">0/0</b></div>
                <div>Gesamtfragen: <b id="questionProgress">0/0</b></div>
            </div>

            <div class="mt-8">
                <div class="text-xs text-gray-400 mb-1">Thema-Fortschritt</div>

                <div class="h-4 bg-white/10 border border-white relative">
                    <div id="themeProgressBar" class="absolute left-0 top-0 h-full bg-emerald-500 w-0"></div>
                </div>

                <div id="themeProgressText" class="text-right text-xs text-gray-400 mt-1">0%</div>
            </div>

            <div class="mt-6">
                <div class="text-xs text-gray-400 mb-1">Fragen-Fortschritt</div>

                <div class="h-4 bg-white/10 border border-white relative">
                    <div id="questionProgressBar" class="absolute left-0 top-0 h-full bg-yellow-400 w-0"></div>
                </div>

                <div id="questionProgressText" class="text-right text-xs text-gray-400 mt-1">0%</div>
            </div>

            <hr class="my-8 border-white/20">

            <div class="space-y-2 text-sm invisible">
                <div>Status: <b>Bronze</b></div>
                <div>Fragen: <b>2</b></div>
                <div>Punkte: <b>0/2</b></div>
            </div>

            <div class="mt-8">
                <div id="roomStatusBadge" class="bg-yellow-400 text-black font-black text-xs text-center py-2 rounded-lg">
                    IN PROGRESS (0%)
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const roomId = 1;

    const userId = sessionStorage.getItem("userId");
    const runId = sessionStorage.getItem("runId");
    const sessionId = sessionStorage.getItem("sessionId");

    if (!userId) {
        alert("Kein eingeloggter User gefunden.");
        window.location.href = "/";
        throw new Error("Kein eingeloggter User gefunden.");
    }

    if (!sessionId || !runId) {
        alert("Kein aktiver Spielstand geladen.");
        window.location.href = "/dashboard";
        throw new Error("Kein aktiver Spielstand geladen.");
    }

    let currentQuestion = null;
    let selectedAnswerIds = [];
    let selectedGapAnswers = [];
    let selectedGapAnswersMap = {};
    let roomLoaded = false;

    const welcomeContainer = document.getElementById("welcomeContainer");
    const gameContainer = document.getElementById("gameContainer");

    const dialogText = document.getElementById("dialogText");
    const dialogNextBtn = document.getElementById("dialogNextBtn");
    const startQuizBtn = document.getElementById("startQuizBtn");

    const questionText = document.getElementById("questionText");
    const answerContainer = document.getElementById("answerContainer");
    const feedbackBox = document.getElementById("feedbackBox");
    const submitAnswerBtn = document.getElementById("submitAnswerBtn");
    const nextQuestionBtn = document.getElementById("nextQuestionBtn");

    const introDialog = [
        "Hey.",
        "Willkommen im Raum 1…",
        "Hier schauen wir uns die Grundlagen zu Netzwerken an.",
        "Hör gut zu und lies genau.",
        "Danach beginnt die erste Frage."
    ];

    let dialogIndex = 0;

    function isGapQuestion(question) {
        return question &&
            (question.questionType === "GAP" ||
                (question.gapFields && question.gapFields.length > 0));
    }

    function showCurrentDialogLine() {
        dialogText.innerText = introDialog[dialogIndex];

        if (dialogIndex >= introDialog.length - 1) {
            dialogNextBtn.classList.add("hidden");
            startQuizBtn.classList.remove("hidden");
        } else {
            dialogNextBtn.classList.remove("hidden");
            startQuizBtn.classList.add("hidden");
        }
    }

    function nextDialogLine() {
        if (dialogIndex < introDialog.length - 1) {
            dialogIndex++;
            showCurrentDialogLine();
        }
    }

    async function startQuiz() {
        welcomeContainer.classList.add("hidden");
        gameContainer.classList.remove("hidden");

        if (!roomLoaded) {
            const loaded = await loadRoom();
            roomLoaded = loaded === true;
        }
    }

    async function loadRoom() {
        try {
            const response = await fetch(`/api/session/${sessionId}/room/${roomId}`);
            const data = await response.json();

            if (!response.ok) {
                sessionStorage.removeItem("sessionId");
                sessionStorage.removeItem("runId");
                alert(data.message || "Raum konnte nicht geladen werden.");
                window.location.href = "/dashboard";
                return false;
            }

            currentQuestion = data.firstQuestion;
            renderQuestion(currentQuestion);
            updateStatus(data.status);
            return true;
        } catch (error) {
            console.error("Fehler beim Laden des Raums:", error);
            alert("Raum konnte nicht geladen werden.");
            return false;
        }
    }

    function renderQuestion(question) {
        selectedAnswerIds = [];
        selectedGapAnswers = [];
        selectedGapAnswersMap = {};
        feedbackBox.innerText = "";
        submitAnswerBtn.classList.add("hidden");
        nextQuestionBtn.classList.add("hidden");

        if (!question) {
            questionText.innerText = "Keine weitere Frage vorhanden.";
            answerContainer.innerHTML = "";
            return;
        }

        questionText.innerText = question.startText || "Keine Frage vorhanden.";
        answerContainer.innerHTML = "";

        if (isGapQuestion(question)) {
            renderGapQuestion(question);
            return;
        }

        if (!question.answerOptions || question.answerOptions.length === 0) {
            answerContainer.innerHTML = `
            <div class="col-span-2 text-center text-red-300">
                Dieser Fragetyp wird hier noch nicht unterstützt.
            </div>
        `;
            return;
        }

        answerContainer.className = "grid grid-cols-2 gap-4 min-h-[180px]";

        question.answerOptions.forEach((option, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.dataset.answerId = option.answerId;
            button.className = "flex items-center gap-4 border-4 border-yellow-400 px-6 py-4 font-black text-yellow-400 text-lg text-left";
            button.innerText = `${String.fromCharCode(65 + index)}) ${option.optionText}`;

            button.addEventListener("click", () => {
                toggleAnswer(option.answerId, button, question.allowsMultiple);
            });

            answerContainer.appendChild(button);
        });
    }

    function renderGapQuestion(question) {
        answerContainer.className = "flex flex-col gap-4 min-h-[180px]";

        if (!question.gapFields || question.gapFields.length === 0) {
            answerContainer.innerHTML = `
            <div class="text-center text-red-300">
                GAP-Frage enthält keine Lückenfelder.
            </div>
        `;
            return;
        }

        question.gapFields.forEach((gapField, gapIndex) => {
            const wrapper = document.createElement("div");
            wrapper.className = "border-4 border-yellow-400 p-4";

            const textBlock = document.createElement("div");
            textBlock.className = "text-lg text-white mb-4 leading-8";

            const before = gapField.textBefore || "";
            const after = gapField.textAfter || "";

            textBlock.innerHTML = `
                <span>${escapeHtml(before)}</span>
                <span id="gapPreview-${gapField.gapId}" class="inline-block min-w-[180px] px-4 py-2 mx-2 border-2 border-dashed border-white/40 text-center text-yellow-300">
                    [ Lücke ${gapIndex + 1} ]
                </span>
                <span>${escapeHtml(after)}</span>
            `;

            wrapper.appendChild(textBlock);

            const optionsWrap = document.createElement("div");
            optionsWrap.className = "grid grid-cols-2 gap-3";

            const options = gapField.gapOptions || [];

            options.forEach((option, optionIndex) => {
                const button = document.createElement("button");
                button.type = "button";
                button.dataset.gapId = gapField.gapId;
                button.dataset.gapOptionId = option.gapOptionId;
                button.className = "border-4 border-yellow-400 px-4 py-3 font-black text-yellow-400 text-left";
                button.innerText = `${String.fromCharCode(65 + optionIndex)}) ${option.optionText}`;

                button.addEventListener("click", () => {
                    selectGapOption(gapField.gapId, option.gapOptionId, button);
                });

                optionsWrap.appendChild(button);
            });

            wrapper.appendChild(optionsWrap);
            answerContainer.appendChild(wrapper);
        });
    }

    function selectGapOption(gapId, gapOptionId, buttonElement) {
        selectedGapAnswersMap[gapId] = gapOptionId;

        selectedGapAnswers = Object.entries(selectedGapAnswersMap).map(([gapIdKey, gapOptionIdValue]) => ({
            gapId: Number(gapIdKey),
            selectedGapOptionId: Number(gapOptionIdValue)
        }));

        document.querySelectorAll(`[data-gap-id="${gapId}"]`).forEach(btn => {
            btn.classList.remove("bg-yellow-400", "text-black");
        });

        buttonElement.classList.add("bg-yellow-400", "text-black");

        const preview = document.getElementById(`gapPreview-${gapId}`);
        if (preview) {
            const fullText = buttonElement.innerText;
            const cleanedText = fullText.replace(/^[A-Z]\)\s*/, "");

            preview.innerText = cleanedText;
            preview.classList.remove("border-dashed", "border-white/40", "text-yellow-300");
            preview.classList.add("border-solid", "border-yellow-400", "text-white", "bg-yellow-400/10");
        }

        const requiredGapCount = currentQuestion?.gapFields?.length || 0;
        const selectedGapCount = selectedGapAnswers.length;

        if (selectedGapCount === requiredGapCount && requiredGapCount > 0) {
            submitAnswerBtn.classList.remove("hidden");
        } else {
            submitAnswerBtn.classList.add("hidden");
        }
    }

    function toggleAnswer(answerId, buttonElement, allowsMultiple) {
        if (!allowsMultiple) {
            selectedAnswerIds = [answerId];

            document.querySelectorAll("#answerContainer button").forEach(btn => {
                btn.classList.remove("bg-yellow-400", "text-black");
            });

            buttonElement.classList.add("bg-yellow-400", "text-black");
        } else {
            if (selectedAnswerIds.includes(answerId)) {
                selectedAnswerIds = selectedAnswerIds.filter(id => id !== answerId);
                buttonElement.classList.remove("bg-yellow-400", "text-black");
            } else {
                selectedAnswerIds.push(answerId);
                buttonElement.classList.add("bg-yellow-400", "text-black");
            }
        }

        if (selectedAnswerIds.length > 0) {
            submitAnswerBtn.classList.remove("hidden");
        } else {
            submitAnswerBtn.classList.add("hidden");
        }
    }

    async function submitAnswer() {
        const gapQuestion = isGapQuestion(currentQuestion);

        if (!currentQuestion) {
            return;
        }

        if (!gapQuestion && selectedAnswerIds.length === 0) {
            return;
        }

        if (gapQuestion) {
            const requiredGapCount = currentQuestion?.gapFields?.length || 0;
            const selectedGapCount = selectedGapAnswers.length;

            if (selectedGapCount !== requiredGapCount) {
                return;
            }
        }

        try {
            const requestBody = {
                questionId: currentQuestion.questionId,
                selectedAnswerIds: gapQuestion ? [] : selectedAnswerIds,
                gapAnswers: gapQuestion ? selectedGapAnswers : []
            };

            const response = await fetch(`/api/session/${sessionId}/room/${roomId}/answer`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.message || "Antwort konnte nicht geprüft werden.");
                return;
            }

            if (!gapQuestion) {
                document.querySelectorAll("#answerContainer button").forEach(btn => {
                    btn.disabled = true;
                    const answerId = Number(btn.dataset.answerId);

                    if (data.correctAnswerIds && data.correctAnswerIds.includes(answerId)) {
                        btn.classList.remove("border-yellow-400", "text-yellow-400");
                        btn.classList.add("border-emerald-500", "text-emerald-400");
                    } else if (selectedAnswerIds.includes(answerId)) {
                        btn.classList.remove("border-yellow-400", "text-yellow-400", "bg-yellow-400", "text-black");
                        btn.classList.add("border-red-500", "text-red-400");
                    }
                });
            } else {
                document.querySelectorAll("#answerContainer button").forEach(btn => {
                    btn.disabled = true;
                });
            }

            feedbackBox.innerText = data.correct
                ? `Richtig! +${data.pointsEarned} Punkt(e)`
                : `Falsch! +${data.pointsEarned} Punkt(e)`;

            feedbackBox.className = data.correct
                ? "mt-6 text-center text-lg font-black text-emerald-400"
                : "mt-6 text-center text-lg font-black text-red-400";

            submitAnswerBtn.classList.add("hidden");
            nextQuestionBtn.classList.remove("hidden");

            await refreshRoomStatus();
        } catch (error) {
            console.error("Fehler beim Prüfen der Antwort:", error);
            alert("Antwort konnte nicht geprüft werden.");
        }
    }

    async function loadNextQuestion() {
        try {
            const response = await fetch(`/api/session/${sessionId}/room/${roomId}/advance`, {
                method: "POST"
            });

            const nextQuestion = await response.json();

            if (!response.ok) {
                alert(nextQuestion.message || "Nächste Frage konnte nicht geladen werden.");
                return;
            }

            if (!nextQuestion) {
                currentQuestion = null;
                questionText.innerText = "Raum abgeschlossen.";
                answerContainer.innerHTML = "";
                feedbackBox.innerText = "Du hast alle Fragen dieses Raums beantwortet.";
                feedbackBox.className = "mt-6 text-center text-lg font-black text-emerald-400";
                submitAnswerBtn.classList.add("hidden");
                nextQuestionBtn.classList.add("hidden");
                await refreshRoomStatus();
                return;
            }

            currentQuestion = nextQuestion;
            renderQuestion(currentQuestion);
            await refreshRoomStatus();
        } catch (error) {
            console.error("Fehler beim Laden der nächsten Frage:", error);
            alert("Nächste Frage konnte nicht geladen werden.");
        }
    }

    async function refreshRoomStatus() {
        try {
            const response = await fetch(`/api/session/${sessionId}/room/${roomId}/status`);
            const status = await response.json();

            if (!response.ok) {
                return;
            }

            updateStatus(status);
        } catch (error) {
            console.error("Fehler beim Aktualisieren des Status:", error);
        }
    }

    function updateStatus(status) {
        document.getElementById("earnedPoints").innerText = `${status.earnedPoints}/${status.totalPoints}`;
        document.getElementById("questionProgress").innerText = `${status.answeredQuestions}/${status.totalQuestions}`;

        document.getElementById("themeProgressBar").style.width = `${status.completionPercent}%`;
        document.getElementById("themeProgressText").innerText = `${status.completionPercent}%`;

        const questionPercent = status.totalQuestions > 0
            ? Math.round((status.answeredQuestions / status.totalQuestions) * 1000) / 10
            : 0;

        document.getElementById("questionProgressBar").style.width = `${questionPercent}%`;
        document.getElementById("questionProgressText").innerText = `${questionPercent}%`;

        const medalText = !status.medal || status.medal === "NONE"
            ? "IN PROGRESS"
            : status.medal;

        document.getElementById("roomStatusBadge").innerText =
            `${medalText} (${status.completionPercent}%)`;
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    dialogNextBtn.addEventListener("click", nextDialogLine);
    startQuizBtn.addEventListener("click", startQuiz);
    submitAnswerBtn.addEventListener("click", submitAnswer);
    nextQuestionBtn.addEventListener("click", loadNextQuestion);

    showCurrentDialogLine();
</script>
</body>
</html>
