<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::body})}">

<!-- head wird überschrieben
<head>
    <meta charset="UTF-8">
    <title>Dummy2Pro - Raum 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#000010] text-white font-mono min-h-screen">

    <!-- HEADER FULL WIDTH -->
    <header class="w-full px-12 pt-10 pb-6 border-b border-white/20">

        <h1 class="text-3xl font-black tracking-widest">
            Raum 1
        </h1>

        <!-- TODO: use actual Theme -->
        <p class="text-sm text-blue-200 mt-1">
            Thema: Netzwerke
        </p>

    </header>

    <!-- TODO: show welcome container first, then show quiz game -->

    <!-- WELCOME CONTAINER -->
    <main class="flex justify-center mt-10 hidden">

        <div class="w-full max-w-6xl px-6">

            <!-- ROOM -->
            <section class="relative bg-[#222a66] border-[10px] border-[#050a14] shadow-2xl">

                <!-- FLOOR -->
                <div class="absolute inset-12 bg-[#0a2a3a] border-4 border-white/30"></div>

                <!-- ROOM CONTENT -->
                <div class="relative h-[480px] flex items-center justify-center">

                    <!-- SPEECH PANEL -->
                    <div class="absolute top-8 left-1/2 -translate-x-1/2 w-1/2">
                        <div class="bg-[#0a1022] border-4 border-[#e9f0ff] px-8 py-6 relative">
                            <div class="border border-[#1a2a52] absolute inset-2 pointer-events-none"></div>
                            <p class="text-lg">Hey.</p>
                            <p class="text-lg">Willkommen im Raum 1…</p>
                        </div>

                        <!-- speech tail -->
                        <div class="absolute left-1/2 -translate-x-1/2 top-full">
                            <div class="w-10 h-10 bg-[#0a1022] border-4 border-[#e9f0ff] rotate-45 -translate-y-3"></div>
                        </div>

                    </div>

                    <!-- CHARACTER HERE-->

                </div>

                <!-- CORRIDOR -->
                <div class="absolute left-1/2 -translate-x-1/2 -bottom-16 w-28 h-36 bg-gray-500 border-x-[20px] border-black"></div>
            </section>
        </div>
    </main>

    <!-- GAME-->
    <div class="bg-[#000010] text-white font-mono">

        <div class="w-[1200px] h-[680px] mx-auto relative bg-[#081020]/70 overflow-hidden">

            <!-- PANDA ÒwÓ bleibt !!!!!! -->
            <div class="absolute left-[360px] top-[120px] flex flex-col items-center">

                <div class="w-[170px] h-[30px] bg-white/80 rounded-full blur-sm"></div>

                <svg class="w-[220px] mt-[-10px]" viewBox="0 0 24 24" shape-rendering="crispEdges">

                    <rect x="19" y="4" width="2" height="16" fill="#8b5a2b"/>
                    <rect x="18" y="3" width="4" height="2" fill="#8b5a2b"/>
                    <rect x="18" y="2" width="4" height="1" fill="#6f4421"/>
                    <rect x="19" y="1" width="2" height="2" fill="#22c55e"/>

                    <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                    <rect x="8" y="4" width="8" height="6" fill="#e9f0ff"/>

                    <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                    <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                    <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                    <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                    <rect x="7" y="13" width="10" height="7" fill="#2b4aa8"/>

                    <rect x="5" y="14" width="2" height="3" fill="#e9f0ff"/>
                    <rect x="17" y="14" width="2" height="3" fill="#e9f0ff"/>

                    <rect x="8" y="20" width="3" height="2" fill="#e9f0ff"/>
                    <rect x="13" y="20" width="3" height="2" fill="#e9f0ff"/>

                </svg>

            </div>

            <!-- QUESTION PANEL -->
            <div class="absolute left-[30px] bottom-[30px] w-[830px] bg-[#0a1022] border-4 border-[#e9f0ff] shadow-2xl">

                <div class="p-6">

                    <h2 class="text-lg font-black tracking-widest">FRAGE</h2>

                    <div class="border-t border-white/20 mt-2 mb-6"></div>

                    <div id="questionText" class="text-center text-lg leading-7 min-h-[84px]">
                        Frage wird geladen...
                    </div>

                    <div class="text-sm text-gray-400 mt-8 mb-2">
                        ANTWORTEN
                    </div>

                    <div id="answerContainer" class="grid grid-cols-2 gap-4"></div>

                    <div id="feedbackBox" class="mt-6 text-center text-lg font-black"></div>

                    <div class="mt-6 flex justify-center">
                        <button id="submitAnswerBtn"
                                class="hidden bg-indigo-600 text-white px-6 py-3 rounded-lg font-black hover:bg-indigo-500">
                            Antwort prüfen
                        </button>

                        <button id="nextQuestionBtn"
                                class="hidden bg-emerald-600 text-white px-6 py-3 rounded-lg font-black hover:bg-emerald-500">
                            Nächste Frage
                        </button>
                    </div>
                </div>
            </div>

            <!-- TODO: show correct status -> watch TODO's-->
            <!-- STATUS PANEL -->
            <div class="absolute right-[30px] top-[30px] w-[260px] h-[600px] bg-[#0b1327] border-4 border-[#e9f0ff] shadow-2xl p-6">

                <h2 class="text-xl font-black mb-6">STATUS</h2>

                <div class="space-y-2 text-sm">
                    <!-- TODO: -->
                    <div>Punkte (Thema): <b id="earnedPoints">0/0</b></div>
                    <!-- TODO: -->
                    <div>Gesamtfragen: <b id="questionProgress">0/0</b></div>
                </div>

                <!-- PROGRESS -->
                <div class="mt-8">
                    <div class="text-xs text-gray-400 mb-1">Thema-Fortschritt</div>

                    <div class="h-4 bg-white/10 border border-white relative">
                        <div id="themeProgressBar" class="absolute left-0 top-0 h-full bg-emerald-500 w-0"></div>
                    </div>

                    <div id="themeProgressText" class="text-right text-xs text-gray-400 mt-1">0%</div>
                </div>

                <div class="mt-6">
                    <div class="text-xs text-gray-400 mb-1">Fragen-Fortschritt</div>

                    <div class="h-4 bg-white/10 border border-white relative">
                        <div id="questionProgressBar" class="absolute left-0 top-0 h-full bg-yellow-400 w-0"></div>
                    </div>

                    <div id="questionProgressText" class="text-right text-xs text-gray-400 mt-1">0%</div>
                </div>

                <hr class="my-8 border-white/20">

                <!-- TODO: Show current step or else just let it invisible-->
                <div class="space-y-2 text-sm invisible">
                    <div>Status: <b>Bronze</b></div>
                    <div>Fragen: <b>2</b></div>
                    <div>Punkte: <b>0/2</b></div>
                </div>

                <!-- TODO: show actual progess-->
                <div class="mt-8">
                    <div id="roomStatusBadge" class="bg-yellow-400 text-black font-black text-xs text-center py-2 rounded-lg">
                        IN PROGRESS (0%)
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const roomId = 1;
        const sessionId = sessionStorage.getItem("sessionId");

        if (!sessionId) {
            alert("Keine aktive Session gefunden.");
            window.location.href = "/login.html";
        }

        let currentQuestion = null;
        let selectedAnswerIds = [];

        const questionText = document.getElementById("questionText");
        const answerContainer = document.getElementById("answerContainer");
        const feedbackBox = document.getElementById("feedbackBox");
        const submitAnswerBtn = document.getElementById("submitAnswerBtn");
        const nextQuestionBtn = document.getElementById("nextQuestionBtn");

        async function loadRoom() {
            try {
                const response = await fetch(`/api/session/${sessionId}/room/${roomId}`);
                const data = await response.json();

                if (!response.ok) {
                    alert(data.message || "Raum konnte nicht geladen werden.");
                    return;
                }

                currentQuestion = data.firstQuestion;
                renderQuestion(currentQuestion);
                updateStatus(data.status);
            } catch (error) {
                console.error("Fehler beim Laden des Raums:", error);
                alert("Raum konnte nicht geladen werden.");
            }
        }

        function renderQuestion(question) {
            selectedAnswerIds = [];
            feedbackBox.innerText = "";
            submitAnswerBtn.classList.add("hidden");
            nextQuestionBtn.classList.add("hidden");

            if (!question) {
                questionText.innerText = "Keine weitere Frage vorhanden.";
                answerContainer.innerHTML = "";
                return;
            }

            questionText.innerText = question.startText || "Keine Frage vorhanden.";
            answerContainer.innerHTML = "";

            if (!question.answerOptions || question.answerOptions.length === 0) {
                answerContainer.innerHTML = `
                <div class="col-span-2 text-center text-red-300">
                    Dieser Fragetyp wird hier noch nicht unterstützt.
                </div>
            `;
                return;
            }

            question.answerOptions.forEach((option, index) => {
                const button = document.createElement("button");
                button.type = "button";
                button.dataset.answerId = option.answerId;
                button.className = "flex items-center gap-4 border-4 border-yellow-400 px-6 py-4 font-black text-yellow-400 text-lg text-left";
                button.innerText = `${String.fromCharCode(65 + index)}) ${option.optionText}`;

                button.addEventListener("click", () => {
                    toggleAnswer(option.answerId, button, question.allowsMultiple);
                });

                answerContainer.appendChild(button);
            });
        }

        function toggleAnswer(answerId, buttonElement, allowsMultiple) {
            if (!allowsMultiple) {
                selectedAnswerIds = [answerId];

                document.querySelectorAll("#answerContainer button").forEach(btn => {
                    btn.classList.remove("bg-yellow-400", "text-black");
                });

                buttonElement.classList.add("bg-yellow-400", "text-black");
            } else {
                if (selectedAnswerIds.includes(answerId)) {
                    selectedAnswerIds = selectedAnswerIds.filter(id => id !== answerId);
                    buttonElement.classList.remove("bg-yellow-400", "text-black");
                } else {
                    selectedAnswerIds.push(answerId);
                    buttonElement.classList.add("bg-yellow-400", "text-black");
                }
            }

            if (selectedAnswerIds.length > 0) {
                submitAnswerBtn.classList.remove("hidden");
            } else {
                submitAnswerBtn.classList.add("hidden");
            }
        }

        async function submitAnswer() {
            if (!currentQuestion || selectedAnswerIds.length === 0) {
                return;
            }

            try {
                const response = await fetch(`/api/session/${sessionId}/room/${roomId}/answer`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        questionId: currentQuestion.questionId,
                        selectedAnswerIds: selectedAnswerIds
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.message || "Antwort konnte nicht geprüft werden.");
                    return;
                }

                document.querySelectorAll("#answerContainer button").forEach(btn => {
                    btn.disabled = true;
                    const answerId = Number(btn.dataset.answerId);

                    if (data.correctAnswerIds && data.correctAnswerIds.includes(answerId)) {
                        btn.classList.remove("border-yellow-400", "text-yellow-400");
                        btn.classList.add("border-emerald-500", "text-emerald-400");
                    } else if (selectedAnswerIds.includes(answerId)) {
                        btn.classList.remove("border-yellow-400", "text-yellow-400", "bg-yellow-400", "text-black");
                        btn.classList.add("border-red-500", "text-red-400");
                    }
                });

                feedbackBox.innerText = data.correct
                    ? `Richtig! +${data.pointsEarned} Punkt(e)`
                    : `Falsch! +${data.pointsEarned} Punkt(e)`;

                feedbackBox.className = data.correct
                    ? "mt-6 text-center text-lg font-black text-emerald-400"
                    : "mt-6 text-center text-lg font-black text-red-400";

                submitAnswerBtn.classList.add("hidden");
                nextQuestionBtn.classList.remove("hidden");

                await refreshRoomStatus();
            } catch (error) {
                console.error("Fehler beim Prüfen der Antwort:", error);
                alert("Antwort konnte nicht geprüft werden.");
            }
        }

        async function loadNextQuestion() {
            try {
                const response = await fetch(`/api/session/${sessionId}/room/${roomId}/advance`, {
                    method: "POST"
                });

                const nextQuestion = await response.json();

                if (!response.ok) {
                    alert(nextQuestion.message || "Nächste Frage konnte nicht geladen werden.");
                    return;
                }

                if (!nextQuestion) {
                    questionText.innerText = "Raum abgeschlossen.";
                    answerContainer.innerHTML = "";
                    feedbackBox.innerText = "Du hast alle Fragen dieses Raums beantwortet.";
                    nextQuestionBtn.classList.add("hidden");
                    await refreshRoomStatus();
                    return;
                }

                currentQuestion = nextQuestion;
                renderQuestion(currentQuestion);
                await refreshRoomStatus();
            } catch (error) {
                console.error("Fehler beim Laden der nächsten Frage:", error);
                alert("Nächste Frage konnte nicht geladen werden.");
            }
        }

        async function refreshRoomStatus() {
            try {
                const response = await fetch(`/api/session/${sessionId}/room/${roomId}/status`);
                const status = await response.json();

                if (!response.ok) {
                    return;
                }

                updateStatus(status);
            } catch (error) {
                console.error("Fehler beim Aktualisieren des Status:", error);
            }
        }

        function updateStatus(status) {
            document.getElementById("earnedPoints").innerText = `${status.earnedPoints}/${status.totalPoints}`;
            document.getElementById("questionProgress").innerText = `${status.answeredQuestions}/${status.totalQuestions}`;

            document.getElementById("themeProgressBar").style.width = `${status.completionPercent}%`;
            document.getElementById("themeProgressText").innerText = `${status.completionPercent}%`;

            const questionPercent = status.totalQuestions > 0
                ? Math.round((status.answeredQuestions / status.totalQuestions) * 1000) / 10
                : 0;

            document.getElementById("questionProgressBar").style.width = `${questionPercent}%`;
            document.getElementById("questionProgressText").innerText = `${questionPercent}%`;

            const medalText = !status.medal || status.medal === "NONE"
                ? "IN PROGRESS"
                : status.medal;
            document.getElementById("roomStatusBadge").innerText =
                `${medalText} (${status.completionPercent}%)`;
        }

        submitAnswerBtn.addEventListener("click", submitAnswer);
        nextQuestionBtn.addEventListener("click", loadNextQuestion);

        loadRoom();
    </script>
</body>
</html>
