<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Dummy2Pro</title>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="mx-auto max-w-6xl px-6 py-10 space-y-8">

        <header class="flex items-start justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Willkommen zurück, NutzerName!</h1>
                <p class="mt-2 text-slate-300">Spielstand: 25 / 78 Fragen abgeschlossen 🚀</p>
            </div>

            <select id="numberSelect" class="bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 focus:outline-none transition">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
            </select>


            <button
                type="button"
                class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 disabled:bg-gray-700 disabled:shadow-none"
                onclick="test()"
            >
                click
            </button>


            <span class="rounded-full bg-violet-500/20 px-3 py-1 text-xs font-bold text-violet-200 ring-1 ring-violet-500/30">
                <a href="../static/profile.html">❤️ Account</a>
            </span>
        </header>

        <div id="room1"></div>

    </div>


    <script>

        let number = document.getElementById('numberSelect').value;

        function test() {
            console.log(number);

        }
        fetch(`room${number}.html`)
            .then(response => {
            return response.text();
        })
        .then(HTML => {
            document.getElementById(`room${number}`).innerHTML = HTML;
        })

    </script>
</body>
</html>
