<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, bodyClass)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} ?: 'Dummy2Pro'">Dummy2Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/room-common.css}">
    <script th:src="@{/js/sound-manager.js}"></script>
    <script th:src="@{/js/ui-feedback.js}"></script>
    <script th:src="@{/js/room-common.js}"></script>
</head>

<body th:class="${bodyClass} ?: 'min-h-screen bg-slate-950 text-white'">
<div th:replace="~{fragments/feedback :: feedbackRoot}"></div>

<div class="w-full">
    <th:block th:replace="${content}"></th:block>
</div>

<script defer src="/js/medal.js"></script>
</body>

<style>
    html, body {
        margin: 0;
        padding: 0;
    }
</style>

</html>
