<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::body}, 'min-h-screen bg-[#020403] text-white font-mono tracking-wider dark:bg-[#000000] overflow-x-hidden')}">

<body class="min-h-screen bg-[#020403] text-white font-mono tracking-wider dark:bg-[#000000] overflow-x-hidden">

<!-- Raumseite für Raum 16 mit eigener Themeninszenierung und quizgesteuertem Ablauf im Raum. -->
<div th:replace="~{fragments/headline :: headline(${ 'Raum ' + roomId}, ${'Thema: ' + themeName}, ${avatarUrl}, null, null)}"></div>

<style>
    :root {
        --room-home-btn-bg: #22c55e;
        --room-home-btn-hover-bg: #16a34a;
        --room-home-btn-text: #001b08;
        --room-home-btn-border: #86efac;
        --panda-tip-fill: #22c55e;
    }

    html.dark {
        --room-home-btn-bg: #22c55e;
        --room-home-btn-hover-bg: #16a34a;
        --room-home-btn-text: #001b08;
        --room-home-btn-border: #86efac;
        --panda-tip-fill: #22c55e;
    }

    .panda-leaf-fill {
        fill: #00ff66;
    }
</style>

<!-- WELCOME CONTAINER -->
<main id="welcomeContainer" class="flex justify-center mt-10">
    <div class="w-full max-w-6xl px-6 relative">
        <section
                class="relative border-[10px] border-[#00ff66] shadow-2xl overflow-visible bg-[#031108] dark:bg-[#031108]"
                style="
            box-shadow:
                0 0 0 2px #001f0c,
                0 0 18px rgba(34,197,94,0.55),
                0 0 40px rgba(34,197,94,0.20);
            background-image:
                linear-gradient(rgba(34,197,94,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34,197,94,0.06) 1px, transparent 1px),
                radial-gradient(rgba(34,197,94,0.10) 1px, transparent 1px);
            background-size: 26px 26px, 26px 26px, 18px 18px;
            background-position: 0 0, 0 0, 8px 8px;
        ">

            <!-- FLOOR -->
            <div
                    class="absolute inset-12 border-4 border-[#22c55e]/50"
                    style="
                background-color: #000000;
                background-image:
                    linear-gradient(rgba(34,197,94,0.06) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(34,197,94,0.06) 1px, transparent 1px),
                    radial-gradient(rgba(34,197,94,0.12) 1px, transparent 1px);
                background-size: 24px 24px, 24px 24px, 16px 16px;
                background-position: 0 0, 0 0, 6px 6px;
                box-shadow:
                    inset 0 0 24px rgba(34,197,94,0.18),
                    0 0 18px rgba(34,197,94,0.10);
            ">
            </div>

            <!-- ROOM CONTENT -->
            <div class="relative h-[560px] flex items-center justify-center">
                <!-- MINI-PANDAS BACKGROUND -->
                <div id="welcomeMiniPandas"
                     class="absolute inset-0 z-0 overflow-hidden pointer-events-none opacity-80">
                </div>

                <!-- SPEECH PANEL -->
                <div id="speechPanel" class="absolute top-8 left-1/2 -translate-x-[42%] w-[62%] z-20 transition-all duration-300">
                    <div class="relative min-h-[150px]">
                        <!-- outer bubble -->
                        <div
                                class="absolute inset-0 bg-[#b7ffcb] dark:bg-[#b7ffcb]"
                                style="
                                clip-path: polygon(
                                    20px 0,
                                    calc(100% - 20px) 0,
                                    100% 20px,
                                    100% calc(100% - 20px),
                                    calc(100% - 20px) 100%,
                                    20px 100%,
                                    0 calc(100% - 20px),
                                    0 20px
                                );
                                box-shadow: 0 0 16px rgba(34,197,94,0.35);
                            ">
                        </div>

                        <!-- bubble fill -->
                        <div
                                class="absolute inset-[5px] bg-[#020403] dark:bg-[#020403]"
                                style="
                                clip-path: polygon(
                                    18px 0,
                                    calc(100% - 18px) 0,
                                    100% 18px,
                                    100% calc(100% - 18px),
                                    calc(100% - 18px) 100%,
                                    18px 100%,
                                    0 calc(100% - 18px),
                                    0 18px
                                );
                            ">
                        </div>

                        <!-- inner stroke -->
                        <div
                                class="absolute inset-[14px] border border-[#00ff66] dark:border-[#00ff66]"
                                style="
                                clip-path: polygon(
                                    14px 0,
                                    calc(100% - 14px) 0,
                                    100% 14px,
                                    100% calc(100% - 14px),
                                    calc(100% - 14px) 100%,
                                    14px 100%,
                                    0 calc(100% - 14px),
                                    0 14px
                                );
                                box-shadow: inset 0 0 10px rgba(34,197,94,0.18);
                            ">
                        </div>

                        <!-- text -->
                        <div class="relative px-10 py-8 min-h-[150px]">
                            <div id="dialogText" class="text-lg leading-8 whitespace-pre-line pr-2 text-[#86efac]">
                                Hey.
                            </div>
                        </div>
                    </div>

                    <!-- speech tail -->
                    <div id="speechTail" class="absolute left-[72%] -translate-x-1/2 top-full -translate-y-[1px] transition-all duration-300">
                        <!-- tail outer -->
                        <div
                                class="relative w-[40px] h-[34px] bg-[#b7ffcb] dark:bg-[#b7ffcb]"
                                style="
                                clip-path: polygon(
                                    0 0,
                                    100% 0,
                                    100% 55%,
                                    68% 100%,
                                    32% 100%,
                                    0 55%
                                );
                                box-shadow: 0 0 16px rgba(34,197,94,0.35);
                            ">
                            <!-- tail fill -->
                            <div
                                    class="absolute inset-[4px] bg-[#020403] dark:bg-[#020403]"
                                    style="
                                    clip-path: polygon(
                                        0 0,
                                        100% 0,
                                        100% 55%,
                                        68% 100%,
                                        32% 100%,
                                        0 55%
                                    );
                                ">
                            </div>

                            <!-- tail inner stroke -->
                            <div
                                    class="absolute inset-[10px] border border-[#00ff66] dark:border-[#00ff66]"
                                    style="
                                    clip-path: polygon(
                                        0 0,
                                        100% 0,
                                        100% 55%,
                                        68% 100%,
                                        32% 100%,
                                        0 55%
                                    );
                                ">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Troll-CHARACTER PANDA -->
                <div id="welcomePanda" class="absolute left-[120px] top-[180px] z-10 pointer-events-none">
                    <div id="welcomePandaInner" class="transition-all duration-700 ease-in-out flex flex-col items-center">
                        <div class="w-[170px] h-[30px] bg-[#22c55e]/30 rounded-full blur-sm"></div>

                        <svg class="w-[230px] mt-[-10px]" viewBox="0 0 24 24" shape-rendering="crispEdges">
                            <rect x="19" y="4" width="2" height="16" fill="#14532d"/>
                            <rect x="18" y="3" width="4" height="2" fill="#14532d"/>
                            <rect x="18" y="2" width="4" height="1" fill="#166534"/>
                            <rect x="19" y="1" width="2" height="2" class="panda-leaf-fill"/>

                            <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                            <rect x="8" y="4" width="8" height="6" fill="#d9ffe7"/>

                            <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                            <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                            <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                            <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                            <rect x="7" y="13" width="10" height="7" fill="#00ff66"/>

                            <rect x="5" y="14" width="2" height="3" fill="#d9ffe7"/>
                            <rect x="17" y="14" width="2" height="3" fill="#d9ffe7"/>

                            <rect x="8" y="20" width="3" height="2" fill="#d9ffe7"/>
                            <rect x="13" y="20" width="3" height="2" fill="#d9ffe7"/>
                        </svg>
                    </div>
                </div>

                <!-- Raum-CHARACTER -->
                <div class="absolute right-[140px] bottom-[95px] z-10">
                    <img
                            src="/room-characters/Org.png"
                            alt="Raumcharakter Ork"
                            class="w-[150px]"
                            style="image-rendering: pixelated; filter: drop-shadow(0 0 10px rgba(34,197,94,0.45));"
                    >
                </div>

                <!-- SPIELERFIGUR -->
                <div
                        id="playerCharacter"
                        class="absolute left-1/2 -translate-x-1/2 bottom-[-170px] z-10 transition-all duration-[1800ms] ease-linear"
                >
                    <img
                            id="playerAvatar"
                            src="/images/Informatiker.png"
                            alt="Spielerfigur"
                            class="w-[150px]"
                            style="image-rendering: pixelated;"
                    >
                </div>

                <!-- CONTROLS -->
                <div class="absolute bottom-6 left-[calc(50%_-_120px)] z-20 flex gap-4">
                    <button id="dialogNextBtn"
                            class="bg-[#22c55e] text-[#001b08] px-6 py-3 rounded-lg font-black hover:bg-[#16a34a] shadow-[0_0_18px_rgba(34,197,94,0.45)]">
                        Weiter
                    </button>

                    <button id="startQuizBtn"
                            class="hidden bg-[#86efac] text-[#001b08] px-6 py-3 rounded-lg font-black hover:bg-[#4ade80] shadow-[0_0_18px_rgba(134,239,172,0.45)]">
                        Prüfung beginnen
                    </button>
                </div>
            </div>

        </section>

        <!-- CORRIDOR -->
        <div class="absolute left-[calc(50%_-_120px)] top-[calc(100%_-_3rem)] w-28 h-[220px] z-0 pointer-events-none">
            <div class="absolute left-0 top-0 w-[10px] h-full bg-[#22c55e] dark:bg-[#22c55e]"></div>
            <div class="absolute left-[10px] top-0 w-[4px] h-full bg-[#86efac] dark:bg-[#86efac]"></div>
            <div class="absolute left-[14px] top-0 w-[84px] h-full bg-[#000000] dark:bg-[#000000]"></div>
            <div class="absolute left-[98px] top-0 w-[4px] h-full bg-[#86efac] dark:bg-[#86efac]"></div>
            <div class="absolute left-[102px] top-0 w-[10px] h-full bg-[#22c55e] dark:bg-[#22c55e]"></div>
        </div>
    </div>
</main>

<!-- GAME -->
<div id="gameContainer" class="bg-[#020403] dark:bg-[#000000] text-white font-mono tracking-wider hidden min-h-screen">
    <div id="gameScene"
         class="w-[1200px] h-[680px] mx-auto relative bg-[#031108] dark:bg-[#000000] overflow-visible"
         style="
            box-shadow:
                inset 0 0 35px rgba(34,197,94,0.18);
            background-image:
                linear-gradient(rgba(34,197,94,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34,197,94,0.05) 1px, transparent 1px),
                radial-gradient(rgba(34,197,94,0.08) 1px, transparent 1px);
            background-size: 26px 26px, 26px 26px, 16px 16px;
            background-position: 0 0, 0 0, 6px 6px;
         ">

        <!-- MINI-PANDAS BACKGROUND -->
        <div id="gameMiniPandas"
             class="absolute inset-0 z-0 overflow-hidden pointer-events-none opacity-70">
        </div>

        <!-- ROOM CHARACTER -->
        <div id="gameRoomCharacter" class="absolute left-[105px] top-[-5px] z-20 pointer-events-none">
            <img
                    src="/room-characters/Org.png"
                    alt="Raumcharakter Ork"
                    class="w-[110px]"
                    style="image-rendering: pixelated; transform: scaleX(-1); filter: drop-shadow(0 0 10px rgba(34,197,94,0.45));"
            >
        </div>

        <!-- PANDA -->
        <div id="gamePanda" class="absolute left-[80px] top-[-24px] z-50 pointer-events-none">
            <div id="gamePandaInner" class="transition-all duration-700 ease-in-out flex flex-col items-center">
                <div class="w-[130px] h-[22px] bg-[#22c55e]/30 rounded-full blur-sm"></div>

                <svg class="w-[160px] mt-[-8px]" viewBox="0 0 24 24" shape-rendering="crispEdges">
                    <rect x="19" y="4" width="2" height="16" fill="#14532d"/>
                    <rect x="18" y="3" width="4" height="2" fill="#14532d"/>
                    <rect x="18" y="2" width="4" height="1" fill="#166534"/>
                    <rect x="19" y="1" width="2" height="2" class="panda-leaf-fill"/>

                    <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                    <rect x="8" y="4" width="8" height="6" fill="#d9ffe7"/>

                    <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                    <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                    <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                    <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                    <rect x="7" y="13" width="10" height="7" fill="#00ff66"/>

                    <rect x="5" y="14" width="2" height="3" fill="#d9ffe7"/>
                    <rect x="17" y="14" width="2" height="3" fill="#d9ffe7"/>

                    <rect x="8" y="20" width="3" height="2" fill="#d9ffe7"/>
                    <rect x="13" y="20" width="3" height="2" fill="#d9ffe7"/>
                </svg>
            </div>
        </div>

        <!-- QUESTION PANEL -->
        <div th:replace="~{fragments/question-panel :: questionPanel(
            'bg-[#b7ffcb] dark:bg-[#b7ffcb]',
            'bg-[#020403] dark:bg-[#020403]',
            'border-[#00ff66] dark:border-[#00ff66]',
            'bg-[#22c55e] text-[#001b08] px-6 py-3 rounded-lg font-black hover:bg-[#16a34a] shadow-[0_0_18px_rgba(34,197,94,0.45)]',
            'bg-[#86efac] text-[#001b08] px-6 py-3 rounded-lg font-black hover:bg-[#4ade80] shadow-[0_0_18px_rgba(134,239,172,0.45)]'
        )}"></div>

        <!-- STATUS PANEL -->
        <div th:replace="~{fragments/status-panel :: statusPanel(
            'bg-[#b7ffcb] dark:bg-[#b7ffcb]',
            'bg-[#020403] dark:bg-[#020403]',
            'border-[#00ff66] dark:border-[#00ff66]',
            'bg-[#86efac] text-[#052e16] dark:bg-[#86efac] dark:text-[#052e16] font-black text-xs text-center py-3 rounded-xl'
        )}"></div>
    </div>
</div>

<script th:src="@{/js/darkmode.js}"></script>

<!-- Raumlogik für Laden, Interaktion, Antwortprüfung und Raumfortschritt innerhalb von Raum 16. -->
<script th:inline="javascript">
    const roomId = /*[[${roomId}]]*/ 16;
    const maxRoomId = 16;

    const userId = sessionStorage.getItem("userId");
    const runId = sessionStorage.getItem("runId");
    const sessionId = sessionStorage.getItem("sessionId");

    const playerCharacter = document.getElementById("playerCharacter");
    const playerAvatar = document.getElementById("playerAvatar");

    const storedAvatar = sessionStorage.getItem("avatar");

    if (playerAvatar) {
        playerAvatar.src = storedAvatar
            ? `/images/${storedAvatar}`
            : "/images/Informatiker.png";
    }

    if (!userId) {
        alert("Kein eingeloggter User gefunden.");
        window.location.href = "/";
        throw new Error("Kein eingeloggter User gefunden.");
    }

    if (!sessionId || !runId) {
        alert("Kein aktiver Spielstand geladen.");
        window.location.href = "/dashboard";
        throw new Error("Kein aktiver Spielstand geladen.");
    }

    let currentQuestion = null;
    let selectedAnswerIds = [];
    let selectedGapAnswers = [];
    let selectedGapAnswersMap = {};
    let isSubmittingAnswer = false;
    let currentGapStep = 0;
    let roomLoaded = false;

    const welcomePanda = document.getElementById("welcomePanda");
    const welcomePandaInner = document.getElementById("welcomePandaInner");
    const gamePandaInner = document.getElementById("gamePandaInner");

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randomFloat(min, max) {
        return Math.random() * (max - min) + min;
    }

    function getMiniPandaSvgMarkup() {
        return `
        <div class="flex flex-col items-center">
            <div class="w-[110px] h-[18px] bg-[#22c55e]/20 rounded-full blur-sm"></div>

            <svg class="w-[160px] mt-[-8px]" viewBox="0 0 24 24" shape-rendering="crispEdges">
                <rect x="19" y="4" width="2" height="16" fill="#14532d"/>
                <rect x="18" y="3" width="4" height="2" fill="#14532d"/>
                <rect x="18" y="2" width="4" height="1" fill="#166534"/>
                <rect x="19" y="1" width="2" height="2" class="panda-leaf-fill"/>

                <rect x="7" y="3" width="10" height="8" fill="#050a14"/>
                <rect x="8" y="4" width="8" height="6" fill="#d9ffe7"/>

                <rect x="10" y="6" width="2" height="2" fill="#050a14"/>
                <rect x="14" y="6" width="2" height="2" fill="#050a14"/>

                <rect x="12" y="8" width="1" height="1" fill="#050a14"/>

                <rect x="6" y="12" width="12" height="9" fill="#050a14"/>
                <rect x="7" y="13" width="10" height="7" fill="#00ff66"/>

                <rect x="5" y="14" width="2" height="3" fill="#d9ffe7"/>
                <rect x="17" y="14" width="2" height="3" fill="#d9ffe7"/>

                <rect x="8" y="20" width="3" height="2" fill="#d9ffe7"/>
                <rect x="13" y="20" width="3" height="2" fill="#d9ffe7"/>
            </svg>
        </div>
    `;
    }

    function startFallingPanda(element, config = {}) {
        if (!element) {
            return;
        }

        const {
            maxX = 420,
            startYMin = -320,
            startYMax = -180,
            endY = 720,
            durationMin = 5000,
            durationMax = 8000,
            tiltMin = -8,
            tiltMax = 8,
            delayMin = 0,
            delayMax = 0
        } = config;

        const fall = () => {
            const x = randomInt(0, maxX);
            const startY = randomInt(startYMin, startYMax);
            const finishY = endY;
            const startTilt = randomInt(-4, 4);
            const endTilt = randomInt(tiltMin, tiltMax);
            const duration = randomInt(durationMin, durationMax);

            element.getAnimations().forEach(animation => animation.cancel());

            const animation = element.animate([
                { transform: `translate(${x}px, ${startY}px) rotate(${startTilt}deg)` },
                { transform: `translate(${x}px, ${finishY}px) rotate(${endTilt}deg)` }
            ], {
                duration,
                easing: "linear",
                fill: "forwards"
            });

            animation.onfinish = () => {
                const nextDelay = randomInt(delayMin, delayMax);
                setTimeout(fall, nextDelay);
            };
        };

        fall();
    }

    function spawnMiniPandas(container, options = {}) {
        if (!container) {
            return;
        }

        const count = randomInt(options.minCount ?? 3, options.maxCount ?? 7);

        for (let i = 0; i < count; i++) {
            const panda = document.createElement("div");
            const scale = randomFloat(options.minScale ?? 0.24, options.maxScale ?? 0.5);

            panda.className = "absolute left-0 top-0 z-0 pointer-events-none";
            panda.style.opacity = String(randomFloat(0.18, 0.45));
            panda.style.transformOrigin = "top left";
            panda.innerHTML = `
            <div style="transform: scale(${scale}); transform-origin: top left;">
                ${getMiniPandaSvgMarkup()}
            </div>
        `;

            container.appendChild(panda);

            setTimeout(() => {
                startFallingPanda(panda, {
                    maxX: options.maxX ?? 920,
                    startYMin: options.startYMin ?? -420,
                    startYMax: options.startYMax ?? -180,
                    endY: options.endY ?? 760,
                    durationMin: options.durationMin ?? 9000,
                    durationMax: options.durationMax ?? 14000,
                    tiltMin: -6,
                    tiltMax: 6,
                    delayMin: 0,
                    delayMax: 0
                });
            }, randomInt(0, 2500));
        }
    }

    function initRandomPandas() {
        startFallingPanda(welcomePandaInner, {
            maxX: 420,
            startYMin: -300,
            startYMax: -180,
            endY: 500,
            durationMin: 7000,
            durationMax: 10500,
            tiltMin: -8,
            tiltMax: 8,
            delayMin: 0,
            delayMax: 0
        });

        startFallingPanda(gamePandaInner, {
            maxX: 860,
            startYMin: -320,
            startYMax: -200,
            endY: 760,
            durationMin: 6500,
            durationMax: 9800,
            tiltMin: -8,
            tiltMax: 8,
            delayMin: 0,
            delayMax: 0
        });

        spawnMiniPandas(document.getElementById("welcomeMiniPandas"), {
            minCount: 3,
            maxCount: 7,
            maxX: 820,
            startYMin: -420,
            startYMax: -180,
            endY: 760,
            durationMin: 10000,
            durationMax: 15000,
            minScale: 0.22,
            maxScale: 0.48
        });

        spawnMiniPandas(document.getElementById("gameMiniPandas"), {
            minCount: 3,
            maxCount: 7,
            maxX: 980,
            startYMin: -450,
            startYMax: -180,
            endY: 860,
            durationMin: 9500,
            durationMax: 14500,
            minScale: 0.2,
            maxScale: 0.44
        });
    }

    const welcomeContainer = document.getElementById("welcomeContainer");
    const gameContainer = document.getElementById("gameContainer");

    const gameScene = document.getElementById("gameScene");
    const gameRoomCharacter = document.getElementById("gameRoomCharacter");
    const gamePanda = document.getElementById("gamePanda");
    const questionPanel = document.getElementById("questionPanel");
    const statusPanel = document.getElementById("statusPanel");

    const dialogText = document.getElementById("dialogText");
    const dialogNextBtn = document.getElementById("dialogNextBtn");
    const startQuizBtn = document.getElementById("startQuizBtn");
    const speechTail = document.getElementById("speechTail");
    const speechPanel = document.getElementById("speechPanel");

    const questionText = document.getElementById("questionText");
    const answerContainer = document.getElementById("answerContainer");
    const feedbackBox = document.getElementById("feedbackBox");
    const submitAnswerBtn = document.getElementById("submitAnswerBtn");
    const nextQuestionBtn = document.getElementById("nextQuestionBtn");

    let introDialog = [];

    let dialogIndex = 0;

    async function ensureFinalRoomUnlocked() {
        try {
            const response = await fetch(`/api/session/${sessionId}/overview`);

            if (!response.ok) {
                alert("Abschlussstatus konnte nicht geprüft werden.");
                window.location.href = "/dashboard";
                return false;
            }

            const overview = await response.json();
            const rooms = Array.isArray(overview.rooms) ? overview.rooms : [];

            const quizRooms = rooms.filter(room => Number(room.roomId) >= 1 && Number(room.roomId) <= 15);

            const allQuizRoomsCompleted =
                quizRooms.length === 15 &&
                quizRooms.every(room =>
                    Number(room.totalQuestions ?? 0) > 0 &&
                    Number(room.answeredQuestions ?? 0) >= Number(room.totalQuestions ?? 0)
                );

            if (!allQuizRoomsCompleted) {
                alert("Du musst zuerst alle Räume 1 bis 15 abschließen.");
                window.location.href = "/dashboard";
                return false;
            }

            return true;
        } catch (error) {
            console.error("Fehler beim Prüfen des Abschlussstatus:", error);
            alert("Abschlussstatus konnte nicht geprüft werden.");
            window.location.href = "/dashboard";
            return false;
        }
    }

    function nextDialogLine() {
        if (!introDialog || dialogIndex >= introDialog.length - 1) {
            return;
        }

        dialogIndex++;
        showCurrentDialogLine();
    }

    function startQuiz() {
        window.location.href = "/endscreen";
    }

    async function initWelcomeRoom() {
        const unlocked = await ensureFinalRoomUnlocked();
        if (!unlocked) {
            return;
        }

        introDialog = [
            {
                speaker: "room",
                text: "Du hast es tatsächlich bis hierhin geschafft."
            },
            {
                speaker: "player",
                text: "Dann ist das hier also der letzte Raum?"
            },
            {
                speaker: "room",
                text: "Kein weiterer Test. Kein weiteres Quiz. Nur noch ein letzter Blick zurück."
            },
            {
                speaker: "room",
                text: "Du hast alle fünfzehn Prüfungsräume abgeschlossen."
            },
            {
                speaker: "room",
                text: "Geh weiter. Dein Endscreen wartet schon."
            }
        ];

        dialogIndex = 0;
        currentQuestion = null;
        roomLoaded = true;

        if (submitAnswerBtn) {
            submitAnswerBtn.classList.add("hidden");
        }

        if (nextQuestionBtn) {
            nextQuestionBtn.classList.add("hidden");
        }

        if (startQuizBtn) {
            startQuizBtn.innerText = "Zum Endscreen";
            startQuizBtn.classList.add("hidden");
        }

        showCurrentDialogLine();
    }

    function showCurrentDialogLine() {
        if (!introDialog || introDialog.length === 0) {
            dialogText.innerText = "...";
            dialogNextBtn.classList.add("hidden");
            startQuizBtn.classList.remove("hidden");
            updateSpeechTailPosition("room");
            return;
        }

        const line = introDialog[dialogIndex];
        const speakerLabel = line.speaker === "player" ? "Du" : "Org";

        updateSpeechTailPosition(line.speaker);
        dialogText.innerText = `${speakerLabel}: ${line.text}`;

        if (dialogIndex >= introDialog.length - 1) {
            dialogNextBtn.classList.add("hidden");
            startQuizBtn.classList.remove("hidden");
        } else {
            dialogNextBtn.classList.remove("hidden");
            startQuizBtn.classList.add("hidden");
        }
    }

    function renderQuestion(question) {
        selectedAnswerIds = [];
        selectedGapAnswers = [];
        selectedGapAnswersMap = {};
        currentGapStep = 0;
        isSubmittingAnswer = false;
        clearRoomFeedbackBox(feedbackBox);

        if (!gameContainer.classList.contains("hidden")) {
            hidePandaGameComment();
        }

        submitAnswerBtn.disabled = false;
        submitAnswerBtn.classList.remove("opacity-70", "cursor-not-allowed");
        submitAnswerBtn.classList.add("hidden");
        nextQuestionBtn.classList.add("hidden");

        if (!question) {
            questionText.innerText = "Keine weitere Frage vorhanden.";
            answerContainer.innerHTML = "";
            return;
        }

        answerContainer.innerHTML = "";
        applyQuestionLayout(question);

        if (isGapQuestion(question)) {
            questionText.className = "text-center px-2 min-h-0 overflow-hidden text-[clamp(9px,0.9vw,14px)] leading-[1.1] text-[#86efac]";
            renderGapQuestionText(question);
            renderGapQuestion(question);

            requestAnimationFrame(() => {
                fitGapQuestionText();
                fitGapOptionTexts();
            });

            return;
        }

        renderStandardQuestionText(
            question,
            "text-center px-6 shrink-0 min-h-[72px] max-h-[250px] overflow-hidden leading-[1.08] text-[clamp(10px,1.15vw,18px)] text-[#86efac]"
        );

        if (!question.answerOptions || question.answerOptions.length === 0) {
            answerContainer.innerHTML = `
                <div class="col-span-2 text-center text-red-300">
                    Dieser Fragetyp wird hier noch nicht unterstützt.
                </div>
            `;
            return;
        }

        const optionCount = question.answerOptions.length;
        const rows = Math.ceil(optionCount / 2);

        answerContainer.className = rows >= 3
            ? "grid grid-cols-2 gap-3 flex-1 min-h-0 content-stretch"
            : "grid grid-cols-2 gap-4 flex-1 min-h-0 content-stretch";

        answerContainer.style.gridAutoRows = "1fr";

        question.answerOptions.forEach((option, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.dataset.answerId = option.answerId;
            button.dataset.fullText = option.optionText;

            button.className = `
                quiz-answer-btn
                relative w-full h-full
                border-4 border-[#86efac]
                px-6 py-4
                font-black text-[#86efac] text-left
                bg-[#020403]
                dark:border-[#86efac]
                dark:text-[#86efac]
                dark:bg-[#020403]
                flex items-center
            `;

            if (rows >= 4) {
    button.style.minHeight = "72px";
} else if (rows === 3) {
    button.style.minHeight = "92px";
} else if (rows === 2) {
    button.style.minHeight = "120px";
} else {
    button.style.minHeight = "150px";
}
            button.style.boxShadow = "0 0 14px rgba(34,197,94,0.14)";

            const label = document.createElement("div");
            label.className = "answer-label w-full leading-[1.35]";
            label.innerText = buildAnswerPreviewText(index, option.optionText);

            button.appendChild(label);

            button.addEventListener("click", () => {
                toggleAnswer(option.answerId, button, question.allowsMultiple);
            });

            answerContainer.appendChild(button);
        });

        requestAnimationFrame(() => {
            fitQuestionText();
            fitAnswerTexts();
        });
    }

    function renderGapQuestionText(question) {
        questionText.innerHTML = "";

        const gapFields = [...(question.gapFields || [])].sort((a, b) => a.gapIndex - b.gapIndex);

        const textFlow = document.createElement("div");
        textFlow.className = "flex flex-wrap items-center justify-center gap-x-2 gap-y-2 leading-[1.1] text-inherit";

        if (question.startText) {
            const startSpan = document.createElement("span");
            startSpan.textContent = question.startText;
            textFlow.appendChild(startSpan);
        }

        gapFields.forEach((gapField, gapIndex) => {
            const before = gapField.textBefore || "";
            const after = gapField.textAfter || "";

            if (before) {
                const beforeSpan = document.createElement("span");
                beforeSpan.textContent = before;
                textFlow.appendChild(beforeSpan);
            }

            const preview = document.createElement("button");
            preview.type = "button";
            preview.id = `gapPreview-${gapField.gapId}`;
            preview.dataset.gapId = gapField.gapId;
            preview.dataset.gapStep = gapIndex;
            preview.className = `
                relative inline-flex items-center justify-center
                min-w-[88px] max-w-full
                px-2.5 py-1
                border-2 border-dashed border-[#22c55e]
                text-center font-black text-[#86efac]
                bg-[#020403]
                dark:border-[#22c55e]
                dark:text-[#86efac]
                dark:bg-[#020403]
                transition
            `;
            preview.textContent = `[ Lücke ${gapIndex + 1} ]`;

            preview.addEventListener("click", () => {
                setActiveGapStep(gapIndex);
            });

            textFlow.appendChild(preview);

            if (after) {
                const afterSpan = document.createElement("span");
                afterSpan.textContent = after;
                textFlow.appendChild(afterSpan);
            }
        });

        if (question.endText) {
            const endSpan = document.createElement("span");
            endSpan.textContent = question.endText;
            textFlow.appendChild(endSpan);
        }

        questionText.appendChild(textFlow);
    }

    function renderGapQuestion(question) {
        answerContainer.className = "flex flex-col gap-2 min-h-0";

        if (!question.gapFields || question.gapFields.length === 0) {
            answerContainer.innerHTML = `
                <div class="text-center text-red-300">
                    GAP-Frage enthält keine Lückenfelder.
                </div>
            `;
            return;
        }

        const gapFields = [...question.gapFields].sort((a, b) => a.gapIndex - b.gapIndex);

        const currentGapLabel = document.createElement("div");
        currentGapLabel.id = "gapCurrentLabel";
        currentGapLabel.className = "text-xs text-[#86efac] font-black tracking-wide shrink-0";
        answerContainer.appendChild(currentGapLabel);

        gapFields.forEach((gapField, gapIndex) => {
            const block = document.createElement("div");
            block.className = "hidden";
            block.dataset.gapOptionsStep = gapIndex;

            const options = [...(gapField.gapOptions || [])].sort((a, b) => a.optionOrder - b.optionOrder);
            const optionCount = options.length;

            let columnCount = 2;
            if (optionCount >= 7) {
                columnCount = 3;
            }

            const rowCount = Math.max(1, Math.ceil(optionCount / columnCount));

            let minHeight = 68;
            if (rowCount >= 4) {
                minHeight = 38;
            } else if (rowCount === 3) {
                minHeight = 46;
            } else if (rowCount === 2) {
                minHeight = 56;
            }

            const optionsWrap = document.createElement("div");
            optionsWrap.className = `grid ${columnCount === 3 ? "grid-cols-3" : "grid-cols-2"} gap-2`;
            optionsWrap.style.gridTemplateRows = `repeat(${rowCount}, minmax(0, 1fr))`;

            options.forEach((option, optionIndex) => {
                const button = document.createElement("button");
                button.type = "button";
                button.dataset.gapId = gapField.gapId;
                button.dataset.gapOptionId = option.gapOptionId;
                button.dataset.optionText = option.optionText;
                button.className = `
                    gap-option-btn
                    relative w-full
                    border-4 border-[#86efac]
                    px-3 py-2
                    font-black text-[#86efac] text-left
                    bg-[#020403]
                    dark:border-[#86efac]
                    dark:text-[#86efac]
                    dark:bg-[#020403]
                    flex items-center
                `;
                button.style.minHeight = `${minHeight}px`;
                button.style.boxShadow = "0 0 14px rgba(34,197,94,0.14)";

                const label = document.createElement("div");
                label.className = "gap-option-label w-full leading-[1.15]";
                label.innerText = `${String.fromCharCode(65 + optionIndex)}) ${option.optionText}`;

                button.appendChild(label);

                button.addEventListener("click", () => {
                    selectGapOption(gapField.gapId, option.gapOptionId, button);
                });

                optionsWrap.appendChild(button);
            });

            block.appendChild(optionsWrap);
            answerContainer.appendChild(block);
        });

        const navWrap = document.createElement("div");
        navWrap.className = "mt-2 flex justify-between gap-3 shrink-0";

        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "gapPrevBtn";
        prevBtn.className = "bg-[#166534] text-[#d9ffe7] px-5 py-2.5 rounded-lg font-black hover:bg-[#15803d] shadow-[0_0_18px_rgba(34,197,94,0.35)]";
        prevBtn.innerText = "Zurück";

        prevBtn.addEventListener("click", () => {
            setActiveGapStep(currentGapStep - 1);
        });

        const stepBtn = document.createElement("button");
        stepBtn.type = "button";
        stepBtn.id = "gapStepBtn";
        stepBtn.className = "bg-[#22c55e] text-[#001b08] px-5 py-2.5 rounded-lg font-black hover:bg-[#16a34a] shadow-[0_0_18px_rgba(34,197,94,0.45)]";
        stepBtn.innerText = "Weiter";

        stepBtn.addEventListener("click", () => {
            if (!currentQuestion || !currentQuestion.gapFields) {
                return;
            }

            const sortedGapFields = [...currentQuestion.gapFields].sort((a, b) => a.gapIndex - b.gapIndex);

            if (currentGapStep >= sortedGapFields.length - 1) {
                submitAnswer();
            } else {
                setActiveGapStep(currentGapStep + 1);
            }
        });

        navWrap.appendChild(prevBtn);
        navWrap.appendChild(stepBtn);
        answerContainer.appendChild(navWrap);

        requestAnimationFrame(() => {
            setActiveGapStep(0);
            fitGapOptionTexts();
        });
    }

    function selectGapOption(gapId, gapOptionId, buttonElement) {
        selectedGapAnswersMap[gapId] = gapOptionId;

        selectedGapAnswers = Object.entries(selectedGapAnswersMap).map(([gapIdKey, gapOptionIdValue]) => ({
            gapId: Number(gapIdKey),
            selectedGapOptionId: Number(gapOptionIdValue)
        }));

        document.querySelectorAll(`[data-gap-id="${gapId}"][data-gap-option-id]`).forEach(btn => {
            btn.classList.remove("bg-yellow-400", "text-black", "ring-4", "ring-white/30");
        });

        buttonElement.classList.add("bg-yellow-400", "text-black", "ring-4", "ring-white/30");

        const preview = document.getElementById(`gapPreview-${gapId}`);
        if (preview) {
            const cleanedText = buttonElement.dataset.optionText || buttonElement.innerText.replace(/^[A-Z]\)\s*/, "");
            preview.innerText = cleanedText;
        }

        updateGapStepUI();
    }

    function setActiveGapStep(stepIndex) {
        if (!currentQuestion || !currentQuestion.gapFields || currentQuestion.gapFields.length === 0) {
            return;
        }

        const maxStep = currentQuestion.gapFields.length - 1;
        currentGapStep = Math.max(0, Math.min(stepIndex, maxStep));

        updateGapStepUI();
    }

    function updateGapStepUI() {
        if (!currentQuestion || !currentQuestion.gapFields || currentQuestion.gapFields.length === 0) {
            return;
        }

        const gapFields = [...currentQuestion.gapFields].sort((a, b) => a.gapIndex - b.gapIndex);
        const currentGap = gapFields[currentGapStep];

        document.querySelectorAll("[data-gap-options-step]").forEach(block => {
            const blockStep = Number(block.dataset.gapOptionsStep);
            block.classList.toggle("hidden", blockStep !== currentGapStep);
        });

        document.querySelectorAll("[data-gap-step]").forEach(preview => {
            const previewStep = Number(preview.dataset.gapStep);
            const gapId = Number(preview.dataset.gapId);
            const hasAnswer = selectedGapAnswersMap[gapId] !== undefined;

            preview.classList.remove(
                "border-dashed",
                "border-white/40",
                "dark:border-white/40",
                "border-[#22c55e]",
                "border-[#86efac]",
                "dark:border-[#86efac]",
                "text-[#86efac]",
                "dark:text-[#86efac]",
                "text-white",
                "bg-[#020403]",
                "bg-[#16a34a]/20",
                "bg-[#22c55e]/20",
                "dark:bg-[#020403]",
                "ring-2",
                "ring-white/40"
            );

            if (hasAnswer) {
                preview.classList.add(
                    "border-[#86efac]",
                    "text-white",
                    "bg-[#16a34a]/20",
                    "dark:border-[#86efac]",
                    "dark:text-white",
                    "dark:bg-[#16a34a]/20"
                );
            } else {
                preview.classList.add(
                    "border-dashed",
                    "border-[#22c55e]",
                    "text-[#86efac]",
                    "bg-[#020403]",
                    "dark:border-[#22c55e]",
                    "dark:text-[#86efac]",
                    "dark:bg-[#020403]"
                );
            }

            if (previewStep === currentGapStep) {
                preview.classList.add(
                    "bg-[#22c55e]/20",
                    "ring-2",
                    "ring-white/40"
                );
            }
        });

        const currentGapLabel = document.getElementById("gapCurrentLabel");
        if (currentGapLabel) {
            const selectedCount = selectedGapAnswers.length;
            const totalCount = gapFields.length;
            currentGapLabel.innerText = `LÜCKE ${currentGapStep + 1} VON ${totalCount}  •  AUSGEWÄHLT: ${selectedCount}/${totalCount}`;
        }

        const prevBtn = document.getElementById("gapPrevBtn");
        if (prevBtn) {
            prevBtn.disabled = currentGapStep === 0;
            prevBtn.classList.toggle("opacity-50", currentGapStep === 0);
            prevBtn.classList.toggle("cursor-not-allowed", currentGapStep === 0);
        }

        const stepBtn = document.getElementById("gapStepBtn");
        if (stepBtn) {
            const hasSelectionForCurrentGap = selectedGapAnswersMap[currentGap.gapId] !== undefined;
            const isLastGap = currentGapStep === gapFields.length - 1;

            stepBtn.disabled = !hasSelectionForCurrentGap;
            stepBtn.classList.toggle("opacity-50", !hasSelectionForCurrentGap);
            stepBtn.classList.toggle("cursor-not-allowed", !hasSelectionForCurrentGap);

            if (isLastGap) {
                stepBtn.innerText = "Antwort prüfen";
                stepBtn.classList.remove("bg-[#22c55e]", "hover:bg-[#16a34a]");
                stepBtn.classList.add("bg-[#86efac]", "hover:bg-[#4ade80]");
            } else {
                stepBtn.innerText = "Weiter";
                stepBtn.classList.remove("bg-[#86efac]", "hover:bg-[#4ade80]");
                stepBtn.classList.add("bg-[#22c55e]", "hover:bg-[#16a34a]");
            }
        }

        requestAnimationFrame(() => {
            fitGapOptionTexts();
        });
    }

    function toggleAnswer(answerId, buttonElement, allowsMultiple) {
        const selectedClasses = ["bg-yellow-400", "text-black", "ring-4", "ring-white/30"];

        if (!allowsMultiple) {
            selectedAnswerIds = [answerId];

            document.querySelectorAll("#answerContainer button").forEach(btn => {
                btn.classList.remove(...selectedClasses);
            });

            buttonElement.classList.add(...selectedClasses);
        } else {
            if (selectedAnswerIds.includes(answerId)) {
                selectedAnswerIds = selectedAnswerIds.filter(id => id !== answerId);
                buttonElement.classList.remove(...selectedClasses);
            } else {
                selectedAnswerIds.push(answerId);
                buttonElement.classList.add(...selectedClasses);
            }
        }

        if (selectedAnswerIds.length > 0) {
            submitAnswerBtn.classList.remove("hidden");
        } else {
            submitAnswerBtn.classList.add("hidden");
        }
    }

    async function submitAnswer() {
        const gapQuestion = isGapQuestion(currentQuestion);

        if (!currentQuestion) {
            return;
        }

        if (isSubmittingAnswer) {
            return;
        }

        if (!gapQuestion && selectedAnswerIds.length === 0) {
            return;
        }

        if (gapQuestion) {
            const requiredGapCount = currentQuestion?.gapFields?.length || 0;
            const selectedGapCount = selectedGapAnswers.length;

            if (selectedGapCount !== requiredGapCount) {
                return;
            }
        }

        isSubmittingAnswer = true;
        submitAnswerBtn.disabled = true;
        submitAnswerBtn.classList.add("opacity-70", "cursor-not-allowed");

        try {
            const requestBody = {
                questionId: currentQuestion.questionId,
                selectedAnswerIds: gapQuestion ? [] : selectedAnswerIds,
                gapAnswers: gapQuestion ? selectedGapAnswers : []
            };

            const response = await fetch(`/api/session/${sessionId}/room/${roomId}/answer`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (!response.ok) {
                isSubmittingAnswer = false;
                submitAnswerBtn.disabled = false;
                submitAnswerBtn.classList.remove("opacity-70", "cursor-not-allowed");
                alert(data.message || "Antwort konnte nicht geprüft werden.");
                return;
            }

            if (!gapQuestion) {
                document.querySelectorAll("#answerContainer button").forEach(btn => {
                    btn.disabled = true;
                    const answerId = Number(btn.dataset.answerId);

                    if (data.correctAnswerIds && data.correctAnswerIds.includes(answerId)) {
                        btn.classList.remove("border-yellow-400", "text-yellow-400");
                        btn.classList.add("border-emerald-500", "text-emerald-400");
                    } else if (selectedAnswerIds.includes(answerId)) {
                        btn.classList.remove("border-yellow-400", "text-yellow-400", "bg-yellow-400", "text-black");
                        btn.classList.add("border-red-500", "text-red-400");
                    }
                });
            } else {
                document.querySelectorAll("#answerContainer button").forEach(btn => {
                    btn.disabled = true;
                    btn.classList.add("opacity-70", "cursor-not-allowed");
                });

                if (data.gapResults && Array.isArray(data.gapResults)) {
                    data.gapResults.forEach(entry => {
                        const preview = document.getElementById(`gapPreview-${entry.gapId}`);
                        const gapButtons = document.querySelectorAll(`[data-gap-id="${entry.gapId}"][data-gap-option-id]`);

                        if (entry.correct) {
                            if (preview) {
                                preview.classList.remove("border-yellow-400", "text-white", "bg-yellow-400/10");
                                preview.classList.add("border-emerald-500", "text-emerald-300", "bg-emerald-500/10");
                            }
                        } else {
                            if (preview) {
                                preview.classList.remove("border-yellow-400", "text-white", "bg-yellow-400/10");
                                preview.classList.add("border-red-500", "text-red-300", "bg-red-500/10");
                                preview.innerText = `${preview.innerText} → richtig: ${entry.correctOptionText}`;
                            }
                        }

                        gapButtons.forEach(btn => {
                            const btnOptionId = Number(btn.dataset.gapOptionId);

                            if (btnOptionId === entry.correctGapOptionId) {
                                btn.classList.remove("border-yellow-400", "text-yellow-400");
                                btn.classList.add("border-emerald-500", "text-emerald-400");
                            } else if (btn.classList.contains("bg-yellow-400")) {
                                btn.classList.remove("border-yellow-400", "text-yellow-400", "bg-yellow-400", "text-black");
                                btn.classList.add("border-red-500", "text-red-400");
                            }
                        });
                    });
                }
            }

            const pandaWrongComment = data.correct ? "" : getRoomWrongFeedbackLine(roomId);

            showRoomFeedbackBox(
                feedbackBox,
                data.correct
                    ? `Richtig! +${data.pointsEarned} Punkt(e)`
                    : buildRoomWrongFeedbackText(roomId, data.pointsEarned),
                data.correct ? "success" : "error"
            );

            if (data.correct) {
                hidePandaGameComment();
            } else {
                showPandaGameComment(pandaWrongComment);
            }

            submitAnswerBtn.classList.add("hidden");
            nextQuestionBtn.classList.remove("hidden");

            await refreshRoomStatus();
        } catch (error) {
            isSubmittingAnswer = false;
            submitAnswerBtn.disabled = false;
            submitAnswerBtn.classList.remove("opacity-70", "cursor-not-allowed");
            console.error("Fehler beim Prüfen der Antwort:", error);
            alert("Antwort konnte nicht geprüft werden.");
        }
    }

    async function loadNextQuestion() {
        if (!currentQuestion) {
            const nextRoomId = roomId + 1;

            if (nextRoomId <= maxRoomId) {
                window.location.href = `/room/${nextRoomId}`;
            } else {
                window.location.href = "/dashboard";
            }
            return;
        }

        try {
            const response = await fetch(`/api/session/${sessionId}/room/${roomId}/advance`, {
                method: "POST"
            });

            if (!response.ok) {
                let errorMessage = "Nächste Frage konnte nicht geladen werden.";
                try {
                    const errorData = await response.json();
                    errorMessage = errorData.message || errorMessage;
                } catch (_) {
                }

                alert(errorMessage);
                return;
            }

            const responseText = await response.text();
            const nextQuestion = responseText ? JSON.parse(responseText) : null;

            if (!nextQuestion) {
                await refreshRoomStatus();
                showRoomCompletedState();
                return;
            }

            currentQuestion = nextQuestion;
            nextQuestionBtn.innerText = "Nächste Frage";
            renderQuestion(currentQuestion);
            await refreshRoomStatus();
        } catch (error) {
            console.error("Fehler beim Laden der nächsten Frage:", error);
            alert("Nächste Frage konnte nicht geladen werden.");
        }
    }

    function showRoomCompletedState() {
        currentQuestion = null;
        applyQuestionLayout(null);
        questionText.innerText = "Raum abgeschlossen.";
        answerContainer.innerHTML = "";

        showRoomFeedbackBox(
            feedbackBox,
            "Du hast alle Fragen dieses Raums beantwortet.",
            "success"
        );

        submitAnswerBtn.classList.add("hidden");

        const nextRoomId = roomId + 1;

        if (nextRoomId <= maxRoomId) {
            nextQuestionBtn.innerText = `Zu Raum ${nextRoomId}`;
            nextQuestionBtn.classList.remove("hidden");
        } else {
            nextQuestionBtn.innerText = "Zurück zum Dashboard";
            nextQuestionBtn.classList.remove("hidden");
        }
    }

    window.addEventListener("resize", () => {
        applyQuestionLayout(currentQuestion);
        fitAnswerTexts();
        fitGapOptionTexts();
        fitGapQuestionText();
    });

    dialogNextBtn.addEventListener("click", nextDialogLine);
    startQuizBtn.addEventListener("click", startQuiz);
    submitAnswerBtn.addEventListener("click", submitAnswer);
    nextQuestionBtn.addEventListener("click", loadNextQuestion);

    updateHeadlineOverview();
    initRandomPandas();
    initWelcomeRoom();
</script>
</body>
</html>
