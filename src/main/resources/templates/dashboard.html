<!doctype html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::body}, 'min-h-screen bg-[linear-gradient(135deg,_#60a5fa_0%,_#a78bfa_35%,_#f87171_70%,_#f472b6_100%)] text-slate-950 dark:bg-none dark:bg-slate-950 dark:text-slate-100')}">
<body class="min-h-screen text-slate-950 dark:text-slate-100">

<div th:replace="~{fragments/headline :: headline(${username}, ${answeredQuestions}, ${totalQuestions}, ${avatarUrl})}"></div>

<div id="roomsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 px-64 pt-6 pb-10"></div>

<script th:src="@{/js/darkmode.js}"></script>
<script>
    let currentDashboardOverview = null;

    async function fetchDashboardOverview() {
        const userId = sessionStorage.getItem("userId");

        if (!userId) {
            window.location.href = "/";
            return null;
        }

        const response = await fetch(`/api/session/dashboard?userId=${userId}`);
        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Dashboard konnte nicht geladen werden.");
            window.location.href = "/";
            return null;
        }

        currentDashboardOverview = data;
        return data;
    }

    async function ensureSessionForRoom() {
        const userId = sessionStorage.getItem("userId");

        if (!userId) {
            window.location.href = "/";
            return null;
        }

        const desiredRunId = currentDashboardOverview?.runId ?? null;
        const storedSessionId = sessionStorage.getItem("sessionId");
        const storedRunId = sessionStorage.getItem("runId");

        if (storedSessionId && storedRunId && desiredRunId && storedRunId === String(desiredRunId)) {
            const probeResponse = await fetch(`/api/session/${storedSessionId}/overview`);

            if (probeResponse.ok) {
                return {
                    sessionId: storedSessionId,
                    runId: storedRunId
                };
            }
        }

        sessionStorage.removeItem("sessionId");
        sessionStorage.removeItem("runId");

        let response;
        if (desiredRunId) {
            response = await fetch(`/api/session/load?userId=${userId}&runId=${desiredRunId}`, {
                method: "POST"
            });
        } else {
            response = await fetch(`/api/session/new?userId=${userId}`, {
                method: "POST"
            });
        }

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Session konnte nicht geladen werden.");
            return null;
        }

        sessionStorage.setItem("userId", String(userId));
        sessionStorage.setItem("sessionId", data.sessionId);
        sessionStorage.setItem("runId", String(data.runId));

        return {
            sessionId: data.sessionId,
            runId: String(data.runId)
        };
    }

    function updateHeadline(data) {
        const usernameElement = document.getElementById("headlineUsername");
        const answeredElement = document.getElementById("headlineAnsweredQuestions");
        const totalElement = document.getElementById("headlineTotalQuestions");
        const avatarElement = document.getElementById("headlineAvatar");

        const rooms = Array.isArray(data.rooms) ? data.rooms : [];

        const totalAnsweredQuestions = rooms.reduce((sum, room) => {
            return sum + Number(room.answeredQuestions ?? 0);
        }, 0);

        const totalQuestions = rooms.reduce((sum, room) => {
            return sum + Number(room.totalQuestions ?? 0);
        }, 0);

        if (usernameElement) {
            usernameElement.textContent =
                data.username ??
                sessionStorage.getItem("username") ??
                "NutzerName";
        }

        if (answeredElement) {
            answeredElement.textContent = totalAnsweredQuestions;
        }

        if (totalElement) {
            totalElement.textContent = totalQuestions;
        }

        if (avatarElement) {
            const avatarFromStorage = sessionStorage.getItem("avatar");
            if (avatarFromStorage) {
                avatarElement.src = `/images/${avatarFromStorage}`;
            }
        }
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
    }

    function renderRooms(rooms) {
        const roomsGrid = document.getElementById("roomsGrid");

        if (!roomsGrid) {
            return;
        }

        if (!Array.isArray(rooms) || rooms.length === 0) {
            roomsGrid.innerHTML = `
                <section class="col-span-full rounded-2xl bg-yellow-400 dark:bg-slate-900/60 p-6 ring-2 ring-violet-400 dark:ring-white/10 text-center text-slate-950 dark:text-slate-100 shadow-sm dark:shadow-none">
                    <p>Es wurden keine Raumdaten gefunden.</p>
                </section>
            `;
            return;
        }

        roomsGrid.innerHTML = rooms
            .slice()
            .sort((a, b) => Number(a.roomId) - Number(b.roomId))
            .map((room, index) => {
                const roomId = Number(room.roomId ?? 0);
                const themeName = escapeHtml(room.themeName ?? `Thema ${roomId}`);
                const answeredQuestions = Number(room.answeredQuestions ?? 0);
                const totalQuestions = Number(room.totalQuestions ?? 0);
                const correctAnswers = Number(room.correctAnswers ?? 0);
                const completionPercent = Number(room.completionPercent ?? 0);

                const passThreshold = totalQuestions > 0
                    ? Math.ceil(totalQuestions * 0.5)
                    : 0;

                const finished = totalQuestions > 0 && answeredQuestions >= totalQuestions;
                const statusText = finished ? "Abgeschlossen" : "In Progress";
                const badgeClass = finished ? "bg-green-400" : "bg-teal-400";
                const cardBgClass = index % 2 === 0 ? "bg-yellow-400" : "bg-orange-400";

                const passReached = passThreshold > 0 && correctAnswers >= passThreshold;
                const passTextClass = passReached
                    ? "text-green-700 dark:text-green-400"
                    : "text-slate-950 dark:text-slate-100";

                return `
                    <a href="/room/${roomId}"
                       class="room-link block rounded-2xl ${cardBgClass} dark:bg-slate-900/60 p-6 ring-2 ring-violet-400 dark:ring-white/10 text-center text-slate-950 dark:text-slate-100 shadow-sm dark:shadow-none transition-transform hover:scale-[1.01] hover:ring-violet-300 dark:hover:ring-white/20 cursor-pointer"
                       data-room-id="${roomId}">
                        <p class="text-xs font-bold uppercase tracking-widest text-slate-700 dark:text-slate-400">
                            Raum ${roomId}
                        </p>

                        <h2 class="mt-1 text-lg font-black">
                            ${themeName}
                        </h2>

                        <p class="mt-6">
                            Beantwortete Fragen: ${answeredQuestions}/${totalQuestions}
                        </p>

                        <p class="mt-3 ${passTextClass}">
                            Richtig für Bestehen (50%): ${correctAnswers}/${passThreshold}
                        </p>

                        <div class="mt-8">
                            <span class="rounded-full ${badgeClass} px-3 py-1 text-xs font-bold text-slate-950">
                                ${statusText} (${completionPercent}%)
                            </span>
                        </div>
                    </a>
                `;
            })
            .join("");
    }

    async function loadDashboard() {
        const data = await fetchDashboardOverview();
        if (!data) {
            return;
        }

        updateHeadline(data);
        renderRooms(data.rooms ?? []);
    }

    async function openRoom(roomId) {
        if (!currentDashboardOverview) {
            const data = await fetchDashboardOverview();
            if (!data) {
                return;
            }
        }

        const activeSession = await ensureSessionForRoom();
        if (!activeSession) {
            return;
        }

        window.location.href = `/room/${roomId}`;
    }

    document.addEventListener("click", async (event) => {
        const link = event.target.closest(".room-link");

        if (!link) {
            return;
        }

        event.preventDefault();

        const roomId = link.dataset.roomId;
        if (!roomId) {
            return;
        }

        await openRoom(roomId);
    });

    loadDashboard();
</script>
</body>
</html>
